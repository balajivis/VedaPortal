  note: "The question is close to malformed — there is no Baskala reciting community. What IS recordable and achievable: the Khilani, which are edited and are sometimes recited."
findings:
  - "ATTRIBUTION IS THE WHOLE QUESTION FOR THIS SAKHA. Saunaka's Caranavyuha lists Sakala, Baskala, Asvalayana, Sankhayana and Mandukayana as separate caranas — so 'Sankhayana Brahmana = Baskala' needs an argument, not an assumption. Recorded, not resolved (rule 7). The same decision governs rigveda/shakala's brahmana and aranyaka notes."
