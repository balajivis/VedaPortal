      · Folkways/Asch 1969: in copyright, no CC licence, on archive.org only through the
        Unlocked Recordings programme. Cite, do not relicense.
      · archive.org community items: no `licenseurl` or `rights` field on any of the
        thirteen. Unresolved.
      · THE ONE CLEAN EXCEPTION: `dni.ncaa.IGNCA-IG_11_DV_60_1303-MDV`, IGNCA Media
        Centre, CC BY-NC 4.0. If anything Jaiminīya is to be embedded, it is this.
    PERSON-LEVEL CONSTRAINT: several archive.org identifiers embed personal names. They
    are reproduced here only as the URLs required to locate the resource, and nothing
    further about any individual is recorded, here or anywhere in this packet. "Paravastu"
    is treated as a lineage/tradition designation, which is what the uploader uses it as.
    THE SCHOLARSHIP THAT LOCATES THE TRADITION — full citation, since the packet brief
    asked for it: Finnian M. M. Gerety, "Survivals and Revivals: The Transmission of
    Jaiminīya Sāmaveda in Modern South India", in Jan Houben, Julieta Rotaru and Michael
    Witzel (eds.), "The Vedic Śākhās: Past, Present and Future", Harvard Oriental Series
    Opera Minora 9, 2016. Author page with photographs and video:
    finnian-gerety.squarespace.com/survivalsandrevivals/ (academia.edu 403s to automated
    clients). ITS CENTRAL FINDING, and it is sobering: Nambudiri Sāmaveda has declined to
    A SINGLE ACTIVE LINE OF NORMATIVE TRANSMISSION, and most modern lineages are a blend
    of survival and REVIVAL rather than unbroken survival. That distinction is precisely
    the kind this project exists to keep visible — a revived lineage and a continuous one
    are not the same evidence, and flattening them would be a content-discipline failure.
    ALSO: Wayne Howard, "Naṃpūtiri Jaiminīya: Chant analyses", Studia Orientalia 63 (1988),
    pp. 18–169 — FREELY READABLE at journal.fi/store/article/view/51600, and the single
    most detailed published analysis of Nambudiri Jaiminīya chant.
    Asko Parpola, "The Literature and Study of the Jaiminīya Sāmaveda in Retrospect and
    Prospect", Studia Orientalia — journal.fi/store/article/view/49825 — still the
    authoritative survey of what is edited versus manuscript-only.
    STRENGTH OF TRADITION, aggregate figures only: from an original ~21 Nambudiri families,
    roughly FIVE families in Panjal (Thrissur district) retain the practice, with active
    teaching down to a handful of students — low single- to low double-digit practitioners
    in Kerala. Sree Sankaracharya University of Sanskrit, Kalady RECORDED Kerala Jaiminīya
    chanting between 1995 and 2015; the recordings are available on request and have never
    been published. That is a concrete, institutional, unpublished corpus and it is
    probably the cheapest large win available to this project.
    Institutional location (institution level only, no individuals):
      · Panjal village, Thrissur district, Kerala — the centre of Nambudiri practice.
      · Sree Sankaracharya University of Sanskrit, Kalady — holds unpublished recordings.
      · Jaimini Sāma Veda Pāṭhaśālā, Kodunthirapully village, Palakkad, Kerala
        — IGNCA "List of Pathasalas in Kerala".
      · Jaimini Sāma Veda Pāṭhaśālā — IGNCA "List of Pathasalas in Tamilnadu", row 36.
      · Jaimini Sāma Veda Pāṭhaśālā, Thogoor, Thanjavur — appears in the IGNCA Karnataka
        list but is marked TN; a list-keeping artefact, noted so it is not double-counted.
      · Vedavedant Gurukul Mahāvidyālaya, Madipadu, Aachampet Mandal, Guntur, Andhra
        Pradesh — IGNCA "Schools of Vedic Learning: Samaveda", recension column reads
        "Kauthum and Gemini". "Gemini" is an OCR corruption of "Jaimini". Flagged as
        PROBABLE, not asserted — the PDF is machine-read and I did not confirm elsewhere.
    THE NUMBER THAT MATTERS: on IGNCA's own national Sāmaveda list of 30+ schools,
    Kauthuma appears at twenty-plus institutions and Jaiminīya at ONE.
    Rows in these PDFs that name individuals rather than institutions were skipped
    entirely, per the packet's person-level constraint. Several such rows exist.
