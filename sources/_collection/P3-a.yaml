    verified_how: >
      Downloaded the OCR text (938 KB, and unlike the DLI Sanskrit scans it OCR'd CLEANLY
      because the book is in English) and read the printed table of contents for Lecture II
      section by section, transcribing the section headings above.
    notes: >
      THE MOST PRACTICALLY USEFUL ENGLISH SECONDARY SOURCE FOUND, and free. It is a working
      lawyer's account of the six-fold ordering — written to be APPLIED to contested
      textual interpretation in an adversarial setting, which is structurally the same
      problem the project has. It compares the Mīmāṃsā rules to English canons of statutory
      construction (Maxwell), quotes Laugākṣi, Āpadeva, Kumārila and Śabara side by side on
      each term, and independently confirms the sthāna = krama identification.
      1905, public domain, clean OCR, greppable. Of everything in this packet it is the
      lowest-friction way for a non-Sanskritist to reach competence with the rule.
      CAVEAT ON FRAMING: Sarkar's purpose is to apply Mīmāṃsā to HINDU LAW, so his
      illustrations run heavily to Jīmūtavāhana and Vijñāneśvara on inheritance rather than
      to Vedic ritual. The APPARATUS is faithfully reported; the EXAMPLES are from a
      different domain. That is arguably a feature for this project — it is a demonstration
      that the method transfers — but it must not be mistaken for exposition of Śabara's
      own cases.
    date_logged: 2026-08-01

