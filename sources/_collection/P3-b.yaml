  accents_in_the_prose_layers:
    verdict: >
      **No. Not for the prose. Yes, partially, for the mantra material embedded in it.**
    method: >
      Every text was normalised to NFC first, then counted for U+0951 (udātta),
      U+0952 (anudātta), Vedic Extensions U+1CD0–U+1CFF, and — for romanised texts —
      combining U+0301 and U+0300. The U+0301 trap the protocol warns about does not
      fire here: these texts contain zero Devanāgarī, so ś/ǵ are precomposed in NFC and
      every surviving combining acute is a real accent mark on a vowel that has no
      precomposed form (vidā́, bŕ̥haspátir, ánu).
    results:
      - "TITUS Aitareya Brāhmaṇa, all 285 units, 702,836 chars: U+0951/0952 = 0,
         Vedic Ext = 0, U+0301 = 0, U+0300 = 0. Aufrecht 1879 prints the AB unaccented."
      - "Sanskrit Wikisource Aitareya Brāhmaṇa, 8 pañcikās, 409,828 chars: svara marks = 1
         (a single stray U+0951 in pañcikā 6; noise). Effectively unaccented."
      - "GRETIL Kauṣītaki Brāhmaṇa, 422,159 chars: 0 accent marks of any kind."
      - "GRETIL Śāṅkhāyana Āraṇyaka, 87,997 chars: 0 accent marks of any kind."
      - "Sanskrit Wikisource Aitareya Āraṇyaka, ~89,000 chars: 0 accent marks."
      - "TITUS Aitareya Āraṇyaka, 233,909 chars: U+0301 = 92, U+0300 = 1.
         ALL of them fall in units 15–18 — that is, Āraṇyaka 4 (30 acutes) and
         Āraṇyaka 5 adhyāyas 1–3 (15 + 26 + 21 acutes, 1 grave). Āraṇyakas 1–3
         (units 1–14) carry zero."
      - "Vedic Heritage flipbooks — sampled at full resolution and read: the Mālavīya
         Aitareya Brāhmaṇa (Sāyaṇa + Hindi), the Sāyaṇa Aitareya Āraṇyaka, and the
         Devanāgarī Śāṅkhāyana Brāhmaṇa all print the mūla WITHOUT svara. But the Sāyaṇa
         Āraṇyaka's opening śānti IS accented — श॒तं भ॑वास्यू॒तिभिः ॥ स्यो॒ना पृ॑थिवि… —
         because it is Saṃhitā-derived mantra. Same split as TITUS, in a different
         script, from a different publisher."
      - "**THE ONE EXCEPTION, and it is prose:** the *sasvara* Aitareya Upaniṣad at
         sanskritdocuments.org — 5,601 Devanāgarī chars, **329 U+0951/0952 marks plus
         33 Vedic Extensions** (U+1CDA double svarita among them), 88 of 115 lines
         accented, running through the body prose of AiĀ II.4–II.6. Verified by counting.
         No source edition is named — credited only to Premraj Ware — so its authority is
         unknown. See the record."
    THE_SCHOLARSHIP_SETTLES_IT_AND_THE_ANSWER_MATTERS: >
      The counting above says no accented witness was found. The literature says why,
      and the why is the whole project's thesis in one sentence.
      **Macdonell, *A Vedic Grammar for Students*, Oxford 1916, App. III §1, p. 448:**
      "The accent is marked in all the texts of the four Vedas as well as in two
      Brāhmaṇas, the Taittirīya (including its Āraṇyaka) and the Śatapatha (including
      the Bṛhadāraṇyaka Upaniṣad)." That list is exhaustive — only two Brāhmaṇas are
      accented, and neither is Ṛgvedic.
      **Keith, HOS 25, Introd. §43, p. 96, on the Aitareya Brāhmaṇa:** "The text as
      preserved is unaccented. **It is no doubt the case that it originally was duly
      accented, but the accents have not been preserved by the tradition.**" Keith
      immediately gives the parallel case with a date attached: the Pañcaviṃśa Brāhmaṇa
      "was once accented in the style of the Śatapatha and was still so extant at the
      time of the Bhāṣikasūtra (ii.32), but by Kumārila's time it had ceased to bear
      accents." Keith's own General Index carries the entry
      "Accents, absence of in Brāhmaṇas of the Ṛgveda, 96" — plural, so the Kauṣītaki
      is covered by the same statement. At p. 103 he adds of the two KB editions
      (Lindner, Jena 1887; Ānandāśrama 65, 1911) that "Neither is punctuated."
      **Keith, *Aitareya Āraṇyaka*, 1909, Introd. §I, p. 10, on the AiĀ:** "In the
      edition of Rājendralāla and in the MSS. A and E only are accents used. These
      accents are clearly confined to those verses not occurring in the Ṛgveda Saṃhitā
      which are quoted in full in the Āraṇyaka V. Unfortunately in the edition the
      accents are often obviously incorrect … The MSS. also, as often, are carelessly
      and inaccurately accented."
      Haug 1863 and Aufrecht 1879 print the AB unaccented and never discuss
      accentuation of the transmitted text at all — their silence is corroboration.
      **And Haug gives eyewitness testimony from living reciters, which is the strongest
      evidence in the packet.** *Aitareya Brāhmaṇam*, Introduction pp. 72–73:
      "Regarding the repetition of the Brahmanam we have to remark, that it is done in a
      very slow tone, but quite monotonously, **whilst the Brahmanas of the Yajurveda are
      recited with the proper accents, like the Samhitas.**"
      That is a man in Bombay in 1863 reporting what he heard: the Aitareya Brāhmaṇa
      chanted flat, the Yajurveda Brāhmaṇas chanted with svara, side by side in the same
      living tradition. The accent is not merely missing from the page. **It is missing
      from the voice, and it already was in 1863.**
    interpretation: >
      The count and the scholarship agree exactly, including on the fine grain: I found
      accent marks in TITUS units 15–18 and nowhere else, and Keith says the AiĀ's only
      accents are on the fully-quoted non-Ṛgvedic verses of Āraṇyaka V (and, per his
      critical notes, on the Mahānāmnīs in some MSS but "not accented at all in R").
      **So: the Ṛgveda's prose layers are unaccented, and they are unaccented because
      the accent was LOST, not because it was never there.** Keith is explicit: the AB
      "originally was duly accented." That is not a gap in our collection. It is the
      exact failure mode this project exists to document — a layer with no permuted
      recitation to error-correct it, fewer carriers, and a transmission that dropped
      its own svara while the Saṃhitā's held. The Pañcaviṃśa case even gives a rough
      window: accented at the Bhāṣikasūtra, gone by Kumārila.
      **Two rules follow, and the second is the one that will otherwise be got wrong:**
        1. Encode AB, KB, AiĀ and ŚĀ as unaccented. There is nothing to recover.
        2. Do NOT record "Brāhmaṇa prose is unaccented" as a property of the genre.
           The Śatapatha and the Taittirīya Brāhmaṇa falsify it directly, and
           sanskritweb.net (Stiehl / Sarma) publishes a fully accented Taittirīya
           Brāhmaṇa and Āraṇyaka in Devanāgarī today. Accented Brāhmaṇa prose exists,
           is typesettable, and is in print. Its absence here is specific to the
           Ṛgvedic schools.
      Register as a P5 hole with the correct framing: **the Ṛgveda's Brāhmaṇa svara is
      not undigitised — it is extinct.** Whether any Aitareya manuscript anywhere
      preserves it is a manuscript question and should be handed to P2-c as a specific
      query; Keith's answer is no, for the MSS he saw.
    THE_EXCEPTION_THAT_PROVES_IT: >
      One accented prose text exists, and its boundary is the finding.
      **The Aitareya Upaniṣad — AiĀ II.4–II.6 — is available fully accented, in prose,
      and the Brāhmaṇa prose on either side of it is not.** The split does not fall
      between mantra and prose, and it does not fall between texts. It falls at a section
      break *inside one text*, and it tracks **liturgical use**: the Upaniṣad went on
      being recited, so it kept its svara; the surrounding Āraṇyaka and the Brāhmaṇa
      stopped being recited, so they lost theirs. Haug heard exactly that in 1863 — the
      Aitareya Brāhmaṇa chanted "quite monotonously" while the Yajurveda Brāhmaṇas were
      chanted "with the proper accents".
      That is the project's whole diagnosis, visible in one text, measurable in
      codepoints, at a boundary you can point to.
      Caveat that must travel with it: the accented Upaniṣad names no source edition, and
      Keith reports that the AiĀ manuscripts accent only Āraṇyaka V's quoted verses. So
      this is almost certainly a modern notation of living recitation practice rather than
      a manuscript reading — which does not weaken the point, because living recitation
      practice is exactly what the argument is about. But it does mean `svara_verified?`
      matters here more than anywhere else in the packet.
    THE_ACCENT_THAT_IS_STILL_IN_A_VOICE: >
      **The Kauṣītaki Brāhmaṇa is recorded khaṇḍa by khaṇḍa — 268 files verified — on
      vedicheritage.gov.in.** Whether those reciters render svara or chant flat is an
      audio question this packet cannot settle and deliberately does not. But it is the
      only place where the question can still be asked of the Ṛgveda's prose layer at
      all, and it is undiscoverable by search. See the record.
    note_on_pluti: >
      The Wikisource Aitareya Āraṇyaka does preserve pluti (prolation) numerals in the
      Mahānāmnī — 'एवा ह्येवैवा ह्यग्ना३इ', 'विदो३म्' — which is prosodic notation and
      not svara, but is the one place the Devanāgarī witness records something the
      recitation needs.

