      Sāmaveda Saṃhitā (Kauthuma); Jaiminīya-Brāhmaṇa; Pañcaviṃśa/Tāṇḍya;
        Jaiminīya-Upaniṣad-Br.; Mantra-Br.; Devatādhyāya-Br.; Vaṃśa-Br.
      Aitareya Brāhmaṇa and Āraṇyaka; Kauṣītaki Br.
