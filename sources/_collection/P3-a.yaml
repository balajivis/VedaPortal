      the 1180s (renders 1183 as "1163", "1161"). The END is solid — p. 1222 is legible and
      carries the Adhikaraṇa (7) running header. Stated as approximate rather than guessed
      precise.
      Jha, in the Śābarabhāṣya volume, cross-refers to this passage twice, at Tantravārttika
      trans. pp. 1215 and 1217–1222. Both fall inside the verified range.
