  svara_source?: >
    YES — NUMERIC, and with a SECOND ANNOTATION TIER that a digit count alone will miss.
    VERIFIED VISUALLY by me, page n120 of the Sāmagānam rendered to image and read
    (Aindra Parva, "Svāra Kautsam" and "Saumedham"). What is actually on the page:
      · SUPERSCRIPT DEVANĀGARĪ DIGITS (१–६) above syllables — classic Sāma numeric svara,
        dense and systematic;
      · SUBSCRIPT DEVANĀGARĪ AKṢARAS below syllables (पा चं कि से ते का जि चु ति कः ची शे) —
        a second, independent notational tier;
      · a dash "—" used as a further marker in places;
      · stobha-extended sung text with ऽ and inline numerals (आ२३४, ५६) — i.e. the gāna
        form, not the ārcika form;
      · right-margin cross-references to the ārcika (दी.६|प.७|मा.१०)५(खौ|२८६).
    ENCODING CONSEQUENCE, and it is a real one for this project: none of this is
    expressible with U+0951/U+0952. A superscript digit plus a subscript akṣara over and
    under a Devanāgarī base is not a Vedic-accent-mark problem at all — it needs a
    deliberate encoding decision before any Sāma gāna is ingested. Protocol §3's
    "digits high ⇒ numeric Sāma notation" row is correct but incomplete: it catches the
    digits and is silent on the subscript tier, which carries equal information.
    NOTATION IS NOT EVEN UNIFORM WITHIN THE ŚĀKHĀ: the Dvārakā Sāmagānam uses numeric
    notation; the Tirupati Veyagānam uses varga-paribhāṣā LETTER notation (superscript
    consonants उ ग ण ख र ट instead of digits) — as its own title declares. Two
    incompatible encodings for one śākhā. Do not assume one parser will read both.
