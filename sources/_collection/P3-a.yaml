      heading ("PĀDA II. Authority of the Arthavāda.") and mapping sūtra numbers to printed
      page numbers across the pāda; confirmed DCS carries 1.2.1–53 by filename enumeration.
    notes: >
      THIS IS WHERE THE DISTINCTION IS TECHNICALLY ARGUED, not merely mentioned. The brief
      asked for that specifically. See summary.vidhi_arthavada for the sūtra text, the
      pūrvapakṣa, the siddhānta and the operational test derived from them.
      RELATED LOCI, both needed if the classifier is to be built properly:
        · MS 2.1.1–4 — what an injunction IS. 2.1.1: `bhāvārthāḥ karmaśabdās tebhyaḥ kriyā
          pratīyetaiṣa hy artho vidhīyate`. This is where Bhāṭṭa (bhāvanā) and Prābhākara
          (niyoga) diverge, and where Kataoka's lost GRETIL file would have helped.
        · MS 1.2.10 `guṇavādas tu` — the doctrine that an arthavāda whose literal sense
          contradicts perception is figurative. This is the sharp end of the classifier and
          the place a careless reader does the most damage.
