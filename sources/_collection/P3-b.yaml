  # RECITATION AUDIO — the accent that survives in the voice
  # =========================================================================

  - node_path: sources/vedas/rigveda/shakala/brahmana
    text: kaushitaki-brahmana
    veda: rigveda
    organization: null
    shakha: shakala
    layer: brahmana
    edition: >
      Kauṣītaki Brāhmaṇa recitation series, Vedic Heritage Portal (IGNCA, Ministry of
      Culture, Government of India). Reciter(s) not named on the media files; the series
      is embedded in Bootstrap modals on /brahmanas/kausitaki-shankhyayana-brahmana/ and
      is therefore invisible to a normal page scrape.
    url: https://vedicheritage.gov.in/Kaushitaki_Brahmana/RVKB-01.01.mp4
    script: n/a
    svara_source?: >
      **yes — in the voice.** This is the only surviving carrier of accent for any of
      the four texts. The printed and digital texts are all flat; a recitation is not.
      Whether these reciters render svara or chant monotone (which is what Haug reports
      hearing for the Aitareya in 1863) is an audio question and is NOT settled here —
      **listen before claiming it.** That listening is BV's, not a collector's.
    text_layer: n/a
    license: >
      unknown — Government of India / IGNCA, terms not stated on the media endpoint.
      **Check terms before ingesting**, per the protocol's seed-source note on
      vedicheritage.gov.in. And per this repo's rules, audio never enters git: this is a
      `recordings/_recordings.yaml` manifest entry, not a file to commit.
    status: found-partial
    where_i_looked: n/a
    notes: >
      **THE BIGGEST FIND IN THE PACKET. The Kauṣītaki Brāhmaṇa is recorded khaṇḍa by
      khaṇḍa, and the files are directly addressable at a predictable URL.**
      Pattern: `https://vedicheritage.gov.in/Kaushitaki_Brahmana/RVKB-{adhyāya:02d}.{khaṇḍa:02d}.mp4`
      **CENSUS — done by me, by HEAD-probing the full 30 × 20 grid, not inferred from the
      page: 268 files present, HTTP 200, Content-Type video/mp4.** Sizes 13–34 MB.
      Per-adhyāya count, with no gaps inside any adhyāya:
        5,9,9,10,10,11,12,12,6,10,9,10,7,7,6,10,7,9,7,6,7,6,11,8,14,14,12,8,7,9 = **268**
      **Alignment to the GRETIL/Sarma text is close but NOT exact, and this must not be
      glossed.** GRETIL's vector is
        5,9,12,10,10,10,12,12,6,10,9,10,7,7,6,10,7,9,7,6,7,6,11,8,14,14,12,8,8,9 = 271.
      They differ in three adhyāyas: **adhyāya 3 (audio 9, text 12 — three khaṇḍas with
      no recording), adhyāya 6 (audio 11, text 10), adhyāya 29 (audio 7, text 8).**
      Everywhere else they agree exactly, which is 27 of 30 adhyāyas — good enough to
      auto-align most of the text and bad enough that a blind join would silently
      mis-file audio in three places. Resolve those three before building the mapping.
      Logged `found-partial` for that reason: the series is not a complete khaṇḍa census.
      **The other three texts have NO recitation media on the portal** — I diffed all four
      pages; only the Kauṣītaki page contains .mp4 references. For the Aitareya
      Brāhmaṇa/Āraṇyaka the only recitation is event footage on YouTube, not a systematic
      series: `3QpDeeg7-Is` (Veda Rakshanam Trust pārāyaṇam), `COpkpo4HARY` (2nd Rig Veda
      Brahmana Aranyaka Parayanam, Alwarthirunagar, Chennai, 2023), `Pf_aQP998zA`
      (Aitareya Brahmanam recitation at Ayodhya), and the *Arya Rishi* channel
      (`-J01GRRlMrc`, 35 videos, verified NOT a complete series). A Facebook page
      `sarvaveda4` posts numbered "Rigveda Aitareya Brahmana Paatha" items and may be a
      real series — worth a dedicated crawl.
      **Why this matters more than its size suggests:** the project's thesis is that the
      Brāhmaṇa layer is more fragile than the Saṃhitā because it has fewer carriers and
      no permutation checksum. Here is the least-carried of the two Ṛgvedic Brāhmaṇas,
      recorded end to end, by a government body, and effectively undiscoverable. If the
      accent is in those voices it is the only place it still is.
    date_logged: 2026-08-01

  # =========================================================================
  # THE ONE ACCENTED WITNESS — and it is exactly where the thesis predicts
  # =========================================================================

  - node_path: sources/vedas/rigveda/shakala/aranyaka
    text: aitareya-aranyaka
    veda: rigveda
    organization: null
    shakha: shakala
    layer: aranyaka
    edition: >
      *Ṛgvedīya Aitareyopaniṣat*, sasvara (accented) Devanāgarī edition,
      sanskritdocuments.org. Credited only: **"Encoded and proofread by Premraj Ware."**
      **NO SOURCE EDITION IS NAMED** — a rule-6 problem recorded, not papered over.
    url: https://sanskritdocuments.org/doc_upanishhat/aitareyopaniShatsasvarA.html
    script: devanagari-unicode
    svara_source?: >
      **YES — verified by counting.** NFC-normalised: 5,601 Devanāgarī characters,
      **329 marks in U+0951/U+0952 and 33 in Vedic Extensions U+1CD0–U+1CFF**
      (including U+1CDA VEDIC TONE DOUBLE SVARITA, e.g. एवा᳚ग्र, मरीचीर्मरमा᳚पः).
      88 of 115 Devanāgarī lines carry marks; the 27 that do not are headings and
      colophons. The accent runs through the **prose body**, not merely the śānti:
      आत्मा वा इदमेक एवा᳚ग्र आसीन्नान्यत्किञ्च॑न मि॒षत् । स ईक्षत लोकान्नु सृ॑जा इ॒ति ॥ १॥
    text_layer: unicode
    license: >
      public-domain (mūla text). sanskritdocuments.org's standard terms apply to the
      encoding. Attribution owed to Premraj Ware.
    status: found-complete
    where_i_looked: n/a
    notes: >
      **This is the single accented witness to any Ṛgvedic Āraṇyaka prose that exists in
      digital form, and its locus is the whole point.** It covers exactly AiĀ II.4–II.6 —
      the Aitareya Upaniṣad — and its own colophons say so:
      'इत्यैतरेय-द्वितीयारण्यके चतुर्थोऽध्यायः' · 'इत्यैतरेयारण्यके पञ्चमोऽध्यायः' ·
      'इत्यैतरेयाण्यके षष्ठोऽध्यायः' (sic, for °āraṇyake), closing
      'इत्यैतरेयोपनिषत्सम्पूर्णा'.
      **It also settles the khaṇḍa question at that locus independently.** Its khaṇḍas run
      **continuously 1–5 across the three adhyāyas** — adhyāya 4 holds khaṇḍas 1, 2, 3;
      adhyāya 5 holds khaṇḍa 4; adhyāya 6 holds khaṇḍa 5. That is exactly what Keith
      reports from a manuscript colophon, that such a number "really means that this is
      the fourth Khaṇḍa of the whole Upaniṣad", and it corroborates his statement that
      AiĀ II.5 and II.6 are not internally divided.
      **The reading this supports, and it is the project's thesis in miniature:** the
      embedded Upaniṣad kept its svara because it kept being recited; the Brāhmaṇa prose
      on either side of it lost the svara because it stopped being recited. The boundary
      between accent and no-accent falls inside one text, at a section break, and it
      tracks liturgical use rather than genre.
      **DO NOT OVERSTATE IT.** Keith says the AiĀ manuscripts accent only the fully-quoted
      non-Ṛgvedic verses of Āraṇyaka V, and that even those are "carelessly and
      inaccurately accented". An accented Upaniṣad *prose* text is therefore almost
      certainly a modern notation of the living Upaniṣad-recitation practice, not a
      manuscript reading — and with no source edition named there is no way to tell whose
      practice. `svara_source?` is honestly `yes`; whether those svaras are *right* is
      exactly the question the hand-off seam reserves for BV and the Ghanapāṭhi.
      Formats available: HTML, ITX, and PDF in Devanāgarī, Tamil, Telugu, Kannada,
      Gujarati. Note the `.itx` is the transliteration source and carries **no** accent
      characters — take the HTML or the Devanāgarī PDF, not the ITX.
      Fetching requires a browser User-Agent; the site returns HTTP 406 otherwise.
    date_logged: 2026-08-01

