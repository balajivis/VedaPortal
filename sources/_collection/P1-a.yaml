  inbound_intelligence_p0a:
    - item: "KYVeda/texts — CONFIRMED, and better than reported"
      licence: >-
        (a) NO LICENCE. GitHub API returns `license: null`; there is no LICENSE, COPYING or
        licence statement anywhere in the 4,901-file tree, and README.md is three lines of
        description. Under the corrected reading: mūla text public-domain, license_apparatus
        unknown. Silence is not a grant.
      accent_roundtrip: >-
        (b) Baraha markers do NOT collapse to a two-way distinction, and a naive two-rule map
        WOULD LOSE DATA. Measured in `saMhitA/02/TS 2 Sanskrit.brh` (178,981 chars):
        q=13,688 (anudātta → U+0952), #=8,375 (svarita → U+0951), $=581, &=752,
        ~M=587, (gg)=155. The $ and & marks and the nasal markers carry distinctions beyond
        U+0951/U+0952 and need Vedic Extensions (U+1CD0–1CFF) to round-trip.
        VERDICT: lossless round-trip is achievable but requires a full Baraha-Vedic mapping
        table, not `q→U+0952, #→U+0951`. Budget for the table; do not assume two rules.
      kanda_coverage: >-
        (c) GENUINE, verified from the file tree rather than directory names. `.brh` files per
        kāṇḍa: K1=125, K2=96, K3=82, K4=116, K5=113, K6=96, K7=83 — all seven, none empty.
        Top-level dirs: saMhitA, TS-Padam (221 .brh), TS-Kramam (176 .brh),
        "TS Jatai Ghanam Project", "Ghana Maala", "Ghana Sandhi", brAhmaNa (29 .brh),
        AraNyaka, ekAgni, upaniShat, SikShA, "Unicode Project".
      why_it_matters: >-
        This is the strongest single result of the packet. It supplies the Taittirīya
        Saṃhitā in saṃhitā-, pada-, krama-, jaṭā- AND GHANA-pāṭha as plain text with accents.
        BV's `svara_verified?` workflow is settled against the Ghanapāṭhi — this is that text,
        machine-readable. Nothing else found in the sweep comes close.
      note: >-
        The repo's "Unicode Project" folder also holds a stray
        `वाजसनेयि-माध्यन्दिन-शुक्लयजुर्वेदः (उदीच्यः पाठः) उदात्तस्वरेणाङ्कितः-1.pdf` — an accented
        Mādhyandina reference the compilers collected. Incidental, but relevant to that node.
    - item: "GRETIL accent warning — heeded, and it cuts the other way for avs_acu.htm"
      method_check: >-
        My own counts throughout this packet targeted U+0951, U+0952 and U+1CD0–U+1CF9
        explicitly and never U+0301, so the decomposed-ś trap did not affect any record here.
      gretil_avs_finding: >-
        `avs_acu.htm` (Atharvaveda-Saṃhitā, Śaunaka, ACCENTED TEXT) is GENUINELY ACCENTED but is
        NOT DEVANĀGARĪ — it is Roman transliteration, 0 Devanāgarī characters, ~490k Latin.
        Its accents are combining marks on Latin vowels, and here the U+0301s are real:
        NFD acute total 85,649 minus 6,684 belonging to ś = 78,965 genuine udātta, plus 1,248
        grave (svarita). The file's own header table documents the scheme (`e udatta é`,
        `e svarita è`, `long u udatta ū́`).
        So the same codepoint is a false positive on GRETIL's Ṛgveda and a true positive here.
        The rule that generalises is: check what the mark sits ON, not just that it is present.
      licence: >-
        Verbatim from the file: "COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE FILE." — it defers
        to the TITUS source terms rather than granting anything. Not CC.
    - item: "TITUS — holdings and terms recorded, no bulk content fetched"
      fetched: "only texte2.htm, the public index. No text files retrieved."
      terms: >-
        All-rights-reserved, per the coordinator. The site's own etikett.htm returns 404;
