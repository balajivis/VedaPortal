      into this file. SARIT's web application returns HTTP 502/400 and looks dead; the
      corpus is nonetheless fully available as TEI-P5 on GitHub. A rendered page that will
      not load is not an absent resource.
      WHAT THIS CHANGES, concretely: a usable machine-readable Tantravārttika DOES exist.
