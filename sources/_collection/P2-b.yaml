  RV Bāṣkala, KYV Kaṭha/Maitrāyaṇī/Kapiṣṭhala, SV Rāṇāyanīya, AV Paippalāda carry no
  `apparatus:` block today; nothing in this sweep argues for creating one, except that a
  **Śāṅkhāyana-śākhīya Ṛgveda Saṃhitā padapāṭha** exists in print (see §2) which bears on
  Bāṣkala/Śāṅkhāyana questions — flagged to P2-a, not claimed here.

  THE SINGLE MOST LOAD-BEARING FINDING FOR ACCENT WORK:
  The Taittirīya Prātiśākhya is fully available, complete, in two independent forms, and it
  states its own accent inventory. TP 24.5 — the penultimate sūtra, read directly out of
  tp-comb.pdf — enumerates the properties a Veda-reader must know and names exactly three
  accent qualities: `svarita, udātta, nīcatva` ("circumflex, acute, grave", Whitney's rendering),
  alongside quantity (hrasva/dīrgha/pluta), weight (guru/laghu), and the recitation
  transformations (lopa/āgama/vikāra; prakṛti/vikrama/krama). This is the branch's own answer
  to "how many accent classes does Taittirīya mark", and it settles it at three marked classes
  plus quantity — a question no printed edition states in prose. TP is therefore the correct
  ground truth for any accent-aware OCR target on the anchor śākhā, and it is sourced.

