layers:
  samhita:   { status: sourced, note: "Jaiminiyasamavedasamhita: Text of Kerala Tradition (Arcika, Sama and Candrasama portions), ed. K. A. Ravindran, National Mission for Manuscripts / Nag Publishers, 2013, 2 vols, ISBN 978-93-80829-20-3. Free. Prints in DEVANAGARI AND MALAYALAM, preserving the Kerala script transmission. Absent from every accented-Devanagari publisher — a structural fact about who publishes what, not a search failure." }
  brahmana:  { status: sourced, note: "Five free scans located and apparently nobody working them — the scarcity is of ATTENTION, not copies. Raghu Vira & Lokesh Chandra 1954; Caland 1919 (German selection). VedicReserve holds an 846-page legacy-font copy, the largest single text in the sweep. Separate text, same layer: Jaiminiya Arseya Brahmana (Burnell 1878; B.R. Sharma)." }
  aranyaka:  { status: sourced, note: "THERE IS NO SEPARATE JAIMINIYA ARANYAKA. In this sakha the Aranyaka IS the Jaiminiya Upanisad Brahmana (Talavakara Aranyaka) — positively confirmed, not merely argued: no separate edition exists in any script, and vedicheritage's own /aranyakas/jaiminiya-aranyaka/ returns 404. Editio princeps Oertel, JAOS 16, 1896; Rama Deva, D.A.V. Lahore 1921." }
  upanishad: { status: enumerated, note: "Kena (Talavakara) embedded in the Jaiminiya Upanisad Brahmana — cross-reference, do not duplicate" }
