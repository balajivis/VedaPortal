    titus.uni-frankfurt.de/texte/etcs/ind/aind/ved/vedtx.htm → hard 404.
    The working index is /texte/texte2.htm#ved (200, 327,940 B), a single flat all-languages page.
  notes: >
    LICENCE IS THE BLOCKER, NOT THE FORMAT. Verbatim, on every text page:
      "This text is part of the TITUS edition of … Copyright TITUS Project, Frankfurt a/M,
       [date]. No parts of this document may be republished in any form without prior
       permission by the copyright holder."
    All rights reserved. No CC. LINK ONLY, and not even quotable at length without permission.
    A request to the TITUS Project is the correct next action if accented Yajurveda matters —
    and it does, because TITUS is the only place it exists in Unicode.
    CORRECTING THE RECORD: GRETIL describes TITUS as "restricted download / proprietary format"
    and that phrase has propagated into every downstream description including, until this
    sweep, this project's assumptions. It is wrong on both counts for the web corpus. There are
    three delivery paths:
      (1) /texte/etcs/… — public UTF-8 transliteration, accents as NFD U+0301. No font hacks.
      (2) /texte/etcd/… — public UTF-8 Devanāgarī with real U+0951/U+0952 accent marks.
      (3) /private/texte/indica/vedica/…*.txt — labelled "TITUS Members only" but NOT actually
          access-controlled (rvarpp.txt 5,132,357 B and av.txt 798,190 B both returned 200 with
          full payload, no auth, no cookie). THIS is what GRETIL means by "proprietary format":
          legacy DOS-codepage plain text (CP437 bytes, not valid UTF-8) in a Harvard-Kyoto-ish
          scheme with ASCII accent markers (`/` before an accented vowel, `\` for svarita).
          It is not WordCruncher binary.
      The separate "TITUS Text Retrieval Engine" (/texte/textex.htm) is a query UI, not an export.
    THAT THE FILES ARE FETCHABLE DOES NOT MAKE THEM AVAILABLE. Binding rule 1 applies: record
    the URL, take nothing. Do not scrape.
