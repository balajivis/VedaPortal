    shakha_stated: >
      NONE, for 117,402 of 117,406 records. The four exceptions, quoted verbatim from the
      catalogue's own `title` field:
        (Mādhyandinaśākhīya)Rudrādhyāya    — id aaingmcp_ngmcpdocument_00054346,
                                             NGMPP H 341/23, 8 ff., Devanagari, subject=Veda
        (Taittirīyaśākhīya)Rudrādhyāya     — subject=Veda
        (Yajurvedoktakaṭhaśākhīya)Kaṭhopaniṣad — subject=Upaniṣad
        (Yajuḥśākhīya)Upakarmotsarjanavidhi    — subject=Karmakāṇḍa
      Recorded exactly as printed. No śākhā inferred for anything else, per protocol rule 7.
    images_digitised: none
    images_public: no
    image_access_path: >
      The catalogue is metadata-only. Verified: `derCount:[1 TO *]` returns numFound=0 —
      not one of the 175,818 objects has a digital derivative attached. The `hhscan` and
      `ktmscan` object types are NOT online images; fetching
      /api/v1/objects/aaingmcp_hhscan_00001257 returns only case / reel / series / title_id —
      i.e. the shelf location of a physical microfilm copy. The `link` field on a document
      points to one of these (18,861 documents carry a link; 190 of those are subject=Veda),
      so it means "a microfilm copy of this exists at that shelf," not "an image exists here."
      The `ktmscan` counterpart is a Kathmandu-side SCANNING record: fetching
      /api/v1/objects/aaingmcp_ktmscan_00003859 returns a scan date of 2006-08-13, reel/box
      numbers and an operator's initials — evidence that film-to-digital scanning was being
      done in Kathmandu twenty years ago. Those digital files are not exposed anywhere in
      this catalogue. That is the gap: the scanning largely happened; the publishing did not.
      Physical route, per the project's own access page: microfilms may be consulted in the
      Lesesaal der Orient- und Ostasienabteilung, Staatsbibliothek zu Berlin (a complete copy
      of every NGMPP film was given to the Deutsche Morgenländische Gesellschaft and placed
      on permanent loan there). New copies must be ordered from the National Archives,
      Ram Shah Path, Kathmandu (mail@nationalarchives.gov.np). The same page states that
      "with effect from January 1, 2014" the Nepal Research Centre in Kathmandu CANNOT accept
      manuscript copy orders, because the NAK order queue is already full.
    access_requirements: >
      Catalogue: none — no login, no registration, no rate limit encountered.
      Images: in-person at Berlin, or an order placed directly with NAK Kathmandu, which the
      project itself describes as a saturated queue. This is the bottleneck.
    license: copyright-link-only
    image_license: not-applicable — no images served
    license_notice_verbatim: >
      "© 2016 Universität Hamburg. Alle Rechte vorbehalten." (footer of
      https://catalogue.ngmcp.uni-hamburg.de/content/index.xml). No open-data statement, no
      CC licence, no terms-of-use page found. The same page states "The curation of the
      catalogues and integration of digitized material is work in progress" — i.e. Hamburg's
      own stated intent is to integrate digitised material, which has not happened.
      Note the distinction the project applies elsewhere: bare catalogue FACTS (reel number,
      folio count, accession number, title) are not themselves copyrightable subject matter
      under Feist; the descriptive prose and the transcribed excerpts are the editors' work.
      Treat as link-and-cite, credit NGMCP by name, and do not republish the descriptive
