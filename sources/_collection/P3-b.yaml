    url: https://archive.org/details/aitareyarayaka0000unse
    script: devanagari-legacy-font
    svara_source?: >
      **partial, and its own editor warns against it.** Keith p. 10: "In the edition of
      Rājendralāla and in the MSS. A and E only are accents used. These accents are
      clearly confined to those verses not occurring in the Ṛgveda Saṃhitā which are
      quoted in full in the Āraṇyaka V. Unfortunately in the edition the accents are often
      obviously incorrect… The MSS. also, as often, are carelessly and inaccurately
      accented, and it is therefore not possible to lay stress on the accentuation of any
      rare words." Critical notes add "Accents do not appear in A, D, P, O, K, L, S",
      "E omits accents, and K has the accents in many cases obviously wrong", and of
      Āraṇyaka IV "This Adhyāya is not accented at all in R".
      **This is the only accented printed source in the entire packet.**
    text_layer: mixed
    license: >
      public-domain — 1909, US PD; Keith d. 1944, PD in life-plus-70 jurisdictions
      since 2015.
    status: found-complete
    where_i_looked: n/a
    notes: >
      **Sanskrit text AND translation in one volume, all five āraṇyakas, with a full
      apparatus criticus over MSS A B C D F G K L O P W X.**
