  # =========================================================================
  # 3. VIDHI vs ARTHAVĀDA — where it is actually argued
  # =========================================================================
  vidhi_arthavada:
    primary_locus: "Jaimini, Mīmāṃsāsūtra 1.2.1–18 (the arthavāda adhikaraṇas of Adhyāya I, Pāda II)"
    the_hinge_sutra: "MS 1.2.7 — vidhinā tv ekavākyatvāt stutyarthena vidhīnāṃ syuḥ"
    hinge_sutra_gloss: >
      "But [the arthavādas], BECAUSE THEY FORM A SINGLE SENTENCE WITH THE INJUNCTION
      [ekavākyatvāt], exist for the sake of PRAISING the injunctions [stutyarthena]."
    why_this_is_the_classifier_the_project_wants: >
      Read the pūrvapakṣa and the siddhānta together and the distinction stops being a
      label and becomes a TEST.
        Pūrvapakṣa (MS 1.2.1): "āmnāyasya kriyārthatvād ānarthakyam atadarthānāṃ tasmād
        anityam ucyate" — since the Veda exists to enjoin action, the parts that do not
        serve that purpose are USELESS, and so the Veda is declared unreliable there.
        Śabara's examples are exactly the passages a modern reader trips over: "he wept,
        and because he wept Rudra was called Rudra" (TS 1.5.1); "Prajāpati cut out his own
        fat" (TS 2.1.1); "the gods, arriving at the sacrificial ground, did not know the
        directions" (TS 6.1.5).
        Siddhānta (MS 1.2.7): they are NOT independent assertions and were never meant to
        be read as such. They are syntactically bound to an injunction and their function is
        to make it attractive (prarocanā). Śabara's argument is a sentence-unity argument,
        not a piety argument: the praise-words are sākāṅkṣa — they have unfulfilled
        expectancy — so they CANNOT stand alone, and reading them alone is a grammatical
        error before it is a hermeneutic one.
      THE OPERATIONAL TEST, therefore: does the passage, taken by itself, leave a syntactic
      expectancy unfilled? If yes, it is a vākyaśeṣa of some injunction and must be read
      with it. THE CLASSIC MISREADING the project names — treating an arthavāda as a
      standalone propositional claim about the world — is on this account a failure to
      complete the sentence.
    where_to_read_it:
      sanskrit_sutra: "GRETIL sa_jaimini-mImAMsAsUtra.xml, Jaim_1,2.1 – 1,2.18"
      sanskrit_bhasya: "GRETIL sa_jaimini-mImAMsAsUtra-1-7-comm.xml, MS_1,2.1 – MS_1,2.18"
      english_bhasya: "Jha, Śābara-Bhāṣya Vol. I (GOS 66), pp. 51–64. MS 1.2.7 at pp. 54–56."
      english_varttika: "Jha, Tantravārttika Vol. I (Bibliotheca Indica, 1924), pp. 1–103 — Adhyāya I Pāda II opens the translation."
      compact_manual: "Laugākṣi Bhāskara, Arthasaṃgraha (tr. Thibaut 1882) and Āpadeva, Mīmāṃsānyāyaprakāśa (ed./tr. Edgerton 1929) — both give the fivefold classification of Vedic sentences (vidhi · mantra · nāmadheya · niṣedha · arthavāda) in a few pages. THIS IS THE ENTRY POINT, not Śabara."
      best_digital_text: "SARIT's TEI-P5 Tantravārttika (CC BY-SA 4.0) — covers MS 1.2 AND MS 2.1.1–4, structurally addressable to the sūtra, Unicode Devanāgarī. See sources/darshana/mimamsa/tantravarttika/sarit-tei. This is the one to build the classifier against."
    contestedness_note: >
      The project's schema treats vidhi/arthavāda as `native_posthoc` classification that is
      itself contested, and records who says so. Confirmed contested, and the contest has a
      name: Bhāṭṭa and Prābhākara disagree on what an injunction even IS. For Kumārila the
      force of a vidhi is bhāvanā (a productive urging aimed at a desired result — hence the
      arthavāda's praise has real work to do in motivating). For Prabhākara it is niyoga
      (a duty binding independently of any desire — praise is structurally less necessary).
      That is not a footnote to the classification; it is a disagreement about its ground.
      RECORD BOTH NAMES ON THE NODE. The primary texts for the two positions are Kumārila's
      Tantravārttika ad MS 2.1.1–4 and Prabhākara's Bṛhatī / Śālikanātha's Prakaraṇapañcikā.

  # =========================================================================
  # 4. WHAT IS GENUINELY UNAVAILABLE
  # =========================================================================
  genuinely_unavailable:
    - item: "Ṭupṭīkā (Kumārila on MS 4–12) in English"
      note: >
        No English translation located, and none is believed to exist. Sanskrit is fine
        (Benares SS 1904, and inside the Ānandāśrama edition). Consequence: MS adhyāyas
        4–12 have Śabara in English (Jha) but NO Bhāṭṭa vārttika in English. If the project
        ever needs Kumārila on a sūtra above 3.8, it needs Sanskrit.
    - item: "Bṛhatī (Prabhākara) in English — any part"
      note: >
        No translation located, complete or partial. The Prābhākara position is reachable
        in English ONLY through exposition (Jha 1911, PD) or through modern in-copyright
        monographs (Freschi 2012). The primary text is Sanskrit-only. This is the single
        largest linguistic gap in the packet.
    - item: "Bṛhatī — the text itself is incomplete"
      note: >
        Distinguish from the above. The Bṛhatī does not survive whole; the Madras edition
        was issued in parts across three decades precisely because the material came in
        pieces. Coverage of individual volumes was verified here by running-header analysis
        rather than trusted from title pages — the title pages are ambiguous and one of
        them is misleading (see the Bṛhatī records).
    - item: "Muktabodha Digital Library — catalogue behind a server-side access gate"
      note: >
        Probed hard per rule 11 (twelve API/metadata paths, two advertised GitHub repos,
        both legacy hostnames). The Turnstile gate is enforced server-side — every path
        302s to /welcome — so this is a genuine access control, not a JS rendering
        artefact, and I did not attempt to pass it. The probing was still worth it: it
        established the correct legacy hostname (muktalib7.COM, not .org), the licence
        (CC BY-NC 4.0 for the E-Text Library; all-rights-reserved for the Gokarna Vedic
        Collection), and that their own advertised open-data repositories are currently
        404 mid-migration. Low prior probability of Mīmāṃsā content regardless.
    - item: "sanskritdocuments.org — no Pūrva-Mīmāṃsā at all"
      note: >
        Swept the site index and the śāstra / vedanta / major-works sections. The only hits
        for the string "mīmāṃsā" are unrelated Vedānta and poetics titles
        (tattvamīmāṃsā, śuddhādvaita...brahmavidyādhigamaprakāramīmāṃsā). NO Jaimini, no
        Śabara, no Kumārila, no Prabhākara. Clean not-found; do not re-sweep.
    - item: "Three GRETIL entries are indexed but DEAD"
      note: >
        sa_zabara-mImAMsAsUtrabhASya-1 (Somadeva Vasudeva's Śābarabhāṣya ad 1,1.1–5),
        sa_kumArila-tantravArttika-2 (Kei Kataoka's Tantravārttika ad MS 2,1.2–4), and
        sa_khaNDadeva-bhATTadIpikA1-3 are all listed on GRETIL's index page with three
        links each (XML / HTML / plaintext). All nine URLs return 404. Verified with GET,
        not just HEAD. The Kataoka file is the painful one — it is a critical edition of
        exactly the vidhi-definition passage. Report to GRETIL; meanwhile treat as absent.
        NOTE that SARIT independently covers that same passage (MS 2.1.1–4) in
        ordinary-edition form, so the Kataoka loss now costs a critical apparatus rather
        than the text itself. See rule_11_correction.

  # =========================================================================
  # 4b. A RECORD I GOT WRONG, AND WHAT FIXED IT
  # =========================================================================
