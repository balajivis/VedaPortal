      Devanāgarī, under an explicit CC BY-SA 4.0 grant.
      LICENSING IS UNUSUALLY CLEAN HERE and should be honoured as stated rather than
      argued away under rule 9: SARIT declares "Copyright 2014-2018 SARIT, CC BY-SA 4.0".
