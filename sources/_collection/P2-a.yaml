- node_path: vedas/rigveda/bashkala/upanishad
  veda: rigveda
  organization: null
  shakha: bashkala
  layer: upanishad
  proposes_new_node: true
  edition: >
    TWO DISTINCT TEXTS, and they must not be conflated:
    (a) Kauṣītaki Upaniṣad — embedded at Śāṅkhāyana Āraṇyaka 3–6. Lives in the āraṇyaka
        record above; cross-referenced, not duplicated.
    (b) Bāṣkalamantra Upaniṣad — a short independent text, c. 25 verses, attributed to the
        Bāṣkala caraṇa. E-text on TITUS, data entry T. Ježić (Zagreb), OPEN.
  url: https://titus.uni-frankfurt.de/texte/etcs/ind/aind/ved/postved/upanisad/baskmup/baskm.htm
  script: transliteration
  svara_source?: unknown — not fetched
  svara_verified?: pending — BV
  text_layer: unicode
  license: copyright-link-only
  status: found-complete
  where_i_looked: >
    TITUS Vedic index (Bāṣkalamantra-Upaniṣad listed openly under post-Vedic Upaniṣads);
    archive.org; sanskritdocuments.org; secondary discussions of the minor Upaniṣads.
  notes: >
    THE BĀṢKALAMANTRA UPANIṢAD IS THE ONE TEXT IN THIS PACKET THAT BEARS THE ŚĀKHĀ'S OWN
    NAME and survives independently — which makes it disproportionately important to a
    node whose saṃhitā is lost. It is the only place "Bāṣkala" attaches to a living text
    without an attribution argument attached.
    Reported to belong to the oldest stratum of Upaniṣads, and to address the supreme
    being as Indra — itself an archaism. That is secondary characterisation, not verified
    here, and should not be repeated as settled.
    TITUS files it under POST-VEDIC Upaniṣads in its own taxonomy (…/ved/postved/upanisad/…)
    even while the text is described as archaic. Recording the discrepancy rather than
    smoothing it: TITUS's directory placement and the "oldest layer" characterisation are
    in tension, and someone should reconcile them before this node is written up.
    The Kauṣītaki Upaniṣad carries the same Bāṣkala-vs-Śāṅkhāyana attribution question as
    the two records above. The Bāṣkalamantra does NOT — its attribution is in its name.
    PROPOSES A NEW NODE. The Bāṣkalamantra alone would justify it, independently of how
    the Kauṣītaki question is decided.
  date_logged: 2026-08-01

