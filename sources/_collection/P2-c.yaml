  - holding_id: ngmcp-hamburg/descriptive-catalogue
    institution: Universität Hamburg, Asien-Afrika-Institut (NGMCP)
    collection: NGMCP Descriptive Catalogue — the deep tier (archived MediaWiki, now static HTML)
    country: Germany (describing manuscripts physically in Nepal)
    catalogue_url: https://www-archiv.fdm.uni-hamburg.de/ngmcp/index.html
    machine_queryable: bulk-file
    query_endpoint: https://www-archiv.fdm.uni-hamburg.de/ngmcp/index.html
    query_verified: >
      Verified 2026-08-01. The live wiki is DEAD: catalogue.ngmcp.uni-hamburg.de/wiki/* and
      ngmcp.fdm.uni-hamburg.de/mediawiki both redirect to catalogue-old.ngmcp.uni-hamburg.de
      and return HTTP 404; the MediaWiki api.php is gone. Anyone following the URLs printed in
      the literature will conclude the descriptive catalogue is lost. It is not.
      It survives as a flat static archive. The index page is a single HTML file linking
      15,834 per-manuscript pages (I parsed and counted them). Filenames are
      `<series>_<reel>-<entry>_<Title>.html`, DOUBLE percent-encoded — decode twice or the
      fetch 404s. No auth, no session, no JS. This is the single easiest bulk harvest in the
      packet: one index fetch plus 15,834 small static GETs.
      Sample record fetched and read in full —
      https://www-archiv.fdm.uni-hamburg.de/ngmcp/A_1115-17_Atharvaveda.html — which yields:
      title, subject (Veda), script (Devanagari), language, material (Nepali paper), state
      (incomplete), size, folio count, lines per folio, a paragraph on foliation, place of
      deposit (NAK), accession no. (6/2056), manuscript features, available folios, and —
      the reason this tier matters — a transcribed INCIPIT and EXPLICIT with exposure
      references, plus microfilm reel, date of filming, exposure count, and cataloguer
      initials. That is enough to machine-match a manuscript against a known recension.
    record_count: 15,834 descriptive entries (vs 117,406 in the index tier — ~13% coverage)
    vedic_material: >
      NOT PRECISELY DETERMINED, and I measured how wrong the easy answer is rather than
      reporting it. 428 of the 15,834 filenames match a Vedic-vocabulary regex (veda /
      saṃhitā / brāhmaṇa / āraṇyaka / upaniṣad / prātiśākhya / śākhā / sūkta / kalpa /
      gṛhyasūtra / śrautasūtra). I then fetched a random 40 of those 428 and read the
      authoritative "Subjects" line inside each page. Result: only 4 of 40 are actually
      subject=Veda (plus 3 Upaniṣad, 2 Vedānta, 1 Karmakāṇḍa). The rest are Āyurveda 8,
      Tantra 6, Stotra 6, Jyotiṣa 5, Yoga 1, Vyākaraṇa 1 — the regex is catching
      Bṛhatsaṃhitā, Vāmadevasaṃhitā, Āyurvedaprakāśa and similar. So filename matching has
      roughly 10% precision here and must not be used as a count.
      It also under-counts: many genuinely Vedic entries carry no matching token at all
      (Rudrādhyāya, Anuvākādhyāya, Acchāvākaśāstra).
      The defensible estimate is proportional: the descriptive tier covers 15,834 of 117,406
      records (13.5%), so if Vedic material is covered at the same rate the descriptive tier
      holds on the order of 300 subject=Veda entries.
      I then tested that estimate with a second, unbiased sample: 500 pages drawn at random
      from the FULL 15,834 (not from the regex hits). 130 returned a readable Subjects line
      (the rest failed to parse in the harness run and are not counted). Of those 130,
      ZERO are subject=Veda — the observed classes were Stotra 28, Karmakāṇḍa 20, Bauddha 13,
      Jyotiṣa 12, Tantra 9, Nyāya 6, Kāvya 6, Āyurveda 4, Vyākaraṇa 4, Purāṇa 4, and a tail
      including Upaniṣad 1 and Chandaḥśāstra 1.
      Zero hits in 130 puts a 95% upper bound of roughly 2.3% on the Veda share, i.e. FEWER
      than ~360 entries, and is equally consistent with ~100. So: the descriptive tier holds
      somewhere on the order of 100–300 Vedic entries, and I am not going to pretend to a
      tighter number. Getting the true figure requires fetching all 15,834 pages and reading
      the Subjects line — cheap, and worth doing as step one of any triage pipeline.
      Named examples verified: A 1108-5 Ṛgvedaprātiśākhyabhāṣya; A 1115-17 Atharvaveda
      (NAK 6/2056, 27 ff., Devanagari, incipit and explicit both transcribed).
    shakha_stated: >
      None in the sample examined. A 1115-17 is catalogued as "Atharvaveda", subject "Veda",
      with no recension named — despite the entry transcribing both incipit and explicit.
      Explicitly NOT inferred to Śaunaka here. Determining recension from those transcribed
      excerpts is exactly the downstream work this packet is mapping, not work this packet does.
    images_digitised: none
    images_public: no
    image_access_path: same as the index tier — microfilm at Berlin, or order from NAK Kathmandu
    access_requirements: none for the catalogue
    license: copyright-link-only
    image_license: not-applicable — no images served
    license_notice_verbatim: >
      Same Universität Hamburg all-rights-reserved footer as the index tier. Each archived
      page carries its MediaWiki provenance line, e.g. 'Retrieved from
      "http://ngmcp.fdm.uni-hamburg.de/mediawiki/index.php?title=A_1115-17_Atharvaveda&oldid=10027"'.
      Per-entry cataloguer initials are printed on each record; credit them where used.
    status: found-complete
    notes: >
      A partial mirror exists at https://github.com/INDOLOGY/NGMCP-Descriptive-Catalogue
      ("Mirror of the Hamburg NGMCP-Wiki files"), ~24 MB, licence CC0-1.0, still being pushed
      to as of 2026-02-21, content under `docs/`. CC0 on a mirror is the community's
      assertion, not Hamburg's — see the licence note in the packet caveats.
      RISK: this tier lives on a URL with "archiv" in the hostname, is unmaintained, and the
      primary copy it replaced has already gone dark once. It is the highest-value and most
      fragile artefact found in this packet.
    date_logged: 2026-08-01

  - holding_id: national-archives-nepal/online-catalogue
    institution: National Archives of Nepal (Rāṣṭriya Abhilekhālaya), Ministry of Culture, Tourism & Civil Aviation
    collection: Online Catalogues — the NAK holdings, independently published
    country: Nepal
    catalogue_url: http://narchives.gov.np/List.aspx
    machine_queryable: postback-scrape
    query_verified: >
      Verified 2026-08-01 by completing a real filtered query, not by reading the page.
      It is ASP.NET WebForms: there is no API and no GET query interface — every filter is a
      __doPostBack. To query it you must GET List.aspx, extract __VIEWSTATE /
      __VIEWSTATEGENERATOR / __EVENTVALIDATION, then POST all six dropdowns back. The
      unselected dropdowns must be posted with the literal value `-- Select --`; posting
      empty strings fails event validation with an ASP.NET 500 and a stack trace. I hit that
      error first, then got a clean result.
      Working query executed: ddlSubject=`V` (Veda), all other dropdowns `-- Select --`,
      btnFilter=`Apply Filter` → HTTP 200, "Total Records: 2179", results table with columns
      S.N / Title / Language / Script / Date / Material / Folios / Access / State / Reel No.
      / Subject. First rows returned: "(...)Sūkta" (A 588/17, 83 ff., acc. 4/2226);
      "(Āśvalāyana or Pāraskara?)Gṛhyasūtrabhāṣya" (B 407/7, SAM 1648, 206 ff.);
      "(Atharvavedokta)Kṛtyāsūkta" (A 1152/15, VS 1938, 6 ff.); "(Bṛhad)Ṛgvidhāna" (A 437/39).
      Also served: the site is plain HTTP, no TLS.
    record_count: 114,552 total records
    vedic_material: >
      2,179 records under subject `V | Veda`, verified by running the filter. (NGMCP's
      independent count for the same corpus is 2,349 — the two catalogues do not agree
      exactly, which is itself useful: they are separately maintained derivatives of the
      same survey, and a triage pipeline should treat them as two sources to reconcile, not
      one source mirrored twice.)
      Adjacent subject codes, each verified by running the same postback filter, with the
      NGMCP figure for the same class alongside:
        Up | Upaniṣad ........................ NAK  806  vs NGMCP    813
        Ch | Chandaḥśāstra ................... NAK  213  vs NGMCP    213   (exact agreement)
        Kk | Karmakāṇḍa (vaidika, āgamika…) .. NAK 30,311 vs NGMCP 34,061
        V  | Veda ............................ NAK 2,179 vs NGMCP  2,349
      Chandaḥśāstra agrees exactly; Veda and Karmakāṇḍa do not. The divergence is the
      interesting part — it is concentrated in the big, loosely-bounded classes, which is
      where reclassification decisions get made. Reconciling the two lists on reel number
      would surface several thousand records where the two cataloguing efforts disagreed
      about what a manuscript is, and disagreement is a triage signal, not noise.
      The subject vocabulary is the SAME controlled list NGMCP uses — Ch | Chandaḥśāstra,
      Kk | Karmakāṇḍa (vaidika, āgamika, tāntrika, etc.), M | Mantra, Up | Upaniṣad,
      V | Veda — 52 subject codes, so subject-level filtering is directly comparable
      across the two catalogues.
    shakha_stated: none observed in the returned rows; the schema has no śākhā column
    images_digitised: partial — and not through this catalogue
    images_public: no
    image_access_path: >
      This catalogue returns metadata and shelf references only; the "Access" column is an
      accession number, not a link. Physical consultation at Ram Shah Path, Kathmandu.
      Separately: in March 2024 the CSMC (Hamburg) and Staatsbibliothek zu Berlin, funded by
      the DFG, digitised the complete NGMPP **X series** microfilms and handed the digital
      copy to the National Archives — closing a gap in the archives' own holdings. Verified
      against the CSMC announcement
      (https://www.csmc.uni-hamburg.de/news/2024-03-19-x-series.html): the X series is
      ~700 manuscripts, the films were held at the Berlin State Library, the handover was
      17 March 2024. The announcement gives NO portal URL and makes NO statement about public
      online access or ordering. That digitised set is not exposed on this website or on any
      site reached in this packet, and must not be assumed requestable.
      Scale check, from the CSV analysis logged under the NGMCP record: the X series
      contributes exactly ONE manuscript to the 2,349-record Vedic subset. The 2024
      digitisation is real and welcome and is very nearly irrelevant to Vedic material.
    access_requirements: >
      Catalogue: open, no login. Images/originals: in-person or by order to the Director,
      National Archives, Ram Shah Path, Kathmandu — mail@nationalarchives.gov.np. Hamburg's
      own access page states the NAK copy-order queue was already saturated as of 2014.
    license: unknown
    image_license: unknown
    status: found-complete
    notes: >
      Reel numbers in this catalogue (e.g. "A 1152/15") are the NGMPP reel identifiers, so
      this catalogue and NGMCP join on reel. THE JOIN IS VERIFIED, not assumed: I parsed the
      first results page of the subject=Veda query (the form paginates at 100 rows), derived
      95 distinct (series, reel, entry) keys, and matched them against the 2,012 distinct
      keys in the NGMCP Vedic CSV. 95 of 95 matched. Zero NAK-only keys. The join is clean
      and needs no fuzzy matching.
      Running both and reconciling therefore gives a stronger Vedic manuscript list than
      either alone, and the count discrepancies (2,179 vs 2,349) mark exactly where the
      metadata is uncertain.
      Harvest cost: 2,179 records at 100 rows/page is ~22 postbacks, each needing a fresh
      __VIEWSTATE from the preceding response. Trivial, but it must be sequential and
      session-bound — this is not a parallelisable fetch.
      Related but distinct: National Digital Library Nepal (https://ndl.gov.np/) runs the
      Nepal National Union Catalog on Koha at
      https://nuc.ndl.gov.np/cgi-bin/koha/opac-search.pl. Verified 2026-08-01: OAI-PMH is
      DISABLED (oai.pl?verb=Identify returns a Koha errorpage.tt), but the RSS/atom output
      IS live and is a usable machine interface —
      https://nuc.ndl.gov.np/cgi-bin/koha/opac-search.pl?q=veda+manuscript&format=rss2
      returns well-formed RSS with opensearch and Dublin Core namespaces. This is a union
      catalogue of LIBRARY holdings, though, not a manuscript catalogue; I did not confirm
      any manuscript-level Vedic records there and claim none.
    date_logged: 2026-08-01

