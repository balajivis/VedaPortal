findings:
  - "NO PADAPATHA EXISTS, AND THAT FOLLOWS FROM HOW THIS SAKHA SURVIVED. The Paippalada came down OUTSIDE the oral lock — a manuscript that escaped the rot long enough to be found in 1957, i.e. a survival lottery rather than a preservation system. A padapatha is a PRODUCT of that lock. The word-divisions in the modern critical editions are editorial reconstructions by Griffiths, Lubotsky and Zehnder — real and useful, but a scholar's analysis, not the tradition's authority. Tag modern_etic and machine-split, never inherited."
  - "THE ODISHA STATE MUSEUM'S 1973 CATALOGUE STATES IT HOLDS TEN PAIPPALADA MANUSCRIPTS, against ONE record in India's national manuscript database. The national database undercounts this text by an order of magnitude. See the manuscripts register."
  - "SEARCH TRAP, recorded because it nearly produced a false finding about this exact text: query=paippalada returns EMPTY in the national database; query=Paippal returns three. A zero-result query is a claim about the query, not the collection."
