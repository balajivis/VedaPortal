      Content map: 1–2 Mahāvrata · 3–6 Kauṣītaki Upaniṣad · 7–8 Saṃhitopaniṣad
      (ŚĀ 7 opens with the same 'ṛtaṃ vadiṣyāmi' śānti as the Aitareya Saṃhitopaniṣad
