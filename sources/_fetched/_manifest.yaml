  # ---------------------------------------------------------------------------
  # THE APASTAMBA DECISION — which source was taken, and why
  # ---------------------------------------------------------------------------
  apastamba_decision: >
    A CLEAN SANSKRIT SOURCE WAS FOUND, SO THE SANSKRIT IS PRIMARY AND THE OPERATOR'S PDF WAS
    TAKEN AS A SECOND, SUBORDINATE LAYER. Both are recorded, as instructed.

    PRIMARY — GRETIL TEI-P5, three files. sa_ApastambadharmasUtra.xml is Buhler's own edition
    (its header names "Buhler's edition, Bombay Sanskrit Series Nos. LIV and L, 3rd ed. 1932,
    variant readings in parentheses per Kashi Sanskrit Series No. 93, ed. A. Chinnaswami,
    Benares 1932"), keyed by data entry Y. Ikari for the Kyoto Joint Seminar on Law and
    Society in Classical India, 1992. sa_ApastambagRhyasUtra-comm.xml carries the Grhyasutra
    WITH Haradatta's Anakula and Sudarsana's Tatparyadarsana. sa_ApastambazulbasUtra.xml was
    taken as a bonus. All three are IAST Unicode, sutra-numbered, zero OCR risk. The packet's
    guess was right: GRETIL does serve the Dharma and Grhya sutras, in the corpustei tree,
    and they are invisible to a naive search of the index page because the link text is
    transliterated (sa_ApastambadharmasUtra, not "Apastamba Dharmasutra").

    WHY THE SCANS COULD NOT BE PRIMARY — measured, not assumed. Every Devanagari Apastamba
    scan on Archive.org has a WORTHLESS text layer, the F1 trap in its second form: the OCR
    was run in Latin mode over Devanagari type, so the file is non-empty and useless.
    Buhler's BSS Sanskrit text part 1 (india.history.resource.88913): 406,877 chars, 221,110
    Latin, 0 Devanagari — the English introduction OCRs correctly, the Sanskrit body comes
    out as "q nfm*ftf ? pn 11 ? 11". Winternitz's Apastamba Grhyasutra 1887: same. Haradatta's
    Ujjvala 1898: same. Haradatta/Sudarsana 1926: same. The scans were fetched anyway (65 MB)
    because they are the printed authority behind the GRETIL e-text and are needed to check
    it, but they are page images for practical purposes.

    SECONDARY — THE OPERATOR'S PDF WAS TAKEN. srimatham.com/.../apastamba__dharma_grihya_sutras.pdf,
    2,127,610 bytes, 222 pp. It is small, it has a REAL born-digital text layer (85,440 chars,
    2,075 IAST diacritics, 0 Devanagari), and it supplies the English translation and notes
    that the Sanskrit sources lack. Editor credited on the file: Rangaramanuja Achari. It is
    also mirrored on Archive.org inside the Apastamba grhyasutra text collection, so it is not
    a single-point-of-failure link.

    BULK-PATH RECOVERY, rule 11 again: Archive.org item
    ApastambaGRhyasUtraHaradattaAnukUlaSudarshanaAchAryaTAtparyadarshanaChinnasvAmI1926 is
    titled as one book and is actually a SIX-EDITION collection of the Apastamba Grhyasutra —
    Winternitz 1887, Haradatta+Sudarsana 1926, Srinivasacharya, Sudarsana/Mahadeva Sastri,
    the srimatham English, and a duplicate. Searching for "Winternitz Apastamba" surfaces
    nothing; the editions are files inside one item. Apastamba is the Taittiriya sakha's own
    kalpa tradition, so this directly upgrades the project's anchor sakha.

  # ---------------------------------------------------------------------------
  # OCR VERDICT, PER ITEM — a concordance with bad OCR is much less useful
  # ---------------------------------------------------------------------------
  ocr_verdict:
    method: >
      For Latin-script books the section-3 test is the wrong instrument: devanagari=0 is
      expected and tells you nothing. The metric used instead was STRUCTURAL YIELD — how many
      well-formed citations survive OCR — measured as counts of /\bRV\.\s?\d+\.\d+\.\d+/ and
      /\b[A-Z][A-Za-z]{0,6}\.\s?\d+\.\d+(\.\d+)?[a-d]?\b/, plus a junk-character count
      /[\^~|<>{}\\]/. For Devanagari books the standard devanagari-char count was used.

    bloomfield_concordance_1906_scans: >
      POOR — and this matters more here than anywhere else in the packet. Not one of the six
      scans preserves a single IAST diacritic: measured diacritic count is 0 in all six.
      Bloomfield's 1906 plates use c-cedilla for s-acute, dotted letters, and superscript
      pada letters a/b/c/d, and every OCR engine destroys them — the superscripts become
      degree signs, "RV." becomes "RY." or "EV.", and pada text loses every long vowel.
      Structural yield across the six, best to worst:
        india.history.resource.88751  RV=26646  cit=132003  junk=14415   <- TAKEN
        vedicconcordance00bloo        RV=23776  cit=132914  junk=13282   <- kept, text only
        wg649                         RV=11771  cit=103513  junk=12296   <- kept, text only
        vedicconcordance00bloouoft    RV= 6822  cit= 70352  junk=30249   <- kept, text only
        in.ernet.dli.2015.15782       RV= 7055  cit= 58997  junk=48628   <- kept, text only
        vedicconcordancebloomfield_202003_79_i  REJECTED, see negatives
      VERDICT: the 1906 scan is a reading and checking copy, not a data source. Do not build
      the occurrence table from it. Build it from the Franceschini digital text, which is
      lossless UTF-8, and use the scan only to adjudicate disputes. Had the digital version
      not been found, this packet's headline deliverable would have been badly compromised.
    vedic_variants: >
      GOOD but stored oddly. The .pdf files carry NO text layer at all — 40 chars over 40
      pages, i.e. one char per page, the empty-layer signature. The OCR exists only in the
      separate _djvu.txt: 768,340 / 1,286,539 / 1,157,473 chars, all real English-plus-
      transliteration prose. Both were kept. Anyone measuring only the PDF would wrongly log
      this as scanned-no-text. IGNCA also publishes _text.pdf variants at 63/107/100 MB with
      the layer embedded; not fetched, the djvu.txt carries the same text for 3% of the bytes.
    vedic_index: >
      GOOD. india.history.resource: clean single-spaced English, roman-numeral loci survive
      (7,318 and 12,490 matches for /[ivx]+\.\s?\d+/). The uoft alternative double-spaces
      every word, which destroys citation parsing (16 and 34 matches) even though its raw
      character count is higher. Diacritics are lost in both — but this is moot, because
      Cologne VEI gives the same book as structured data.
    cologne_lexicon: "PERFECT — not OCR. Hand-corrected digitisations under active maintenance, SLP1 + Devanagari, with per-line correction workflow and issue trackers."
    gretil_and_sarit: "PERFECT — not OCR. TEI-P5 XML, IAST Unicode, sutra- and verse-numbered."
    apastamba_scans: "WORTHLESS text layer on all four Devanagari scans — Latin-mode OCR over Devanagari type. Page images in practice. See apastamba_decision."
    srimatham_apastamba_pdf: "GOOD — born-digital, not scanned. 85,440 chars, 2,075 IAST diacritics preserved."
    parasara_islampurkar: >
      EXCELLENT — the best OCR in this packet and better than most of F1's. Three Devanagari
      passes at 580,221 / 497,289 / 730,569 Devanagari chars, plus the DLI at 691,781.
      Inspected mid-body: reads as clean Sanskrit with Madhava's commentary, sutra numerals
      intact, e.g. "dantavad dantalagnesu ... nigirann eva tac chuciH" rendering correctly.
      Note the 1893 Google scan's PDF text layer is near-empty (2,991 chars) — the value is
      entirely in the _djvu.txt.
    sbe_2_14_25_33: >
      FAIR to GOOD in the body, terrible in the front matter. Flyleaf and library-stamp pages
      OCR as noise, which makes head-of-file inspection misleading; content was confirmed by
      keyword frequency instead — SBE 2 apastamba/gautama=698, SBE 14 vasistha/baudhayana=422,
      SBE 25 manu=1104, SBE 33 narada/brhaspati=381. Body text is ordinary readable English.
      Buhler's transliteration diacritics are largely lost (iast counts 3, 60, 428, 91).
    sbh21: "GOOD — 1,201,839 chars over 476 pages, readable English; Sanskrit passages in Devanagari do not survive."

  # ---------------------------------------------------------------------------
  # WHAT THE COLOGNE ORGANISATION ACTUALLY OFFERS
  # ---------------------------------------------------------------------------
  cologne_lexicon_inventory: >
    The sanskrit-lexicon GitHub organisation holds 85+ repositories. It is NOT one dictionary
    project: it is a two-tier system. Tier 1 is csl-orig (877 MB), the single canonical data
    repository holding all dictionaries under v02/<code>/<code>.txt. Tier 2 is one
    per-dictionary repository (GRA, MD, VEI, MW, AP90 ...) holding correction work, issue
    trackers, prefaces and scans, NOT the canonical text. Cloning a tier-2 repo without also
    taking the tier-1 file gets you the workshop and not the book. Both were taken here.
    Licence is CC-BY-SA-4.0 on nearly every data repo; a few tool repos are GPL-3.0/MIT.

    VEDIC-RELEVANT CODES, with canonical file sizes in csl-orig/v02:
      gra  6,339,693 B  12,785 entries  Grassmann, Woerterbuch zum Rig-Veda, Leipzig 1873.
                                        Rgveda-specific, lemma-keyed, and — critically —
                                        every sense carries per-text citation blocks
                                        (<div n="TS">-as 1) {548,12}. 5) {192,4}...). German
                                        glosses. CC-BY-SA-4.0.
      md   6,181,239 B  20,749 entries  Macdonell, A Practical Sanskrit English Dictionary,
                                        London 1893. English glosses. CC-BY-SA-4.0.
      vei  3,134,915 B   3,834 entries  Macdonell & Keith, Vedic Index of Names and Subjects,
                                        1912 — i.e. item A3, as structured data.
      mw  50,163,886 B                  Monier-Williams 1899, plus mw_etymology.tsv and
                                        mw_roots.tsv. NOT fetched — general, not Vedic, and
                                        50 MB against a packet with a specific brief.
      pui / inm / mci / pgn / pe        Purana Index, Mahabharata name index, Mahabharata
                                        Cultural Index, and others. Post-Vedic; noted, not taken.
    ALSO PRESENT AND WORTH KNOWING: csl-json (363 MB, JSON serialisation of every dictionary),
    csl-sqlite (222 MB, prebuilt SQLite), csl-devanagari (408 MB, SLP1 converted to Devanagari),
    csl-lnum (382 MB, one file per line-number), rvlinks and avlinks (verse-level link maps for
    the Rgveda and Atharvaveda), MWinflect (generated declensions/conjugations). Any of these
    could be pulled cheaply later; sizes checked before cloning, as instructed, and the org was
    deliberately not cloned wholesale.

  # ---------------------------------------------------------------------------
  # RULE 11 — what probing recovered that a rendered page would have hidden
  # ---------------------------------------------------------------------------
  recovered_via_probing:
    - "THE BIG ONE. ieed.ullet.net/cgi-bin/pick is a broken CGI: the server ships the ELF binary instead of executing it, and the entire Franceschini 2005 Vedic Concordance is compiled inside it as UTF-8 C strings. A GET on the form's action URL returned 7.87 MB of x86-64 machine code with 88,826 concordance entries embedded. Nothing on the rendered page suggests this."
    - "Archive.org item vedicconcordancebloomfieldrevisededition_601_A looks dark under any extension filter — no PDF, no djvu.txt, no epub. It holds exactly one payload file, a .rar, and inside it is the original 2000 Franceschini/Passi RTF distribution with its legacy fonts. A filter for the usual text-derivative extensions would have logged this item as empty. It is the single most valuable Archive.org item in the packet."
    - "GRETIL's Dharmasutra and Grhyasutra holdings are invisible to a search of the index page for 'Apastamba Dharmasutra' because the link text is transliterated GRETIL-style (sa_ApastambadharmasUtra). Grepping the raw HTML for the substring 'pastamba' — a truncated stem, per the zero-result rule — surfaced all three. The legacy 1_sanskr/6_sastra/4_dharma tree that the older literature cites is now down to a single surviving file (smrti/mvir_sau.htm); everything else moved to corpustei. Trusting the old paths would have produced a false not-found."
    - "SARIT's dharmasastra holdings are not discoverable through the SARIT web app. Reading the GitHub repo file list directly gives manusmrti.xml, naradasmrti.xml and — unadvertised anywhere — vijnanesvara-mitaksara.xml, the Mitaksara itself in TEI-P5. That is B2's commentary layer, which the packet expected to have to hunt as a scan."
    - "Archive.org item ApastambaGRhyasUtraHaradattaAnukUlaSudarshanaAchAryaTAtparyadarshanaChinnasvAmI1926 is a six-edition collection under a single-book title, including Winternitz 1887 which returns nothing under its own name."
    - "The Cologne VEI repository was found while inventorying A4 and turned out to BE item A3. Two separate lines of the brief resolve to the same file."
    - "Sacred Books of the Hindus exists as one bulk item (Sacred_Books_of_the_Hindus) rather than 30 separately-catalogued volumes; volume-by-volume searching returns a scattered and incomplete set of DLI singletons."

  negatives_recorded:
    - "vedicconcordancebloomfield_202003_79_i: REJECTED after measurement. Its _djvu.txt is 7,898,956 bytes — the largest of any Bloomfield scan, which is why it was tested — but the OCR was run in DEVANAGARI mode over a Latin-script book. Result: 5,411,961 chars, RV citations 0, structural citations 0, IAST 0, the string 'purohitam' absent entirely. Non-empty and worthless, exactly the F1 trap inverted. File deleted; 104 MB PDF not fetched. Confidence: high, measured."
    - "The four DLI Parasara Dharma Samhita text layers (in.ernet.dli.2015.283598 / .283599 / .283600 / .283602): fetched, measured, REJECTED and deleted. Devanagari=0, Latin=200k-258k — Latin-mode OCR over Devanagari type. Their PDFs (186-382 MB each) were correctly not fetched. The Islampurkar scans that WERE kept are from different items and are good. Confidence: high, measured."
    - "digilander.iol.it/marcofrance — no DNS response. digilander.libero.it/marcofrance — HTTP 410 Gone. Both were the official Italian distribution point for the electronic Vedic Concordance in 2000. Confidence: high, probed."
    - "www.fas.harvard.edu/~sanskrit/pubs.html — HTTP 403. The American distribution point named in the same announcement. Confidence: medium — a 403 is a refusal, not proof of absence; the file may exist behind it."
    - "titus.uni-frankfurt.de/texte/etcs/ind/aind/ved/vedconc/vedconc.htm — HTTP 404 over both http and https. TITUS is named by Witzel as holding a legal and slightly improved copy. The TITUS index itself returns 200, so the server is alive and the concordance path is not where the 2000 announcement implies. Confidence: medium — one path probed, TITUS's own search not exhausted. A later packet should retry inside TITUS's frame-based index."
    - "GitHub repository search for 'vedic concordance' and 'bloomfield vedic' returns nothing relevant. Zenodo search for 'vedic concordance' returns only a 1907 book review of Bloomfield. No open-licensed re-release of the concordance data exists on either platform. Confidence: medium-high."
    - "Sacred_Books_of_the_Hindus is missing SBH volumes 2, 12, 19, 20, 23, 24, 25, 28, 30, 31 from an otherwise-continuous run. Several exist as separate DLI items of varying quality. Confidence: high for the bulk item's extent; the per-volume hunt was not run because only vol 21 is in this packet's scope."

  budget_cut_off: >
    Nothing in the brief was cut for budget. 724 MB of 4 GB was spent. Three deliberate
    non-fetches, each for a stated reason, none of them budget: (1) the 28 non-dharmasastra
