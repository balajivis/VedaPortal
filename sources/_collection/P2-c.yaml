      THAT WAS WRONG. The database lives on a DIFFERENT HOST and is fully operational:
      **https://www.pandulipipatala.nic.in/** — HTTP 200, verified by me 2026-08-01.
      The lesson generalises: an unreachable front door is not an absent building. The dead
      domain is what every write-up links to.
