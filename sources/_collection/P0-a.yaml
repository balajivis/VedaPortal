    YES — and this is the most important single fact in this record, because it contradicts
    what everyone downstream says about TITUS. Independently re-measured by me on the served
    pages, not taken on report:
      /texte/etcd/ind/aind/ved/yvs/ts/ts001.htm (HTTP 200, 75,612 B) — Taittirīya Saṃhitā
        adhyāya 1 in Devanāgarī: 9,938 Devanāgarī chars, 706 × U+0951 (svarita) and
