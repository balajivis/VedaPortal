    candidate and it comes back empty); Motilal; Chaukhamba; Exotic India; Open Library.
  notes: >
    THIS RECORD REVERSES MY OWN FIRST FINDING and the reversal is the useful part.
    On a first pass — vedicheritage, GRETIL, TITUS, sanskritweb, sanskritdocuments — this
    node looked like the darkest in the packet. It is not. It has five free editions.
    The lesson generalises to the whole packet: the mainstream Sanskrit-digital ecosystem
    (GRETIL / TITUS / sanskritdocuments / sanskritweb) is Kauthuma-and-Taittirīya shaped,
    and its silence about a minority śākhā is WEAK EVIDENCE OF ABSENCE. The material was
    sitting in community uploads on archive.org the whole time. Any `not-found` in this
    packet resting only on those four sources should be treated as provisional.
    WHAT IS STILL GENUINELY MISSING: the RāṇĀYANĪYA ĀRCIKA — the saṃhitā text itself — in
    any digital form. Everything located is gāna, sūtra or prayoga. `found-partial`, and
    the missing part is the layer this node is named for.
    IGNCA CORRECTION — worth recording because it is an easy trap: the Sātavalekara
    flipbook offered on the portal's Rāṇāyanīya page is NOT a Rāṇāyanīya edition. The
    Rāṇāyanīya page and the KAUTHUMA page link the identical URL with the identical anchor;
    the book is "Sāmaveda kā Subodha Bhāṣya", Svādhyāya Maṇḍala, Pardi, 1985, Hindi, 10
    vols — a generic Kauthuma-based Hindi translation reused under both headings. Anyone
    citing it as the Rāṇāyanīya text would be citing Kauthuma.
    RELATION TO KAUTHUMA — the brief's premise needs correcting, in our favour. The claim
    "same mantras, different recitation" is widely repeated and UNCITED. Caland (1931) is
    the citable authority and he is agnostic, not gāna-only: "we have, as yet, no certainty
    … whether the Saṃhitā … of the Kauthumas were also in use with the Rāṇāyanīyas
    precisely in the same form", while noting that what IS certain is a different
    Śrautasūtra (Drāhyāyaṇa) and Gṛhyasūtra (Khādira). Howard, Witzel, Staal and
    Kashikar–Parpola all treat "Kauthuma-Rāṇāyanīya" as ONE textual unit opposed to
    Jaiminīya. So the saṃhitā-identity question is OPEN, not settled — and the gāna
    divergence is demonstrable in print and in notation system. Both facts point the same
    way: the recording and the gāna encoding are the irreplaceable objects here.
    CREDIT: Vijaya Kumar Sharma and Shambhu Lal Sharma; Shivarama Bhatt; Girijaprasad
    Shadangi; Śrī Śāradā Pīṭha Vidyā Sabhā, Dvārakā and Rāṇāyanīya Saṃśodhana
    Pratiṣṭhāna, Tirupati.
