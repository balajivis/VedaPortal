# P2-c — Manuscript catalogue sweep
#
# Packet scope: the HANDWRITTEN record and the catalogues that describe it.
# NOT printed editions (P1-a), NOT machine-readable text corpora (P0-a), NOT apparatus
# editions (P2-b), NOT the six endangered śākhās as editions/audio (P2-a).
#
# ---------------------------------------------------------------------------
# SCHEMA EXTENSION — documented once, per COLLECTION-PROTOCOL.md §1 closing note
# ---------------------------------------------------------------------------
# The protocol record is keyed on `node_path` (śākhā → layer). That key does not fit a
# manuscript catalogue, because a catalogue is keyed on INSTITUTION → HOLDING and —
# critically — because these catalogues almost never state śākhā (see FINDING-1 below).
# Forcing a node_path onto them would require inferring śākhā, which rule 7 forbids.
#
# So records here are keyed on `holding_id` (institution + collection), and carry:
#
#   holding_id                institution-slug/collection-slug — primary key for this packet
#   institution               full name, as the institution writes it
#   collection                named collection or catalogue within the institution
#   country
#   catalogue_url             a link that opens
#   machine_queryable         no / html-scrape / postback-scrape / api / solr / oai-pmh / iiif / bulk-file
#   query_endpoint            the EXACT working URL, verbatim, if machine_queryable != no
#   query_verified            what I actually ran and what came back (evidence, not claim)
#   record_count              total records in the catalogue, as the catalogue itself reports
#   vedic_material            what Vedic material, with counts where the catalogue gives them
#   shakha_stated             what śākhā the CATALOGUE ITSELF names. `none` is the usual answer.
#   images_digitised          none / partial / full  — of the ORIGINALS, not of a card catalogue
#   images_public             yes / no / registration / on-request
#   image_access_path         how images are actually obtained
#   access_requirements       permissions, fees, in-person application, visa-level friction
#   license                   protocol enum, applied to the CATALOGUE METADATA
#   image_license             separate — terms asserted over the manuscript images
#   status                    protocol enum: found-complete / found-partial / not-found
#   where_i_looked            mandatory when not-found (protocol rule 2)
#   notes
#   date_logged
#
# Protocol fields carried through unchanged: `license`, `status`, `where_i_looked`,
# `notes`, `date_logged`. Fields dropped as inapplicable to a catalogue: `veda`,
# `organization`, `shakha`, `layer`, `edition`, `script`, `text_layer`,
# `svara_source?`, `svara_verified?` — a catalogue is not a text and has no svaras.
# `svara_verified?` is BV's field and is not present here at all, per the hand-off seam.
#
# ---------------------------------------------------------------------------

summary:
  date: 2026-08-01
  packet: P2-c

  headline: >
    Twenty-seven holdings mapped. Twelve are machine-queryable today and I ran queries against
    every headline endpoint myself.
    The premise of the packet holds, and more strongly than expected. Without credentials, I
    can enumerate right now roughly 155,000 Vedic manuscript records — 87,207 from India's
    national database, 65,672 from IGNCA's Vedic Heritage catalogue, 2,349 from NGMCP's
    Nepalese index (150,298 folios, counted not estimated), 1,151 from Qalamos's Veda class,
    and hundreds more from Berlin, Paris and Cambridge. Nobody has read that.
    The evidence is not the bottleneck. Two findings make the point sharply. First, the
    Paippalāda Atharvaveda — the recension believed lost until 1957 — is described in the
    Odisha State Museum's own 1973 printed catalogue as TEN manuscripts in its collection,
    a volume freely readable with OCR on archive.org, while India's national database
    contains exactly ONE record for the actual Saṃhitā. Second, a single Adyar Library printed
    catalogue from the last century names manuscripts for every śākhā this repository
    currently records as holding nothing — Mādhyandina 5, Kāṇva 21, Śaunaka 4, Kaṭha 15,
    Jaiminīya 3, Maitrāyaṇī 2.
    Metadata is broadly open; images are scarce but not absent — India's Kritisampada serves
    ~476 MB manuscript PDFs over plain unauthenticated HTTP, and 2,429 Vedic manuscripts there
    are digitised and public. What is missing is not evidence and increasingly not even
    pixels. It is readers.

  METHOD-WARNING_this_packet_shipped_three_false_negatives: >
    Recorded prominently because a map of what is reachable is worth nothing if its negatives
    are unreliable, and because both errors were the same error.
    (1) I logged NAMAMI / KRITISAMPADA as not-found after namami.gov.in — the URL every
    published account gives — refused TCP on 443 and 80 at four timeout settings. WRONG. The
    database is alive on a different host, www.pandulipipatala.nic.in, with 87,207 records
    under subject=Veda and publicly fetchable manuscript PDFs. It is now the packet's number
    one target. A dead front door is not an absent building.
    (2) I logged ASHA ARCHIVES, Kathmandu as not-found from three dead domains and one blocked
    repository. WRONG. Its printed catalogue is on archive.org with 2 MB of OCR text.
    (3) I was about to record "the Paippalāda is absent from India's Vedic union catalogue"
    because query=paippalada returned an empty response from IGNCA's endpoint. WRONG. The
    endpoint does not stem that string; query=Paippal returns three records including an
    Oriya-script palm-leaf Atharvaveda Paippalāda śākhā. An empty response and a zero result
    are indistinguishable on that endpoint, and I nearly published the difference as a
    finding about the Vedic corpus.
    In all three cases the failure was concluding absence from a failed fetch instead of
    probing an alternative surface, host, or query form. Every negative in this file was re-examined after that; where a
    negative rests on a page not rendering rather than on a probed endpoint, the record now
    says so explicitly.
    A related worked example is preserved in the Asha record: the Heidelberg repository copy
    returns HTTP 200 whose BODY is an anti-bot challenge. Status codes are not evidence;
    bodies are.

  FINDING-1_shakha_lives_in_print_not_in_databases: >
    The single most consequential structural fact for this project, and it inverts the
    obvious assumption.
    MODERN DATABASES CANNOT EXPRESS ŚĀKHĀ. India's national database has NO śākhā field at
    all — not among its 419 subject terms, not among the ~40 fields of a detail record. Of
    NGMCP's 117,406 Nepalese records, exactly FOUR name a śākhā, all in the title:
    (Mādhyandinaśākhīya)Rudrādhyāya, (Taittirīyaśākhīya)Rudrādhyāya,
    (Yajurvedoktakaṭhaśākhīya)Kaṭhopaniṣad, (Yajuḥśākhīya)Upakarmotsarjanavidhi. Nepal's
    National Archives catalogue has no śākhā column. Berlin names one in two of 231 titles.
    BnF states one exactly once. Kerala's ORIML lists only "Vedanta", which is a darśana.
    PRINTED CATALOGUES DO IT ROUTINELY, because recension was the scholarly question of the
    19th and 20th centuries. Adyar's Descriptive Catalogue Vol. 1 (Vedic) counts manuscripts
    by śākhā: Taittirīya 42 · Kāṇva 21 · Aitareya 19 · Kaṭha 15 · Kauṣītaki 9 · Vājasaneyi 7 ·
    Mādhyandina 5 · Śāṅkhāyana 5 · Āpastamba 5 · Śaunaka 4 · Jaiminīya 3 · Maitrāyaṇī 2 ·
    Drāhyāyaṇa 1. Thanjavur Vol. 2 (Vedas, 1928) names Aitareya, Taittirīya, Kaṭha, Kāṇva,
    Mādhyandina, Śāṅkhāyana, Kauṣītaki and one PAIPPALĀDA. Eggeling's India Office catalogue
    Part I is titled "Vedic Manuscripts". Odisha's 1973 preface states ten Paippalāda
    manuscripts outright.
    THE PARTIAL EXCEPTION among modern sources: IGNCA's Vedic Heritage catalogue carries śākhā
    in TITLES at scale — taittirīya 1,405, madhyandina 58, jaiminiya 25, kauthuma 6 — with
    false positives to weed (its "kāṇva" count of 888 is inflated by the ṛṣi name).
    CONSEQUENCE FOR A TRIAGE PIPELINE: filtering by śākhā means (a) string-matching titles in
    IGNCA and Kritisampada, and (b) OCR-MINING PRINTED CATALOGUES, which is where the real
    śākhā data is. For the Nepalese and European pools, śākhā is downstream manuscript work —
    and the descriptive catalogues' transcribed incipits and explicits are exactly the
    material for it.
    Everywhere: record what the catalogue says. Never what the region implies. Kerala is
    associated with the Jaiminīya Sāmaveda and a Mādhyandinaśākhāviṣaya sits in Telugu script
    in Chennai — regional inference would have destroyed both facts.

  FINDING-2_metadata_is_open_pixels_are_scarce_but_not_absent: >
    Catalogue metadata is broadly harvestable — Solr, OAI-PMH, SRU, IIIF, REST, and two
    undocumented POST endpoints. Images are the scarce good, but "scarce" is not "none", and
    the earlier draft of this packet overstated the scarcity.
    NO IMAGES AT ALL: NGMCP serves zero for 117,406 records (derCount:[1 TO *] → 0, an API
    fact not a page impression). Nepal's National Archives serves none. IGNCA serves none for
    65,672 Vedic records. Odisha State Museum, BORI, Thanjavur, ORI Mysore — none online.
    IMAGES THAT DO EXIST AND ARE PUBLIC: India's Kritisampada is the big one — 3,133 of its
    87,207 Veda records are flagged digitised and 2,429 are digitised AND public-view, with
    the PDFs directly fetchable over plain HTTP (verified: a ~476 MB Yajurvedabhāṣya scan).
    Then Berlin's 23 Vedic manuscripts, all imaged, Public Domain Mark, including Ṛgveda and
    Atharvaveda PADAPĀṬHAS; BnF's Ṛgveda padapāṭhas; Cambridge's 1,595 Sanskrit manifests;
    Muktabodha's 233 Gokarna prayoga scans; and EAP's Nepal and Kerala projects.
    THE RECURRING PATTERN, worth naming: the imaging often happened and the publishing did
    not. Kerala's ORIML had 10,000+ manuscripts microfilmed by IGNCA — unpublished. NGMCP's
    Kathmandu scan records date from 2006 — unpublished. The NGMPP X series was digitised and
    handed over in 2024 — unpublished, and it contributes exactly ONE manuscript to the
    Nepalese Vedic subset anyway.

  FINDING-3_the_barrier_is_anti_bot_infrastructure_not_copyright: >
    What blocked this packet was almost never a licence or a policy. It was Cloudflare
    (PANDIT, Adyar, Muktabodha's new UI), AWS WAF (eap.bl.uk), Anubis proof-of-work
    (Bodleian's south-asian catalogue, Heidelberg's repository), geo-walls (NVLI's API), and
    an "abuse-deny" interstitial that NGMCP serves to any client without a browser
    User-Agent. Add the silent traps: NGMCP's incomplete TLS chain, its Solr returning
    numFound=0 without defType=lucene, Nepal's ASP.NET event validation, IGNCA's endpoint
    ignoring GET pagination, and archive.org's scrape API returning HTTP 200 with wrong data.
    None of these are walled gardens. Every one of these institutions publishes in principle.
    The fix is to ask for a dump or an API key, not to out-engineer the gate.

  machine_queryable_today:
    - >
      Kritisampada / Pandulipi Patala (India) at www.pandulipipatala.nic.in — CSRF-gated form
      POST with an UNBOUNDED limit, plus sequentially enumerable detail records at
      /manus/search-view?id=<base64 int> with no CSRF and no auth. 87,207 subject=Veda,
      verified by me. Manuscript PDFs directly fetchable. NOT namami.gov.in, which is dead.
    - >
      IGNCA Vedic Heritage — undocumented POST /wp-content/themes/vedic/fetch.php returning
      65,672 VEDIC records with śākhā in the titles. Verified by me, including that GET
      silently ignores pagination.
    - >
      NGMCP (Hamburg) — unauthenticated Solr with CSV export and cursorMark; I pulled the
      complete 2,349-record Vedic subset as a 273 KB CSV in ONE request. Plus a MyCoRe REST
      API enumerating 175,818 objects. Requires defType=lucene and a browser User-Agent.
    - >
      NGMCP Descriptive Catalogue — 15,834 static HTML pages with transcribed incipit and
      explicit; the live wiki is deleted, this static archive and a CC0 GitHub mirror survive.
    - >
      Qalamos (Leipzig) — OAI-PMH at /oai2 with seven formats including TEI, plus open Solr
      /select. 504,607 records, 36,065 Sanskrit, 1,151 "Veda", and 651 under a distinct
      "Vedic Sanscrit" LANGUAGE code. Mostly CC0. Verified by me.
    - Staatsbibliothek zu Berlin — OAI-PMH set of 231 South Asian manuscripts, 23 Vedic, all imaged, Public Domain Mark. Verified by me.
    - BnF Gallica — SRU + IIIF, 1,437 Sanskrit manuscripts, metadata open under Etalab.
    - Cambridge CUDL — IIIF collection of 1,595 manifests plus per-item TEI/JSON. CC BY-NC.
    - National Archives of Nepal — 114,552 records behind an ASP.NET postback form; I ran a subject-filtered query and joined 95 of 95 reel keys to NGMCP.
    - archive.org — the printed union catalogues (Aufrecht, Eggeling, Weber, Burnell, Mitra, New Catalogus Catalogorum, BORI 27 vols, Odisha, Adyar, Thanjavur, Asha), all OCR'd, mostly CC0 or NOT_IN_COPYRIGHT, no terms of use. This is how every dark institution becomes reachable.
    - EAP (British Library) — IIIF bypasses the WAF; harvest by ID enumeration to the 404 boundary.
    - Wellcome Collection — the cleanest API of all, and the wrong corpus (Āyurveda, not Veda).

  dark_or_walled:
    - Thanjavur Sarasvati Mahal Library — NO WEBSITE HAS EVER EXISTED. 17 candidate domains, all NXDOMAIN, zero Wayback snapshots ever. Not down; never online.
    - Odisha State Museum — every candidate domain NXDOMAIN or timing out. No online catalogue, no digitisation.
    - Adyar Library — Cloudflare 403 and a redirect loop; the library states its own catalogue "is in paper registers", and digitised manuscripts are for on-site readers only.
    - BORI Pune — site up, but no manuscript catalogue exists online; borilib.com is a near-empty WordPress that still has "Hello world!" published.
    - Kerala ORIML (orimssku.in, not orimlku.in) — TCP open, HTTP timing out. Verified down.
    - All Jammu & Kashmir government hosts — NXDOMAIN or timeout; spsmuseum.jk.gov.in has zero Wayback snapshots ever.
    - namami.gov.in — dead, and still the URL everything links to. The database moved; the links did not.
    - indianculture.gov.in — a 924-byte React shell on every path; its NVLI backend is geo-walled to India.
    - Bodleian south-asian.bodleian.ox.ac.uk — structured records demonstrably exist behind an Anubis challenge on every path including .json and /oai.
    - PANDIT — Cloudflare 403 everywhere; its /api/graph endpoint exists but 500s and returns only a relationship graph.
    - eap.bl.uk HTML — AWS WAF; only IIIF gets through and there is no collection endpoint.
    - SARIT — 502, the web app is down. Muktabodha's new UI — Cloudflare Turnstile, and its GitHub repos are private.
    - British Library machine surface — api.bl.uk and labs.bl.uk NXDOMAIN, SPARQL ports closed, Digitised Manuscripts retired. Long tail of the 2023 cyberattack.

  three_highest_value_triage_targets:
    - rank: 1
      target: "Kritisampada / Pandulipi Patala — https://www.pandulipipatala.nic.in/"
      why: >
        87,207 Vedic manuscript records, the largest pool found anywhere, in India's official
        national database — and unlike every other large catalogue here it also serves the
        IMAGES: 2,429 Vedic manuscripts digitised and public-view, PDFs fetchable over plain
        HTTP with no auth (verified on a ~476 MB Yajurvedabhāṣya). Detail records are
        sequentially enumerable by integer ID with no CSRF, so a full harvest is
        straightforward. Odisha 2,830 and Jammu & Kashmir 1,030 are both well represented.
        Three conditions, all firm: the licence is all-rights-reserved and NAMAMI should be
        asked; `mrc_id` is the surveying centre and NOT the holder, so institution counts from
        it are badly inflated; and the database explicitly includes PRIVATE collections, so
        the Institute Name column must be institution-filtered on ingest.
    - rank: 2
      target: "OCR-mining the printed catalogues on archive.org — Adyar Vol.1 Vedic, Thanjavur Vol.2 Vedas, Odisha Alphabetical Catalogue Part I, Eggeling Part I, BORI Śrauta and Vedāṅga volumes"
      why: >
        This is where the ŚĀKHĀ data actually is, and no digital catalogue anywhere replaces
        it. Adyar Vol.1 alone names manuscripts for every śākhā this repo records as empty.
        Odisha's Part I is the only source that states the ten Paippalāda manuscripts. It is
        also the only route into the institutions that are wholly dark — Thanjavur has never
        had a website, and its 1928 Vedas volume is nonetheless sitting there with OCR. No
        auth, no terms, no rate limits, mostly CC0 or NOT_IN_COPYRIGHT, and it is the cheapest
        work in the packet by a wide margin. Use advancedsearch.php?…&output=json, never the
        v1 scrape endpoint, which returns HTTP 200 with silently wrong data.
    - rank: 3
      target: "NGMCP Solr CSV + Descriptive Catalogue, joined to the National Archives of Nepal — with Qalamos as the clean-licence companion"
      why: >
        The largest single coherent physical pool — 2,349 Vedic manuscripts, 150,298 folios —
        and the only place a machine can go beyond titles, because the descriptive tier
        transcribes incipit AND explicit, which is precisely what recension-matching needs and
        precisely what would let a pipeline assign śākhā where no catalogue states it. Zero
        auth, one-request CSV export, and a verified clean join to a second independent
        catalogue on reel number (95 of 95 matched). Pair it with Qalamos, which is mostly CC0
        — so unlike targets 1 and 2 it can actually be redistributed — and which offers the
        highest-precision Vedic filter found anywhere: 651 records under a "Vedic Sanscrit"
        LANGUAGE code, a cataloguer's judgement that the text is in Vedic, not merely about it.

  honest_gaps:
    - >
      Two negatives in this packet were shipped wrong and then corrected (see METHOD-WARNING).
      Others may remain. Where a negative rests on a failed fetch rather than a probed
      alternative surface, the record says so; treat those as lower confidence.
    - >
      The Vedic share of NGMCP's 34,061 "Karmakāṇḍa (vaidika, āgamika, tāntrika etc.)" class
      is not separated by the catalogue and is not estimated here. It is the largest class in
      that catalogue.
    - >
      The exact Vedic count in the NGMCP descriptive tier is bounded (order of 100–300) but
      not known; a 130-page random sample returned zero. Fetching all 15,834 pages settles it.
    - >
      Whether Asha Archives holds Vedic manuscripts is unanswered. The 2 MB OCR of its
      catalogue is one HTTP request away and would settle it.
    - >
      The Kashmir Śāradā birch-bark Paippalāda is reported to be at Tübingen; no shelfmark was
      located in Tübingen's catalogue. Lead, not fact.
    - >
      Staatsbibliothek Berlin's terms-of-use page is JavaScript-only and could not be read;
      rights are taken from per-record Public Domain Mark assertions instead.
    - >
      indianculture.gov.in / NVLI is geo-walled and should be re-tested from an Indian
      network before being written off.
    - >
      Several counts in the European, digitisation and Indian sections come from delegated
      verification and were not personally re-run; each such field says so. The headline
      endpoints — Kritisampada's search and PDFs, IGNCA's fetch.php, NGMCP's Solr and CSV,
      Qalamos's OAI and Solr, Berlin's OAI set, Nepal's postback form — I verified myself.
    - >
      The WebSearch budget for the session was exhausted partway through, thinning discovery
      of anything not reachable by direct fetch.

