        (choḷīya style — probably smārta type)". CHOḶĪYA = Cōḻa-country, i.e. TAMIL.
    (b) `jaiminIya-sAma-gAna-paravastu-tradition` and ~11 sibling items — the PARAVASTU
        tradition, self-described as "TN-AP", from Āḷvārtirunagari, with a core
        compilation of recitations made around 1974 (18 files, 276.9 MB) and further
        santhā (teaching-session) recordings dated 2014, 2015 and 2018. Ritual-occasion
        sāmāni: prokṣaṇa, udaka-śānti, vivāha/upanayana.
    BEST-LICENSED SINGLE ITEM — archive.org `dni.ncaa.IGNCA-IG_11_DV_60_1303-MDV`,
    "Jaiminiya Sama Veda Pathsala", IGNCA Media Centre, **CC BY-NC 4.0**. The only
    Jaiminīya media located anywhere with a clear open licence.
