    vedic_material: >
      The largest Vedic manuscript pool found anywhere in this packet, and it is a UNION
      catalogue, so it spans many German holding institutions rather than one shelf.
      Catalogue's own subject class "Veda" (MyMssSubjectMatter:THEM0065.005): 1,151 records —
      verified by me directly.
      AND — the best single machine-filterable Vedic signal found anywhere in this packet —
      Qalamos has a distinct LANGUAGE code for VEDIC SANSKRIT as opposed to Sanskrit:
        category:"MyMssLanguage:LANG0198" = "Vedic Sanscrit" → 651 records (verified by me).
      That is a cataloguer's judgement that the LANGUAGE OF THE TEXT IS VEDIC, not a subject
      tag and not a title match. No other catalogue in this packet distinguishes Vedic from
      Classical Sanskrit at the record level. For a triage pipeline that needs high precision
      over high recall, this 651-record set is the cleanest starting population available.
      Free-text counts reported by the delegated verification (field is `allMeta`; a bare
      q=Sanskrit returns 0, so the field name matters): Veda* 2,619 · Ṛgveda 393 ·
      Yajurveda 241 · Atharvaveda 196 · Sāmaveda 140 · Upaniṣad 464 · Brāhmaṇa 244 ·
      Āraṇyaka 75 · Prātiśākhya 48 · Gṛhyasūtra 46 · Śrautasūtra 41.
