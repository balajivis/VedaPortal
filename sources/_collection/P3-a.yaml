    being written. Applying it retroactively overturned two records in this file. The
    corrections are left visible rather than silently merged, because the failure mode is
    more instructive than the fix.
    WHAT I HAD WRITTEN: that SARIT could not be checked (its web app returns HTTP 502 and
    400), and that no usable machine-readable Tantravārttika exists.
    WHAT PROBING FOUND: SARIT's corpus lives on GitHub independently of its web
    application, and it holds a 4.59 MB TEI-P5 Tantravārttika — encoded by Andrew Ollett
    under Sheldon Pollock's SARIT project, based on the Ānandāśrama first edition,
    structurally marked down to the individual sūtra, released under CC BY-SA 4.0.
    It covers MS 1.2 through 2.4. It does NOT reach 3.3.14, so the six-fold ordering
    findings are unaffected. But it covers the ENTIRE vidhi/arthavāda pāda AND the
    vidhi-definition passage at MS 2.1.1–4 — which makes it the best digital source in
    existence for the classifier the project actually needs. It was one HTTP request away,
    behind a front end that looked dead.
    THE LESSON, for the next collector rather than for me: in this field the web front ends
    rot faster than the data. GRETIL indexes files it no longer serves. SARIT serves files
    through a broken application. Muktabodha advertises open data repositories that 404
    mid-migration. DCS renders its catalogue only in JavaScript but publishes the entire
    corpus as CoNLL-U on GitHub. FOUR OF THE FIVE MAJOR DIGITAL HOLDERS IN THIS PACKET have
    a working bulk path their own website either does not advertise or cannot reach.
    Check GitHub, the API and the bulk dump BEFORE recording any not-found against a
    digital library.

  # =========================================================================
  # 5. THE FINDING THAT SHOULD CHANGE HOW THE PROJECT PLANS
  # =========================================================================
  the_availability_inversion: >
    Machine-readable coverage of this corpus is INVERSELY correlated with what the project
    needs. Count it:
      MS 1.1 (epistemology, apauruṣeyatva, svataḥ-prāmāṇya — BEHIND THE FIREWALL):
        Śabara in GRETIL, Śabara in DCS with full morphological tagging, Kumārila's
        Ślokavārttika, Sucaritamiśra's Kāśikā, Pārthasārathi's Śāstradīpikā, Umbeka's
        Tātparyaṭīkā, Frauwallner's critical edition, Kataoka's critical editions, and a
        complete PD English translation. Saturated.
      MS 3.3 (viniyoga — THE PROJECT'S ACTUAL ADJUDICATION RULE):
        one machine-readable text (GRETIL's Pohlus file), zero morphological tagging,
        zero critical editions online, and PDF scans for everything else.
    Two independent measurements make this concrete. DCS's Mīmāṃsāsūtrabhāṣya holding is
    120 CoNLL-U files and stops at MS 1.3.35 — verified by enumerating the repository tree.
    SARIT's TEI Tantravārttika stops at MS 2.4 — verified by walking every div in the file.
    NEITHER REACHES 3.3.14, and neither is close. Two of the best-resourced digital
    Sanskrit projects in the world both stopped short of the passage this project needs,
    and both stopped in the same place: after the epistemology, before the hermeneutics.
    CONSEQUENCE FOR PLANNING: do not budget the six-fold ordering as a text-acquisition
    task. It is acquired. Budget it as a READING task on a 16-page passage (Jha GOS 66,
    pp. 449–464) with the Sanskrit alongside. The project's own note — "bounded and
    tractable; the Śābara-bhāṣya in full is a lifetime" — is exactly right, and the bound
    is now measured: sixteen pages of English, one sūtra of Sanskrit, six worked arguments.

  attribution_owed: >
    Per rule 10. Nothing in this packet would exist without: Mahāmahopādhyāya GANGANATHA
    JHA (1871–1941), who translated the Śābarabhāṣya, the Ślokavārttika AND the
    Tantravārttika into English single-handed — the English-language access to Mīmāṃsā is
    essentially one man's life's work; ANDREAS POHLUS, whose GRETIL Śābarabhāṣya is
    collated against six printed editions and carries page concordances to three of them,
    which is what made this packet's citations checkable; S. K. RAMANATHA SASTRI and
    S. SUBRAHMANYA SASTRI of the University of Madras, who edited the Bṛhatī out of
    fragments across thirty years; KEVALĀNANDA SARASVATĪ of Wai, for the seven-volume
    Mīmāṃsākośa; and OLIVER HELLWIG, for DCS.

