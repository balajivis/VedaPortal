  kaushitaki_shakha_affiliation:
    verdict: >
      **Unsettled. The status file's caution is correct and should be kept.**
      Do not resolve it by assertion, and do not move the node on the strength of the
      handbooks.
    the_conflation_at_the_root: >
      Two different axes get merged. Śākala and Bāṣkala are **Saṃhitā recensions**.
      Aitareya and Kauṣītaki are **Brāhmaṇa-carrying schools**. Asking whether the
      Kauṣītaki Brāhmaṇa "belongs to Śākala or Bāṣkala" presupposes a one-to-one
      mapping between the two axes that the sources do not supply.
    the_traditional_position: >
      Śaunaka's *Caraṇavyūha* lists five Ṛgvedic śākhās — Śākala, Bāṣkala, Āśvalāyana,
      Śāṅkhāyana, Māṇḍūkāyana — so in the native reckoning Śāṅkhāyana is a śākhā in its
      own right (reported at Jamison & Brereton, *The Rigveda*, OUP 2014, p. 16).
    the_critical_position: >
      Keith, HOS 25, Introd. p. 25: "the essential similarity of the Brāhmaṇas is so
      great that it cannot be doubted that they both represent the tradition of one
      school, but that the tradition has received different handling by the branches of
      that school. Nor can we derive the two versions directly from the one source, for
      the evidence of the Kauṣītaki shows clearly that it is only a branch of a school
      which divided into the **Paiṅgya and the Kauṣītaka sub-schools**." So: one
      Bahvṛca tradition, two sub-schools, not a peer of Śākala/Bāṣkala at all.
      Witzel cites this page (canon.pdf n. 324) and adds that the relationship between
      the Kauṣītaki and Śāṅkhāyana schools "has to be investigated. Though both names
      are often used indiscriminately, there is a genuine Kauṣītaki GS in Kerala."
      Witzel elsewhere places the Aitareyins squarely with the Śākala RV (canon.pdf
      §5.1 p. 315, §6.2 p. 325 — the Śākala clan appears inside AB 3.43 as belonging to
      the Aitareya school, and Śākalya at AiĀ 3.2.1.6).
    the_bashkala_claim: >
      **Not established.** It traces to Weber, *History of Indian Literature* (Eng. tr.
      1878), Suppl. Notes p. 315, who noticed a divergence at Śāṅkhāyana Gṛhyasūtra
      4.10.3 from the Śākala Anukramaṇī and asked "Have we here also to do with a
      divergence of the Vāṣkala school?" — then immediately undercut it: "(In Śāṅkh.
      Gṛh., 4.5.8, however, there is no trace of this variation from the vulgate.)"
      A question, not a conclusion. Keith HOS 25 never mentions Bāṣkala in connection
      with the KB at all. Jamison & Witzel, "Vedic Hinduism" (1992) p. 16 puts the
      Bāṣkala and Māṇḍūkeya Saṃhitās in a box marked *lost*, with **no Brāhmaṇa
      attached**, and shows AB and KB as the two Brāhmaṇas of the surviving Śākala RV.
      **BUT the Indian editorial tradition asserts it on a title page.** The Ānandāśrama
      edition of the Brāhmaṇa is titled
      *ऋग्वेदीयबाष्कलशाखायाः "कौषीतकि" इत्यपरसंज्ञं शाङ्खायनब्राह्मणम्* — "the Śāṅkhāyana
      Brāhmaṇa, otherwise named Kauṣītaki, of the **Bāṣkala** śākhā of the Ṛgveda."
      So this is not merely a Wikipedia artefact: it is the position of the Indian print
      tradition, stated where a tradition states things. That is exactly the shape the
      project's `multi_traditional` tier exists for — name both lineages, do not pick.
      The modern *popular* circulation is traceable to Wikipedia's *Rigveda*
      "Recensions" table, which is uncited, invents a "Kauṣītaki Saṃhitā" and a
      "Śāṅkhāyana Saṃhitā" that no scholarship attests, and links its two distinct
      Brāhmaṇa cells to the same article. vedicheritage.gov.in repeats it without
      argument — a **third** structural claim on that portal that does not survive
      checking.
    RECOMMENDED_WORDING_FOR_THE_STATUS_FILE: >
      "Traditionally associated with the Bāṣkala śākhā in Indian handbooks; this
      association goes back to a tentative suggestion of Weber's and is not accepted or
      asserted in the critical literature (Keith, Renou, Witzel), which treats the
      Kauṣītaki Brāhmaṇa as the Brāhmaṇa of the Kauṣītaki/Śāṅkhāyana school within a
      tradition transmitting the Śākala Saṃhitā."
      On that reading the current node placement under rigveda/shakala/ is defensible
      and should stand for now, with the doubt recorded — which is what the status file
      already does. **Tier: multi_traditional, naming the lineages, not contested.**
    kausitaki_vs_shankhayana_one_text_or_two: >
      One text, two names, and the manuscripts say so directly. Keith HOS 25 pp. 37–38:
      "The MSS. of the book which show the title *Kauṣītaki Brāhmaṇa* as the normal
      title have as a variant here and there *Śāṅkhāyana* … the most exact version,
      that preserved in the MSS. in the Bodleian Library, is **Kauṣītakimatānusāri
      Śāṅkhāyana Brāhmaṇa**" — 'the Śāṅkhāyana Brāhmaṇa which follows the doctrine of
      Kauṣītaki'. "There is no mention of Śāṅkhāyana in the text, and Vināyakabhaṭṭa,
      the commentator on the Brāhmaṇa, never mentions it under the title Śāṅkhāyana …
      in all probability the version of the doctrines of the Kauṣītaki school is
      preserved for us in a Śāṅkhāyana tradition."
      Independently corroborated by the text itself: the vaṃśa at Śāṅkhāyana Āraṇyaka
      15 makes Guṇākhya Śāṅkhāyana the pupil of Kahoḷa Kauṣītaki. Teacher and pupil in
      one lineage — hence one text under two names.
      What genuinely differs is not the chapter division but the **manuscript line**:
      the vulgate (Vināyaka's commentary, most MSS → Lindner 1887, Keith 1920) against
      the Kerala/Malayalam line (Lindner's MS M → Sarma 1968 → GRETIL). See the khaṇḍa
      warning under structures_verified.

  kaushitaki_brahmana_is_not_a_reordering_of_the_aitareya:
    verdict: "Confirmed, emphatically. It holds a great deal the Aitareya does not."
    wider_scope: >
      Keith HOS 25 §§1–2: "Not only does the Kauṣītaki Brāhmaṇa contain much less
      material than the Aitareya, but it has a wider scope. It includes all the Śrauta
      sacrifices of the first rank, omitting the less normal offerings such as the
      Rājasūya and the Aśvamedha." KB 1–4 = agnyādhāna, agnihotra, new/full moon,
      special and four-monthly offerings; KB 5–6 = the Brahman priest's function;
      KB 7–30 = Soma. The AB is essentially Soma only, with the agnihotra (v.26–34) a
      later addition and pañcikās vii–viii later still.
    material_with_no_AB_counterpart: >
      The Abhiplava Ṣaḍaha (KB xx–xxi); the Āditya and Savitṛ cups before the
      Vaiśvadeva Śastra (xvi.1–3); the Patnīvata cup (xvi.6); Hariyojana (xviii.6),
      Śākalas (xviii.7), the concluding bath (xviii.9), the barren-cow offering
      (xviii.11–14); Abhijit (xxiv.1–2), Svarasāmans (xxiv.3–9), Viśvajit (xxv.11–15),
      Viṣuvant (xxv.1–10).
    it_names_its_authorities_and_the_AB_does_not: >
      Keith: "The name Aitareya never occurs in its whole text, whereas the Kauṣītaki
      Brāhmaṇa constantly cites Kauṣītaki, and twice the Kauṣītaka, while though much
      less often it cites the views of the parallel school of **Paiṅgya**."
      Kauṣītaki at ii.9; vii.4,10; viii.9; xi.5,7; xiv.2,4; xv.2; xvi.9; xviii.5;
      xxii.1,2; xxiii.1,4; xxiv.8,9; xxv.8,10,14,15; xxvi.3,4,5,8,9,11,14; xxvii.1,6;
      xxviii.2,7; xxx.11. Paiṅgya at iii.1; xix.9; xxiv.8.
      **This is directly load-bearing for the project's thesis.** The KB is a text that
      shows its disagreements — it says whose view it is following and whose it is
      rejecting. That is the "arguments in between" the tradition is supposed to have
      lost, surviving in the least-read of the four texts.
    divergent_myth_versions: >
      Keith p. 22: the Gravastut priest / Arbuda hymn — AB vi.1 tells the story for its
      own sake, KB xxx.1 minimises it; the prattle of Aitaśa — AB vi.33 vs KB xxx.5;
      the Aṅgirases and Ādityas — AB vi.34–35 "shrinks into an almost unintelligible
      version" at KB xxx.6, with a *third* version again at Śāṅkhāyana Śrautasūtra
      xiv.40; Nābhānediṣṭha Mānava — AB v.14 at length vs KB xxviii.4 a bare allusion;
      Kavaṣa — AB ii.19 vs KB xii.3. Rudra's names: AB iii.33–34 (Prajāpati, Bhūtapati,
      Paśupati) against KB vi.1–9 (Bhava, Śarva, Paśupati, Ugra Deva, Mahān Deva,
      Rudra, Īśāna, Aśani).
    relative_age: >
      Keith p. 37: the KB is "clearly a redaction of the tradition of the school made
      deliberately **after** the redaction of the Aitareya in its first thirty Adhyāyas
      (i–vi), and embracing in it the views of the schools of Kauṣītaki and Paiṅgya,
      but with a preference in any case of dispute for the views of Kauṣītaki."
      Weber p. 44 rates the KB the better-arranged of the two. Witzel (canon.pdf §5.5,
      pp. 320–321): "KB clearly is a reformulation, in an order copied from YV Saṃhitā
      texts, of an older Ṛgvedic Brāhmaṇa such as that of the Aitareyin which centers
      on the Soma sacrifices. **Its exact relation to AB and some lost RV Brāhmaṇas
      remains open.**" Jamison & Witzel 1992 p. 12: "of which the Aitareya is the older
      and the more extensive."
    style_warning: >
      Keith: "The Kauṣītaki is distinctly inferior to the Aitareya, as the former text
      is everywhere so seriously condensed as to be needlessly and notoriously hard to
      understand", with "almost interminable use of the phrase *tasyoktaṃ brāhmaṇam*"
      ('its brāhmaṇa has been stated'). Practical consequence: the KB is full of
      back-references that only resolve against another passage. Any reader-facing
      treatment must resolve them or the text is unreadable.

  aitareya_aranyaka_is_composite:
    verified_against: "A. B. Keith, *The Aitareya Āraṇyaka*, Oxford 1909, Introd. §III 'Divisions of the Āraṇyaka and their date', pp. 15–22."
    core_vs_appendices: >
      Books **I–III** are the older core; books **IV** and **V** are later appendices.
      Keith divides the core into four parts: Book I (Mahāvrata, ritual + allegory,
      parallel to AB III.1–38 and IV.14, "doubtless more recent in date, or it would
      have been included in the Brāhmaṇa"); Book II adhy. 1–3 (the Uktha as
      Prāṇa/Puruṣa — "not directly connected with Book I, and it is doubtless later
      than it"); Book II adhy. 4–6 ("the Upaniṣad *par excellence*. It is probably
      later than part one"); Book III (the Saṃhitopaniṣad).
    a_correction_worth_making: >
      Keith **denies** Mahidāsa Aitareya's authorship even of books I–III, p. 16: "it
      would be incorrect to ascribe to him even the first three books of the Āraṇyaka,
      since in them he is cited as a teacher. He is named expressly in II, 1, 8 and
      3, 7, and is clearly referred to in I, 1, 1. This must be taken as decisive
      against his authorship." Our TITUS text confirms the citations
      ('etad dha sma vai tad vidvān āha mahidāsa aitareya', 'iti ha smāha mahidāsa
      aitareyaḥ'). The common statement "the Aitareya Āraṇyaka is by Mahidāsa" should
      not be repeated.
    book_IV: >
      **The Mahānāmnī = śakvarī verses, and nothing else.** Keith p. 18: "The fourth
      book consists solely of the Mahānāmnī verses. The presence of these verses is
      explained by Sāyaṇa on the ground that they must be studied in the forest."
      Keith's own index equates the names — "Śākvarī, see Mahānāmnī" (p. 393). Alluded
      to as the Śakvarī verses at RV VII.33.4 and X.71; ritual use at Āśvalāyana
      Śrautasūtra VII.12.10. A single undivided adhyāya. Confirmed in both our
      witnesses.
    ATTRIBUTIONS_book_IV_is_ashvalayana_book_V_is_shaunaka: >
      **Book IV → Āśvalāyana. Book V → Śaunaka. NOT the reverse** — and the reverse is
      the common error, because Oldenberg (GGA/ZDMG XXIX, 154 ff.) held it and Keith
      had to argue him down (Keith even notes at p. 18 n. 2 that in Oldenberg "the
      words 'fifth and fourth' should be transposed").
      For Book V → Śaunaka, Keith p. 20: "For Śaunaka's authorship of the fifth
      Āraṇyaka we have the distinct and repeated authority of Sāyaṇa" — Colebrooke
      (*Essays* I, 46) noted AiĀ V.2.5 cited by Sāyaṇa on RV I.8.1 as Śaunaka's; also
      Max Müller SBE I, xcv; and Sāyaṇa names Śaunaka repeatedly in the AiĀ commentary
      (on I.4.1 *eva pañcame śaunakenoddhṛtaḥ*, and again at I.4.2, I.4.3, I.5.2, I.5.3).
      For Book IV → Āśvalāyana, on Sadgurusiṣya's testimony; Keith's conclusion p. 20:
      "**There is therefore no sound evidence to ascribe the fifth Āraṇyaka to
      Āśvalāyana, and Sadgurusiṣya's attribution to him of the fourth Āraṇyaka remains
      the most probable.**" Corroborated by Witzel, canon.pdf n. 329 p. 322.
    book_III_authorship_and_date: >
      Anonymous and composite — built as a doxography of named teachers in dispute
      (Suravīra Māṇḍūkeya and his eldest son, Mākṣavya, Agastya, Hrasva Māṇḍūkeya,
      Sthavira Śākalya, Kauṣīhāravya, Kṛṣṇaharita, Mahaitareya). Keith p. 17: "It
      quotes Māṇḍūkeya and Śākalya among others, and makes use of the above terms to
      describe the *saṃhitā*, *pada*, and *krama pāṭhas* of the Saṃhitā. These are so
      far signs of late origin, but at the same time the treatment of the subject-matter
      is at a much earlier stage than that reached by Yāska or the authors of the
      Prātiśākhyas. … **it can probably be dated about the sixth cent. B.C.**"
      Keith confirms the terminology mapping this packet found in the text itself —
      *nirbhuja* = saṃhitā-pāṭha, *pratṛṇṇa* = pada-pāṭha, *ubhayamantareṇa* =
      krama-pāṭha, with the cosmic assignment "the earth is the seat of the nirbhuja,
      heaven the seat of the pratṛṇṇa, the atmosphere the seat of the ubhayamantareṇa."
      **That AiĀ 3 is EARLIER than the Prātiśākhyas and Yāska is the fact that makes it
      a sleeper node** — it is the earliest surviving statement of the pāṭha doctrine,
      and it predates the apparatus tier P2-b is sourcing. Structure: 2 adhyāyas ×
      6 khaṇḍas, confirmed from Keith's running heads.
    book_counts_per_keith: "I = 5 adhyāyas · II = 6 (+ the śānti as a 7th in most MSS) · III = 2 · IV = 1 · V = 3."

  shankhayana_aranyaka_numbering_is_unstable:
    keiths_division: >
      Keith, *The Śāṅkhāyana Āraṇyaka*, London (Oriental Translation Fund N.S. XVIII)
      1908 — 15 adhyāyas: I–II Mahāvrata · **III–VI the Kauṣītaki Brāhmaṇa Upaniṣad**
      (III the path after death, IV the nature of Brahman, V the unity of the Self,
      VI definitions of Brahman) · VII–VIII the Saṃhitā Upaniṣad · IX the strife of the
      senses · X the internal Agnihotra · XI the presages of death · XII the spell of
      the Bilva amulet · XIII–XIV the Brahman offering · XV the Vaṃśa. Keith p. x:
      "The Mahāvrata section is followed by the Kauṣītaki Brāhmaṇa Upaniṣad, forming
      books iii–vi of the Āraṇyaka." Adhyāyas I–II stand to the KB as AiĀ I stands to
      the AB (HOS 25 p. 38) and correspond to Śāṅkhāyana Śrautasūtra xvii–xviii.
      This matches the GRETIL text and this packet's own count exactly.
    the_competing_countings: >
      At least three other sequences are in circulation for the Kauṣītaki Upaniṣad's
      position: chapters **1–4** (Cowell's 1861 standalone edition, i.e. the Upaniṣad
      numbered on its own), chapters **6–9**, and chapters **1, 7, 8, 9**. The last is
      traceable to Poley via Weber, *HIL* p. 50 n. †, who quotes the claim "that the
      Kauṣītaki-Brāhmaṇa consists of nine adhyāyas, the first, seventh, eighth, and
      ninth of which form the Kauṣītaki-Brāhmaṇa-Upaniṣad" and adds "I have not
      succeeded in finding any statement to this effect elsewhere."
      **Adopt Keith's III–VI within the 15-adhyāya Āraṇyaka, and say explicitly that
      the others are alternative countings** rather than picking one silently. Our
      GRETIL witness marks the equivalence in its own reference strings, so the
      mapping is machine-checkable, not a judgement call.

  # -------------------------------------------------------------------------
  # COMMENTARY LANDSCAPE — recorded here only because it bears on which base
  # text is readable at all. The Sāyaṇa COVERAGE MAP across the corpus is P2-b's.
  # -------------------------------------------------------------------------
  commentaries:
    on_the_aitareya_brahmana: >
      Sāyaṇa's *Vedārthaprakāśa*, complete, and in print twice — Sāmaśramī's
      Bibliotheca Indica edition (Calcutta 1895–1906, 4 vols + a separately issued 1906
      preface) and Ānandāśrama Sanskrit Series 32 (Poona 1896, ed. Kāśīnātha Śāstrī
      Agāśe) whose Part I covers **pañcikās 1–4 only** — its own title page says so:
      "(THE FIRST FOUR PANCHIKAS ONLY.)". Aufrecht 1879 prints selected extracts from
      Sāyaṇa as an Anhang (pp. 239–403); Keith calls them "excellently chosen, and
      admirably edited".
    on_the_aitareya_aranyaka: >
      **Sāyaṇa's commentary on the whole Āraṇyaka exists and is printed twice.** Keith,
      *AiĀ* 1909 Introd. §II: "Sāyaṇa's commentary on the whole Āraṇyaka. Besides the
      edition of Rājendralāla Mitra and that in the Ānandāśrama series, I have used MSS.
      C, I, and W… In all probability it was genuinely composed by Sāyaṇa himself; it
      agrees with his Ṛgveda commentary in general, and **was written after the
      commentary on the Aitareya Brāhmaṇa**. It was written probably under Bukka I, who
      was certainly reigning in A.D. 1354."
      **Do not conflate Śaṅkara-on-the-Upaniṣad with Sāyaṇa-on-the-Āraṇyaka.** Keith
      enumerates six distinct works: Śaṅkara on the Upaniṣad (AiĀ II.4–6 only, printed
      often); Śaṅkara on Book II (unprinted, MSS P and X, both inaccurate); Śaṅkara on
      Book III (unprinted, MS X only); Ānandatīrtha's super-commentary on II–III
      (printed, Ānandāśrama); Viśveśvaratīrtha on II–III (unprinted); and Sāyaṇa on all
      five (printed).
      **Consequence that matters: for Āraṇyakas I (Mahāvrata), IV (Mahānāmnī) and V —
      which is to say for the accented material and for the Mahāvrata — Sāyaṇa is the
      ONLY commentary that exists, and it is in print.** Śaṅkara never touched them.
      Attribution trap flagged by Keith: the Ānandāśrama edition *of the Upaniṣad*
      ascribes its commentary to Vidyāraṇyamuni, i.e. Mādhava, Sāyaṇa's brother —
      "This attribution to Mādhava is an error."
    on_the_kaushitaki_brahmana: >
      **NOT Sāyaṇa.** Zero occurrences of सायण in Lindner, in Sarma, or in the
      commentary volumes; every one of Keith's ~40 Sāyaṇa references in HOS 25 is to the
      Aitareya. Two commentaries exist:
      **(a) Vināyaka Bhaṭṭa, son of Mādhava Bhaṭṭa** — the North Indian vulgate
      commentary, all 30 adhyāyas, **never published in full**. Keith p. 103: "Lindner's
      edition does not include the commentary of Vināyakabhaṭṭa … as the important work
      could not be edited from the available MSS… the comment on Adhyāya x has been
      edited by R. Löbbecke in 1908." Otherwise only Weber's extracts (*Ind. Stud.* II,
      292 ff.) and quotations in Maṅgaladeva Śāstrī 1955. Vināyaka also cites a **lost
      Mahākauṣītakibrāhmaṇa**.
      **(b) Udaya**, *Kauṣītakibrāhmaṇa-vyākhyāna*, epithet *Sukhadā* — the Kerala
      commentary, all 30 adhyāyas in three daśakas with one lacuna at the end of adhyāya
      28, and **this is the one actually in print**, in Sarma's three-volume set. Sarma
      judges Udaya superior to Vināyaka.
    on_the_shankhayana_aranyaka: >
      Essentially none. Keith 1908: "Of native commentaries I have only seen that of
      **Śaṅkarānanda on the Kauṣītaki Upaniṣad**" — i.e. ŚĀ iii–vi only, printed in
      Cowell, Bibliotheca Indica 1861. **ŚĀ i–ii and vii–xv have no commentary at all.**
      This is the least-commented text in the packet and, with the Mahāvrata in i–ii and
      the Saṃhitopaniṣad in vii–viii, arguably the one where a commentary would help most.

  # -------------------------------------------------------------------------
  unresolved_discrepancy_aitareya_aranyaka_khanda_total:
    the_problem: >
      The Ānandāśrama edition of the AiĀ with Sāyaṇa (ASS 38, 1898) closes with an
      explicit tally: **( आदितः संकलनाः — आर॰ ५  अध्या॰ १८  ख॰ ५५ )** — five āraṇyakas,
      eighteen adhyāyas, **fifty-five khaṇḍas**. The adhyāya figure matches this
      packet's independent count exactly (5+7+2+1+3 = 18). The khaṇḍa figure does not:
      our two witnesses give 75 counting every numbered unit, or 72 if Keith is followed
      that AiĀ II.5, II.6 and II.7 are undivided.
    what_i_can_and_cannot_say: >
      I can say the divergence is real and is about **khaṇḍa bracketing across editions**,
      the same phenomenon documented above for the Kauṣītaki Brāhmaṇa. I cannot say which
      adhyāyas Sāyaṇa's edition divides differently, because that requires reading the
      ASS 38 page images and their OCR is Devanāgarī-only and poor.
    action: >
      Do NOT record a khaṇḍa total for the Aitareya Āraṇyaka until this is settled off
      the page images. Record the structure by adhyāya (18), which all witnesses agree
      on, and treat khaṇḍa addresses as edition-specific until the ASS 38 division is
      collated against Keith's.

  structures_verified:
    aitareya_brahmana: "8 pañcikās × 5 adhyāyas = 40 adhyāyas; 285 khaṇḍas. See concordance."
    kaushitaki_brahmana:
      adhyayas: 30
      adhyaya_count_is_settled: >
        30, on three independent grounds. Keith HOS 25's Contents lists I–XXX. Pāṇini
        V.1.62 teaches name-formation for Brāhmaṇas of thirty and of forty adhyāyas,
        and Weber's identification of those with the Śāṅkhāyana (30) and the Aitareya
        (40) is endorsed by Weber (*HIL* p. 45) and Keith (*AiĀ* 1909 p. 16: "Weber's
        conjecture … is almost certainly correct"; HOS 25 p. 38: "Pāṇini (v.1.62)
        doubtless knew the Kauṣītaki as consisting of thirty Adhyāyas only"). A variant
        32-adhyāya reckoning — adding Śāṅkhāyana Āraṇyaka i–ii as two further books of
        the Brāhmaṇa — is attested in Vināyaka's commentary on KB v.5 and rejected by
        Keith as non-normal; it may lie behind the *Mahākauṣītaka* of Āśvalāyana
        Gṛhyasūtra iii.4.4 and Śāṅkhāyana Gṛhya iv.10.
      khanda_totals_by_witness:
        - "**276** — the vulgate. Stated by a manuscript colophon itself, quoted by
           Lindner from Bodleian Sansc. 6: 'asmin brāhmaṇe sarvasaṅkhyā || adhyāya 30,
           khaṇḍikā 276, granthasaṅkhyā 2829'. This is the count of Lindner's printed
           text (Jena 1887), of the Ānandāśrama edition, of Keith's translation and of
           Ganga Sagar Rai's 1987 edition."
        - "**272** — Sreekrishna Sarma 1968, the Kerala recension."
        - "**271** — what GRETIL's Tokunaga file actually yields when counted
           mechanically from its own reference strings (this packet's count). One short
           of Sarma's printed total; the file is self-declared unproofread."
        - "**260** — Burnell's Malayalam manuscript M, per Lindner."
      per_adhyaya_GRETIL_Sarma: "5,9,12,10,10,10,12,12,6,10,9,10,7,7,6,10,7,9,7,6,7,6,11,8,14,14,12,8,8,9  (= 271)"
      WARNING_THE_KHANDA_DIVISIONS_DO_NOT_MATCH: >
        **This is the sharpest practical warning in the packet.** 276 against 272 looks
        like a rounding problem. It is not. The *bracketing* differs adhyāya by adhyāya:
        Lindner's adhyāya 27 has 7 khaṇḍas where Sarma has 12; Lindner's 26 has 17 where
        Sarma has 14. Only **five khaṇḍas are genuinely absent** from Sarma — 16.10 and
        26.3–6 — and everything else in the 276/272 gap is re-bracketing of the same
        text. Sarma follows the Kerala/Malayalam line (Lindner's MS M, from Burnell's
        collection — Keith HOS 25 p. 103 calls it "a MS. with a good, but not perfect,
        tradition" and thinks Lindner underused it); Lindner and Keith follow the North
        Indian vulgate preserved in Vināyaka's commentary and most MSS.
        **Consequence: a KB khaṇḍa address does NOT transfer between the GRETIL Sanskrit
        (Sarma) and Keith's English translation (Lindner).** They diverge from adhyāya 3
        onward. Do not join them on the khaṇḍa number.
        **The fix exists and is cheap:** Ganga Sagar Rai, *Śāṅkhāyana Brāhmaṇam*, Ratna
        Publications, Varanasi 1987, prints the full Lindner↔Sarma comparative table.
        That table is the mapping, and acquiring it is the single highest-value action
        for this node. archive.org: `uvgr_shankhayana-brahmanam-ed-and-trans-by-ganga-sagar-ray-1987-varanasi-ratna-publications`
        (342 leaves, Sanskrit + Hindi translation, all 30 adhyāyas).
        Until that table is transcribed, the KB node must not be marked `structured`.
      the_226_figure: >
        English Wikipedia and vedicheritage.gov.in both state the KB has "30 chapters and
        226 Khaṇḍas". That figure matches no witness — not 276, not 272, not 271, not
        260 — and is unsourced in both places. **Second confirmed structural error on the
        same government portal.** Do not carry 226.
        **And the portal contradicts itself in its own markup.** Its Kauṣītaki page
        carries a 30-row adhyāya/khaṇḍa navigation table whose entries sum to **271**,
        and it serves exactly **271 recitation files, one per khaṇḍa**. Its own data
        agrees with GRETIL to the khaṇḍa; only its prose sentence says 226. The
        per-adhyāya vectors differ from GRETIL in exactly two places and cancel:
        GRETIL  5 9 12 10 10 **10** 12 12 6 10 9 10 7 7 6 10 **7** 9 7 6 7 6 11 8 14 14 12 8 8 9 = 271
        portal  5 9 12 10 10 **11** 12 12 6 10 9 10 7 7 6 10 **6** 9 7 6 7 6 11 8 14 14 12 8 8 9 = 271
      which_recension_the_portal_follows: >
        **The Kerala line, with Sarma.** Its khaṇḍa census (271) and its audio (271 files)
        both track GRETIL/Sarma, not Lindner's 276. That is useful: the portal's audio is
        khaṇḍa-aligned to the e-text we already hold, which means the recitation can be
        joined to the Sanskrit without the concordance work the Keith join requires.
        Three independent counts now say 271 for the Sarma line — this packet's count of
        the GRETIL reference strings, the portal's navigation table, and the file count
        of the portal's audio series.
    aitareya_aranyaka:
      books: 5
      structure: "Ār.1: 5 adhyāyas / 22 khaṇḍas (4,4,8,3,3) · Ār.2: 7 adhyāyas / 26 khaṇḍas (8,4,8,3,1,1,1) · Ār.3: 2 adhyāyas / 12 khaṇḍas (6,6) · Ār.4: 1 undivided unit (Mahānāmnī) · Ār.5: 3 adhyāyas / 14 khaṇḍas (6,5,3)"
      note: >
        TITUS/Doyama (from Keith 1909) and Sanskrit Wikisource agree on this exactly,
        independently. Āraṇyaka 2 also carries a second, continuous khaṇḍa numbering
        1–26 in parentheses in the Devanāgarī witness ('(एकविंशः)' at 2.4.1,
        '(पञ्चविंशः)' at 2.6.1, '(२६)' at 2.7.1) — a fourth address form, book-local.
      colophon: >
        The text calls itself the āraṇyaka-kāṇḍa OF the Aitareya Brāhmaṇa:
        'ityaitareyabrāhmaṇāraṇyakakāṇḍe … āraṇyake … khaṇḍaḥ', closing
        'iti bahvṛcabrāhmaṇāraṇyakam'. Relevant to layer modelling: in its own idiom
        the Āraṇyaka is a section of the Brāhmaṇa, not a peer of it.
    shankhayana_aranyaka:
      adhyayas: 15
      khandas: 146
      per_adhyaya: "8,18,7,15,8,20,23,11,8,8,8,8,1,2,1  (counted from GRETIL)"
      minor_divergence_to_watch: >
        Keith 1908 cites 'ii, 1-17' where GRETIL's text has 18 khaṇḍas in adhyāya 2.
        Small, but it is the same class of edition-specific re-bracketing that is a
        serious problem in the Kauṣītaki Brāhmaṇa, and Keith's ŚĀ i–ii follows
        Friedländer's text while GRETIL's follows Bhim Dev. Check before aligning.
      content_map: >
        1–2 Mahāvrata · 3–6 Kauṣītaki Upaniṣad · 7–8 Saṃhitopaniṣad (parallel to AiĀ 3)
        · 9–11 āntaram agnihotram / adhyātma · 12 mantras · 13–14 brahmayajña, vairāgya
        (late) · 15 vaṃśa.

  embedded_upanisads:
    aitareya_upanisad:
      locus: "Aitareya Āraṇyaka II.4 – II.6 (āraṇyaka 2, adhyāyas 4, 5, 6)"
      mapping:
        - "AiU 1.1 = AiĀ II.4.1  (ātmā vā idam eka evāgra āsīt)"
        - "AiU 1.2 = AiĀ II.4.2"
        - "AiU 1.3 = AiĀ II.4.3"
        - "AiU 2   = AiĀ II.5, UNDIVIDED  (puruṣe ha vā ayam ādito garbho bhavati)"
        - "AiU 3   = AiĀ II.6, UNDIVIDED  (ko 'yam ātmeti vayam upāsmahe)"
      the_precision: >
        **Write 'AiĀ 2.5', not 'AiĀ 2.5.1'.** Keith, *Aitareya Āraṇyaka* 1909, headnote
        to Index V, p. 354, states it flatly: "As II, 5 and 6 have no Khaṇḍas, the II is
        repeated where necessary to avoid ambiguity." Only II.4 is subdivided, into
        three. Verified independently against the TITUS/Doyama text, where units 10, 11
        and 12 — adhyāyas 5, 6 and 7 of āraṇyaka 2 — carry no Paragraph divisions at
        all, while unit 9 (adhyāya 4) carries three. Sanskrit Wikisource prints
        '2.5.1' and '2.6.1', supplying a khaṇḍa number that is not in the text.
        A three-level address is therefore WRONG for two of the five sections, and any
        schema that requires uniform depth will silently invent structure here.
      also: >
        Keith p. 9: the numbered sub-sections inside the Upaniṣad in Rājendralāla
        Mitra's edition and in Max Müller's SBE I translation "seem to be attributable
        to Rājendralāla himself, as there is no trace of them in any of the MSS.", and
        printed editions of the *Upaniṣad* follow **Śaṅkara's** sectioning, "which
        differs greatly from that of Sāyaṇa." So AiU-internal section numbers are
        editorial and edition-specific. Cite by the Āraṇyaka address, always.
        Keith's crit. note at the end of II.6 records that "the majority of the MSS. of
        the text, and of Sāyaṇa's commentary, and of Ānandatīrtha's own commentary, and
        his ṭīkā, add a seventh Adhyāya" — the vāṅ-me-manasi śānti. Hence AiĀ II.7,
        which both our witnesses carry. It is not part of the Upaniṣad proper.
      note: >
        Do NOT create an upanishad/ text node for this — it lives in aranyaka/ and is
        cross-referenced, per README 'Embedded texts live once'. The existing
        `upanishad: enumerated` entry in the śākhā status file already says so and
        should stay a pointer.
    kausitaki_upanisad:
      locus: "Śāṅkhāyana Āraṇyaka adhyāyas 3–6 (= KauṣU 1–4)"
      evidence: >
        The GRETIL Śāṅkhāyana Āraṇyaka marks the concordance in its own reference
        strings: 'śā 3,1 = ku 1,1', 'śā 4,1 = ku 2,1', 'śā 5,1 = ku 3,1',
        'śā 6,1 = ku 4,1'. Four adhyāyas, one-to-one.
      note: >
        A standalone Devanāgarī Kauṣītaki-Brāhmaṇa-Upaniṣad exists on Sanskrit
        Wikisource and is a slightly different recension from the ŚĀ-embedded text
        (opens 'चित्रो ह वै गार्ग्यायणिः' against GRETIL's 'citro ha vai gāṅgyāyaniḥ').
        Record it as a variant witness, not as the home node.

open_questions_for_merge:
  - id: two-texts-one-layer
    question: >
      The rigveda/shakala brāhmaṇa layer holds two texts and the āraṇyaka layer holds
      two. Does `brahmana/` gain `aitareya/` and `kaushitaki/` subdirectories, and
      `aranyaka/` gain `aitareya/` and `shankhayana/`? The filesystem path is the
      Prisma join key, so this is a one-hand decision and is not taken here.
      Records below use today's paths plus a `text` discriminator.
  - id: kaushitaki-shakha-affiliation
    question: >
      If the Kauṣītaki/Śāṅkhāyana material turns out to belong to a śākhā distinct from
      Śākala, both the Kauṣītaki Brāhmaṇa and the Śāṅkhāyana Āraṇyaka nodes move out of
      rigveda/shakala/ entirely. The rigveda/bashkala/ status file currently declares
      only a saṃhitā layer, so a move would mean creating layers there. See the
      scholarship section below. **Not resolved by assertion in this packet.**
  - id: aitareya-aranyaka-as-brahmana-kanda
    question: >
      The AiĀ's own colophons style it the āraṇyaka-kāṇḍa of the Aitareya Brāhmaṇa.
      The repo models āraṇyaka as a sibling layer of brāhmaṇa. Worth a note in the
      node's `notes` so a reader is not surprised by the colophon; not worth changing
      the model over.

