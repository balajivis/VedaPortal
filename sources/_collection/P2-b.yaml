  ================================================================================
  7. METHOD / HONESTY NOTE
  ================================================================================
  Every Archive.org identifier below was resolved through `archive.org/metadata/<id>` and the
  title/creator checked against the claim. Where a text layer is asserted, the `_djvu.txt` was
  fetched and character-counted (Devanāgarī codepoints and svara marks counted separately).
  Digital Library of India items very frequently ship an EMPTY `_djvu.txt` — several are marked
  as such below, and that is a real difference between two items that look identical in a
  search result. PDFs downloaded were run through the protocol §3 pdftotext test. Where I did
  not sample, the record says so.

