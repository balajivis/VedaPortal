  *Kaṭha: the tradition is explicit that the Kāṭhaka Saṃhitā carries no commentary, no
   padapāṭha, and no complete separate brāhmaṇa. The TITUS KS 19–22 padapāṭha is therefore a
   modern scholarly reconstruction (Werba's special edition), not a received text — treat it
   as such and do not present it as traditional.

  WHAT THIS MAP MEANS FOR THE BUILD
  - Free tokenisation exists for exactly ONE śākhā in machine-readable form: **Ṛgveda Śākala**.
    Every other śākhā that has a padapāṭha has it only as page images. That is a scanning-and-
    OCR problem, not a linguistics problem — the tradition already did the linguistics.
  - The **Taittirīya padapāṭha is the highest-value digitisation target in the whole corpus**:
    it exists, it is complete, it is public domain (1914/15), it is the anchor śākhā, and
    nobody has transcribed it. Doing so hands the project sandhi-resolved TS for free.
  - Where no padapāṭha exists at all — Kaṭha, Kapiṣṭhala, Jaiminīya, Paippalāda, Śatapatha —
    downstream tokenisation has no traditional ground truth and every sandhi decision becomes
    a model decision with no checksum. Those are exactly the śākhās where "AI generates,
    tradition verifies" has no tradition to verify against. Encode that honestly.
  - Maitrāyaṇī is the poignant case: the padapāṭha existed, is lost as a recitation, and
    survives only in two Pune manuscripts covering four kāṇḍas.

  ================================================================================
  3. SĀYAṆA'S TRUE COVERAGE
  ================================================================================
  Sāyaṇa is far more than a Ṛgveda commentator, and the popular picture understates him in one
  direction and overstates him in another.

  CONFIRMED, COMPLETE, AND OPEN (mūla + bhāṣya, Devanāgarī, usable text layer):
    Ṛgveda Saṃhitā ............ Max Müller ed.; Vaidika Saṃśodhana Maṇḍala (Sontakke/Kashikar)
                                4-part complete set, all parts text-searchable
    Taittirīya Saṃhitā ........ Ānandāśrama Sanskrit Series No. 42, ed. Kāśīnātha Śāstrī
                                Āgāśe, 9 parts, 1940–51
    Taittirīya Brāhmaṇa ....... ASS 37 (+38 for part 3), ed. Nārāyaṇaśāstrī Godbole
    Taittirīya Āraṇyaka ....... ASS 36, ed. Bābāśāstrī Phāḍke
    Aitareya Brāhmaṇa ......... Bibliotheca Indica, Satyavrata Sāmaśramī, 2 vols
    Aitareya Āraṇyaka ......... Bibliotheca Indica, Rajendralāla Mitra
    Pañcaviṃśa/Tāṇḍya Br. ..... Bibliotheca Indica, Ānandacandra Vedāntavāgīśa, 2 vols
    Ārṣeya Brāhmaṇa ........... CONFIRMED by reading the file: "आर्षेयब्राह्मणम् सायणाचार्य-
                                विरचितेन वेदार्थप्रकाशेन समन्वितम्", with the Bukka/Vidyātīrtha
                                invocation verses. Sāyaṇa's Vedārthaprakāśa covers it.
    Śatapatha Brāhmaṇa ........ Sāyaṇa's Vedārthaprakāśa, but PARTIAL — publishers uniformly
                                print it together with Harisvāmin's older commentary precisely
                                because Sāyaṇa's does not cover the whole text. The 1940
                                Gaṅgāviṣṇu 5-part Sāyaṇa+Harisvāmin set is the usable one.
                                The chapter-by-chapter boundary of what Sāyaṇa left uncovered
                                could not be established — flagged, not guessed.
    Sāmaveda Saṃhitā .......... Bibliotheca Indica, Sāmaśramī (Sāyaṇa attribution follows the
                                series pattern; not independently confirmed in that item)

  ATTESTED BUT NOT CLEANLY DIGITISED:
    Ṣaḍviṃśa Brāhmaṇa, Sāmavidhāna Brāhmaṇa — Sāyaṇa's involvement is attested; no clean,
    correctly-labelled open edition verified.
    Atharvaveda Śaunaka — Vishva Bandhu's 5-vol Hoshiarpur ed. (padapāṭha + Sāyaṇa bhāṣya,
    Vishveshvaranand Indological Series 13–17, 1960–64) is bibliographically real, but the
    Archive.org item found bundles it confusingly with Shankar Pandurang Pandit's unrelated
    1895–98 critical edition and only 2 of 5 volumes are identifiable. Treat as NOT covered.

  CORRECTION TO A COMMON ASSUMPTION:
    Sāyaṇa DID work on the Śukla Yajurveda — jointly with Ānandabodha, on the **Kāṇva**
    recension of the Vājasaneyi Saṃhitā (Chowkhamba pub. adhyāyas 1–20, 1915; B.R. Sharma's
    modern critical ed. 1988 carries Sāyaṇa+Ānandabodha for 1–20 and Ānandabodha+Anantācārya
    for 21–40). The Mādhyandina VS is the one he did not touch — there the commentators are
    Uvaṭa (Mantrabhāṣya) and Mahīdhara (Vedadīpa, 1588).

  CONFIRMED ABSENT:
    Jaiminīya Brāhmaṇa — no Sāyaṇa, no classical commentary of any kind; the first complete
    edition (Raghu Vira & Lokesh Chandra 1954) was made without any commentary or paddhati.
    Kaṭha, Maitrāyaṇī, Kapiṣṭhala Saṃhitās — no Sāyaṇa. Among the four surviving Kṛṣṇa
    Yajurveda recensions only Taittirīya drew sustained classical commentary (Bhaṭṭa Bhāskara,
    then Sāyaṇa). Kāṇva Śatapatha — no Sāyaṇa and apparently no classical commentary.

  THE OLDER SOUTH INDIAN LAYER, WHICH MATTERS FOR THE ANCHOR ŚĀKHĀ:
    **Bhaṭṭa Bhāskara Miśra** predates Sāyaṇa and commented on ALL THREE Taittirīya texts
    (TS, TB, TA) — full coverage, independent of Sāyaṇa. Mysore Government Oriental Library
    Series, ed. A. Mahādeva Śāstri (TS 1894–98; TB/TA 1900–02). All three are open with usable
    text layers. The Vaidika Saṃśodhana Maṇḍala critical TS prints BOTH commentaries side by
    side ("भट्टभास्कर-सायणाचार्य-विरचित-भाष्याभ्यां समेता" — read directly off the title page).
    For a Taittirīya-anchored project this is a second, older, independent reading of the same
    text, and it should be treated as a peer layer, not an appendix to Sāyaṇa.

  H.H. WILSON'S ENGLISH ṚGVEDA (follows Sāyaṇa's interpretation — the intended cross-check):
    6 volumes, London 1850–1888. Wilson (d. 1860) completed the earlier volumes; vol. 4 ed.
    E.B. Cowell, vol. 5 Cowell & W.F. Webster, vol. 6 Webster alone. Two complete open sets on
    Archive.org, all volumes verified with text layers. No single-file complete edition exists.
    wisdomlib.org carries a genuinely machine-readable HTML transcription. Do not confuse with
    sacred-texts.com's Ṛgveda, which is Griffith, not Wilson.

  ================================================================================
  4. GENUINELY UNAVAILABLE IN ANY DIGITAL FORM
  ================================================================================
  a) **The Nighaṇṭu has no open machine-readable text.** GRETIL's `sa_yAska-nirukta` is the
     Nirukta ONLY — verified by reading the file: it opens at Nirukta 1,1 and ends at 14,37,
     and "nighaṇṭu" appears in it only as the word Yāska is glossing. TITUS lists a Nighaṇṭu
     e-text (Kobayashi) as "under preparation" with no public version. So the Nighaṇṭu — the
     list of difficult words that is the actual input to a meaning layer — exists digitally
     only as page scans. This is the highest-value small transcription job in the packet: five
     short chapters of word-lists.
  b) **The Taittirīya Anukramaṇī.** Kātyāyana is credited with anukramaṇīs for both the
     Taittirīya and the Mādhyandina; the Mādhyandina one is in print and online, the
     Taittirīya one is not, under any search tried. See the not-found record for
     `where_i_looked`.
  c) **A Kāṇva-specific anukramaṇī** — not found; possibly none exists distinct from
     Kātyāyana's Mādhyandina Sarvānukramasūtram.
  d) **Nidānasūtra** — the 1939 Bhatnagar scan is the only digital object anywhere; no e-text
     on GRETIL, TITUS, Muktabodha or sanskritdocuments.
  e) **Pāraskara Gṛhyasūtra Sanskrit text** — not on GRETIL; the clean PD digital text for
     this Śukla Yajus gṛhya tradition is Oldenberg's English (SBE 29), not the Sanskrit.
  f) **No Prātiśākhya at all is machine-readable except the Taittirīya.** GRETIL's section
     literally headed "Pratisakhyas" contains no Prātiśākhya — only the Nirukta and the
     Ṛgvidhāna. TITUS holds exactly one, the TP. Ṛk-, Vājasaneyi-, Śaunakīyā Caturādhyāyikā
     and Ṛktantra/Puṣpasūtra are scans only. For a project whose thesis is that the
     Prātiśākhyas are the accent specification, this is the structural gap: the specification
     is not in a form a program can read, for four of five branches.
  g) **No Anukramaṇī of any Veda is machine-readable.** All five (incl. the RV, which is
     P0-a's) are page images. The Anukramaṇī validation harness — build-order #1 — is
     blocked on transcription, not on discovery.
  h) **English translations that do not exist at all** (not paywalled — absent): Āpastamba
     Śrautasūtra, Baudhāyana Śrautasūtra (complete), Bhāradvāja Śrautasūtra, Baudhāyana
     Gṛhyasūtra, Hiraṇyakeśi/Satyāṣāḍha Śrautasūtra, Vaikhānasa Śrautasūtra, Lāṭyāyana and
     Drāhyāyaṇa Śrautasūtras (Parpola's 1968–69 study is a monograph, in copyright, offline).

  ================================================================================
  5. SCHEMA NOTES FOR THE MERGE REVIEWER  (decisions deliberately NOT taken here)
  ================================================================================
  - `apparatus.padapatha` and `apparatus.bhashya` are used below as node kinds. Neither exists
    in any _status.yaml today. They are used so records get distinct primary keys and cannot
    collide with P1-a/P1-b records on the same saṃhitā node. If you would rather model
    padapāṭha as a FIELD on the saṃhitā node than as an apparatus child, these records rewrite
    trivially — the finding is the map in §2, not the path.
  - Nirukta and Nighaṇṭu are filed under `_reference/`, per README's description of that
    directory as cross-cutting apparatus. They are Vedāṅga, pan-Vedic in application though
    traditionally attached to the Ṛgveda. If you prefer `rigveda/shakala/apparatus/nirukta`,
    that is a defensible call — it is yours, not the collector's.
  - Several Kalpa texts serve more than one śākhā (Kātyāyana serves both Śukla branches;
    Ṛktantra/Puṣpasūtra serve all three Sāma branches). They are logged once, on the śākhā
    whose _status.yaml already declares the cell, with `also_serves` in notes.

