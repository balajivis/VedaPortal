    notes: >
      Kumārila's translation of the sūtra, in Jha's English: "When there is a coalition of
      Direct Declaration, Indicative Power, Syntactical Connection, Context, Position, and
      Name, that which follows is always weaker than the one preceding it; because it is
      more remote from the purpose in view."
      HIS OPENING MOVE IS THE USEFUL ONE and it is a definition of the trigger condition:
      "as no comparison could be made when each of them treated of different subjects, we
      take them up as referring to one and the same subject; and that is why the sūtra
      speaks of their 'samavāya', 'coalition', by which is meant the fact of their BEARING
      UPON A SINGLE SUBJECT." That is the precondition for the whole rule and it is easy to
      miss in Śabara. If the project builds an adjudication procedure, this sentence defines
      when the procedure may be invoked at all.
