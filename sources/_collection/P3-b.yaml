    status: found-complete
    where_i_looked: n/a
    notes: >
      COMPLETE: 15 adhyāyas, 146 khaṇḍas (8,18,7,15,8,20,23,11,8,8,8,8,1,2,1),
      closing 'iti śāṅkhāyanāraṇyakaṃ samāptam'. Reference form 'śā adhyāya,khaṇḍa'.
      **It marks the Kauṣītaki Upaniṣad concordance in its own reference strings** —
      'śā 3,1 = ku 1,1' through 'śā 6,1 = ku 4,1'. Adhyāyas 3–6 = KauṣU 1–4. That is a
