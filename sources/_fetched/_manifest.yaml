# =============================================================================
# PACKET F4 — the four reference datasets + the dharmasastra control corpus
# Appended 2026-08-01. Nothing above this line was modified.
# =============================================================================

summary_F4:
  packet: F4-reference-datasets-and-dharmasastra
  date: 2026-08-01
  budget_bytes: 4000000000
  total_bytes_fetched: 723697601        # 724 MB of a 4 GB budget — 18%
  files: 1046                            # includes .git objects of three shallow clones
  disk_free_after: "~30 GB"
  scope_respected: >
    F2's layer (Eggeling, Griffith, Keith, Whitney, Bloomfield SBE 42, Oldenberg SBE 29/30,
    Macdonell Brhaddevata) and F3's layer (Wilson, astaka concordance) were NOT touched.
    SBE volumes taken here are 2, 14, 25 and 33 only — Buhler's Dharmasutras and Manu, and
    Jolly's Narada/Brhaspati. Those are B3/B4/B5 and are disjoint from F2's SBE 29/30/42.
    The Grhyasutras taken here are the SANSKRIT sutra texts from GRETIL, a different layer
    from Oldenberg's English translations which belong to F2.

  # ---------------------------------------------------------------------------
  # THE HEADLINE ANSWER: does a machine-readable Vedic Concordance exist?
  # ---------------------------------------------------------------------------
  machine_readable_concordance: >
    YES. It exists, it is complete, and two independent copies are now in hand. Neither is
    advertised; both were recovered by COLLECTION-PROTOCOL rule 11 probing after the two
    documented distribution sites had died.

    COPY 1 — Franceschini 2005, UTF-8 IAST, 88,826 pada entries. The search front end at
    ieed.ullet.net/bloomfield.html posts to cgi-bin/pick. That path is served by a
    MISCONFIGURED web server that returns the CGI EXECUTABLE ITSELF instead of running it:
    a 7,869,389-byte unstripped x86-64 ELF. The entire concordance database is compiled into
    that binary as NUL-terminated C strings in .rodata, already in UTF-8 IAST, one string per
    pada, in the form "pada # SIGLUM.ref; SIGLUM.ref." with <b> marking Franceschini's added
    material and <u> marking Atharvaveda-Paippalada readings the editor flags as not
    understood. 89,189 '#' bytes are present in the file; 88,826 decode as complete entries;
    262 further strings contain '#' but are non-entry binary noise. Extracted to
    entries.txt and concordance.tsv. 86 distinct sakha/text sigla appear — RV AVS AVP VS VSK
    TS MS KS KSA SV JB JUB PB TA TAA TB SB AA AB KB KA GB Vait N and the whole sutra tier.
    THIS IS THE CROSS-SAKHA OCCURRENCE TABLE THE PROJECT SCHEMA CALLS THE CORE RESEARCH
    SIGNAL, already keyed by sakha, already in Unicode, requiring no OCR at all.

    COPY 2 — Franceschini & Passi 2000, the ORIGINAL downloadable distribution. Archive.org
    item vedicconcordancebloomfieldrevisededition_601_A appeared dark: its metadata API
    returns no PDF, no djvu.txt, no _text.pdf. It holds ONE file, a 4,416,476-byte RAR, which
    an extension filter skips. Inside: "CONC Windows/CONC_WIN.RTF" (9,050,809 bytes),
    CONC_WIN.DOC (11,205,120 bytes) and the four bundled "Winind" TrueType fonts. The RTF
    holds 90,120 entries, one per \bullet, encoded in the legacy 8-bit Winind codepage
    (\fonttbl ... \fcharset0 Winind). This is COLLECTION-PROTOCOL section 3's legacy-encoding
    case exactly: the diacritics are all present, the encoding is simply pre-Unicode, and the
    remap table is derivable from the bundled TTFs. DO NOT SEND IT TO OCR.

    The two copies differ (90,120 vs 88,826 entries) because they are different versions —
    the 2000 release and the 2005 revision. Cross-checking them against each other is a
    free, high-value validation pass that nobody has run.

    WHERE THE ADVERTISED COPIES WENT: digilander.iol.it/marcofrance (the Italian site named
    in Witzel's 2000 IAVS announcement) resolves to nothing; digilander.libero.it/marcofrance
    returns HTTP 410 Gone; www.fas.harvard.edu/~sanskrit/pubs.html returns 403; the TITUS
    path returns 404. Four of four documented distribution points are dead. Both surviving
    copies were found behind them.

    LICENCE, STATED HONESTLY: Witzel's July 2000 announcement asserts joint copyright of
    M. Franceschini and the Harvard Oriental Series in Italy and the USA, permits private use
    by scholars, and explicitly threatens legal action over redistribution. The Archive.org
    item carries an uploader-asserted CC0 notice which is almost certainly wrong and is NOT
    relied on here. Both copies are therefore classified copyright-link-only. They sit in a
    gitignored directory, they must never be committed, republished, shipped in a build, or
    exposed through an API. Bloomfield's own 1906 entries within them are public domain under
    rule 9; Franceschini's additions are not, and they are visually distinguishable (bold in
    the ieed data, absent from the 2000 RTF).

