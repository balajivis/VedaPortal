    two of mine were not.
    WHAT THE NAMBUDIRI MATERIAL ACTUALLY IS, stated carefully so it is not over-read:
    the 1933 Bake holdings are roughly a dozen wax-cylinder items, several catalogued as
    "almost inaudible… heavy mould on cylinder", none online, listenable only in person by
