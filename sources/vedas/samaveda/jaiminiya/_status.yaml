audio:
  status: sourced
  note: "THE BEST-RECORDED SAKHA IN THE SWEEP, and it was nearly logged not-found. FOUR independent bodies: (A) IGNCA Vedic Heritage — 191 MP4s at /samhitas/samaveda-samhitas/jaiminiya-samhita-2/, JS-injected and invisible to scrapers, verified by direct HTTP. (B) Arnold Bake, BRITISH LIBRARY, 1933 — slip notes read '[Samaveda, Nambudiri (Jaiminiya)] Kottayam 6/11/33 Aranyakagana'; several catalogued 'almost inaudible... heavy mould'. (C) Staal/Levy Kerala 1957 and 1962, Folkways LP 1969. (D) Kalady — unpublished 1995-2015 Kerala Jaiminiya recordings, available on request."
findings:
  - "THE JAIMINIYA GANA IS PRINTED WITH NO NOTATION AT ALL — no accent marks, no svara-anka digits. Confirmed for BOTH the Kerala Devanagari and the Paravastu Telugu editions. It was never notated; the melody lives in written-out vowel prolongations, stobhas and oral transmission. A source reading svara=0 digits=0 is CORRECT here, not defective. FOR JAIMINIYA, THE RECORDING IS THE TEXT — audio is the primary carrier, and any text-only record of this sakha is incomplete by definition."
  - "CAPTURE SEQUENCE, cheapest and most perishable first: (1) email Kalady; (2) digitise the Bake cylinders, 93 years old and moulded; (3) resolve whether Howard's tapes are at Indiana ATM; (4) only then record. The urgency is FRAGILITY AND DISPERSAL, not absence — four bodies of recording under four incompatible rights regimes, with exactly one item anywhere carrying a clean licence (CC BY-NC 4.0)."
  - "The Jaiminiya Brahmana has NO classical commentary at all."
