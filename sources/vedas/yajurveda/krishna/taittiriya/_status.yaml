  padapatha:    { status: sourced, note: "KYVeda TS-Padam, complete, all 7 kandas. Also TS-Kramam and a Jatai/Ghanam project — the vikrti pathas, i.e. the tradition's own error-correcting code, machine-readable." }
  kalpa:        { status: enumerated, note: "Apastamba, Baudhayana, Bharadvaja, Vaikhanasa sutra traditions" }
  bhashya:      { status: sourced, note: "TWO classical commentators, and the earlier one is not Sayana. BHATTA BHASKARA MISRA commented on all three Taittiriya texts and PREDATES Sayana; both commentaries are fully open and the VSM critical edition prints them SIDE BY SIDE with the padapatha. Two named classical readings of the same text, with real disagreement between them — the natural material for the side-by-side tier discipline." }
findings:
  - "TAITTIRIYA PRATISAKHYA 24.5 NAMES EXACTLY THREE ACCENT QUALITIES — svarita, udatta, nicatva. Read directly off the source. This answers the first item on the build plan's open-[verify] list ('whether Taittiriya marks 2 or 3 accent classes; determines the accent head's label set'). The anchor sakha's own specification answering a question about its own accent system. Still worth confirming with the guru as a practice question."
  - "BARAHA MARKERS ARE SIX, NOT TWO. q and # map to U+0952 and U+0951, but $, &, ~M and (gg) require Vedic Extensions (U+1CD0-1CFF). A two-rule importer looks like it works and silently drops data."
  - "KYVeda/texts declares NO LICENCE and is ~8.5 GB — needs a sparse checkout of the text directories. Under rule 9 the mula text is PD regardless, but there is no explicit grant to lean on."
sources:
