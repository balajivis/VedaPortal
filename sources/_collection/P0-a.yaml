    Sarvānukramaṇī itself has no clean digital text, the Bṛhaddevatā is the only primary
    Anukramaṇī-class text obtainable in usable Unicode, and it gives a second traditional
    reading to set beside WSC2023's Kātyāyana labels and VedaWeb's Geldner addressees. Three
    independent devatā assignments, two traditional and one philological — that is exactly the
    named-readings-side-by-side structure the content discipline calls for.
