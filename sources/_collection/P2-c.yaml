        https://qalamos.net/oai2?verb=Identify → 200, <repositoryName>MyMSS Repository</repositoryName>,
          responseDate 2026-08-01T10:28:26Z. SEVEN metadata formats, including oai_tei,
          oai_mods, oai_marc21 and the Handschriftenportal profiles oai_tei_hsp_kod /
          oai_tei_hsp_desc. TEI out of an OAI feed is unusually good for this material.
        ?verb=ListIdentifiers&metadataPrefix=oai_dc&set=language:LANG0021 → 200,
          completeListSize="33818" — 33,818 Sanskrit-language records.
        https://qalamos.net/servlets/solr/select?q=category:MyMssSubjectMatter\:THEM0065.005&wt=json&rows=0
          → 200, numFound 1151. That category is the catalogue's own subject class "Veda".
      IMPORTANT ENDPOINT DISTINCTIONS, all confirmed: /servlets/solr/**select** is open;
      /servlets/solr/**find** returns 403. /api/v1/objects and /api/v2/objects return 401
      ACCESS_DENIED. /oai/OAIHandler and /servlets/OAIDataProvider return 404 — the working
      OAI path is the bare /oai2. Solr's `fl` is pinned as a solrconfig invariant, so select
      returns IDs but not full metadata; the working pipeline is two-step — Solr for IDs,
      then OAI GetRecord for the record.
    record_count: >
      504,607 records in the whole Qalamos corpus (verified by me, q=*:*).
      Sanskrit: 36,065 by Solr category MyMssLanguage:LANG0021 (verified by me), but 33,818
      by OAI ListIdentifiers set=language:LANG0021 (also verified by me). The two disagree by
      ~2,200 — the OAI set and the Solr category are not the same population. Harvest one or
