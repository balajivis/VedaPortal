    Also located: an item titled kapiShThala-kaTha-saMhitA-hans-oertel — inspected and it is
    NOT the text. It is Hanns Oertel's German study (Latin script, 0 Devanāgarī across the
    sampled range). Recorded so the next collector does not re-open it expecting an edition.
  notes: >
    GENUINELY AND PERMANENTLY INCOMPLETE — the defining fact of this node, and it is
    textual loss, not a sourcing gap. The single surviving manuscript covers 64 chapters
    across 8 aṣṭakas, and it is damaged. As reported: aṣṭaka 1 complete (8 chapters);
    aṣṭaka 2 damaged and incomplete; aṣṭaka 3 — chapters 9–24 LOST; aṣṭaka 4 — chapters
    25–31 intact, chapter 32 LOST; aṣṭaka 5 — all recovered except chapter 33; aṣṭaka 6 —
    chapter 43 LOST, remaining seven available. Roughly a quarter of the text is gone and
    no edition will recover it.
    `status: found-partial` is therefore the correct and permanent value for this node.
    It should NOT be read as "we have not finished looking". We have. This is all there is.
    TITUS holds a Kapiṣṭhala-Kāṭha-Saṃhitā e-text openly (kaps.htm), data entry
    M. Fushimi (Ōsaka), under the same all-rights-reserved notice quoted on the Maitrāyaṇī
    record. Catalogued at index level; not fetched.
    GENUINELY OPEN AND USEFUL: Fushimi's mantra index for the Kapiṣṭhala-Kāṭha-Saṃhitā is
    freely available at http://www.ejvs.laurasianacademy.com/Fushimi-Kps.pdf via the
    Electronic Journal of Vedic Studies — an open venue, unlike TITUS itself. For a text
    this fragmentary a mantra index is disproportionately valuable, since it is what lets
    surviving mantras be matched against KS, MS and TS parallels.
    MANUSCRIPT LEAD FOR P2-c: one imperfect manuscript, and its lacunae ARE the text's
    limits. Logged, not chased.
    CREDIT: Raghu Vira (1902–1963); Masato Fushimi for the e-text and mantra index.
  date_logged: 2026-08-01

