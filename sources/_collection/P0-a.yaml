    avs001 (21/36), Ṛgveda rv001 (138/188), and confirmed several texts are unaccented even in
    transliteration (Pañcaviṃśa, Sāmavidhāna, Aitareya Br., Jaiminīya-Up.-Br. all 0).
    U+1CD0–1CFF is used NOWHERE in TITUS — accents are the basic U+0951/U+0952 pair only.
  svara_verified?: pending — BV
  text_layer: unicode
  license: copyright-link-only
  status: found-complete
  where_i_looked: >
    Index URLs tested: titus.uni-frankfurt.de/indexe.htm → 200 but it is the general homepage
    with no direct Vedic link. titus.fkidg1.uni-frankfurt.de/texte/etcs/ind/aind/ved/vedtx.htm
    → 200 but it is a SOFT-404 reading "Sorry, the requested page is not (yet) available",
