# P2-a — Endangered set: Jaiminīya · Rāṇāyanīya · Kaṭha · Maitrāyaṇī · Bāṣkala · Kapiṣṭhala
#
# Schema: COLLECTION-PROTOCOL.md §1. One record per node (śākhā → layer).
# Staging only. Nothing here is authoritative. Do not merge without review.
# `svara_verified?` is BV's field and is left `pending — BV` everywhere, untouched.
#
# Two schema notes for the merge pass, flagged rather than decided:
#   (a) AUDIO. The packet brief asks for recitation audio per śākhā, but §1's `layer`
#       enum has no slot for it. Audio records below use `layer: audio` and a node_path
#       of `<shakha>/_audio`. This is an extension, not an existing convention — the
#       merge pass should either bless it or fold these into the śākhā `_status.yaml`
#       under a new `recordings:` key. Either way the FINDINGS stand; only the shape is open.
#   (b) NEW LAYER NODES. Several records propose layers that the current `_status.yaml`
#       files do not list (Bāṣkala brāhmaṇa/āraṇyaka/upaniṣad, Kapiṣṭhala brāhmaṇa,
#       Maitrāyaṇī brāhmaṇa/āraṇyaka). Each is flagged `proposes_new_node: true` with the
#       attribution question stated. Per binding rule 7 the doubt is in `notes`, never
#       silently in `shakha`. The merge pass decides whether the node gets created.

summary:

  method:
    accent_test: >
      Protocol §3 test run on every PDF actually downloaded, plus — per the P0-a
      correction relayed mid-packet — NFC normalisation before counting, and counting
      U+0951/U+0952/U+1CD0–1CFF *specifically* rather than any combining mark. The trap
      is real: GRETIL's Maitrāyaṇī plain text returns 25,195 combining diacritics under
      NFD and ZERO Vedic accents; those 25k are decomposed ṛ/ṣ/ā, not svaras.
      For Sāmaveda nodes digits were counted as well (numeric gāna notation).
      Where OCR was untrustworthy (all DLI scans are), accents were settled by rendering
      the page to an image and reading it. Three findings below were overturned that way.
    the_search_lesson: >
      THE MOST TRANSFERABLE RESULT IN THIS PACKET, and it cost me a wrong answer to learn.
      I logged Rāṇāyanīya as having no text and no audio after searching vedicheritage,
      GRETIL, TITUS, sanskritdocuments, sanskritweb and a title-keyed archive.org query.
      Both conclusions were wrong. Five CC0 editions and ~2.7 GB of recitation existed the
      whole time, in archive.org COMMUNITY uploads, indexed under transliterated Sanskrit
      (`rANAyanIya`, `sAmavedaH`) that no English-language query reaches.
      The curated Sanskrit-digital ecosystem is Kauthuma-and-Taittirīya shaped. For a
      minority śākhā its silence is WEAK EVIDENCE OF ABSENCE — which is precisely the
      inversion this packet exists to catch, since these six are minority śākhās by
      definition. P1-a reached the same conclusion from the other direction: it found no
      Śatapatha anywhere in the accented-Devanāgarī publisher ecosystem, in either
      recension, which means that ecosystem's coverage collapses outside Taittirīya.
      CONSEQUENCE, applied honestly to my own file: every remaining `not-found` here rests
      partly on those same sources and should be re-run against the community tier with
      transliterated spellings before being treated as settled. The Jaiminīya audio record
      is the one where this matters most, and it says so in its own `where_i_looked`.
    ignca_portal_correction: >
      A CLAIM I MADE REPEATEDLY IN THIS FILE WAS WRONG, AND IT WAS WRONG IN A WAY THAT
      MATTERS FOR EVERY `not-found` AUDIO RECORD HERE.
      I asserted, in six records, that vedicheritage.gov.in "attaches Audio/Video child
      links to exactly two saṃhitās site-wide — Taittirīya and Śaunaka". That was inferred
      from the portal's navigation markup. It is FALSE.
      The portal hosts **191 MP4 files of Jaiminīya recitation** — a Richā (recitation) tab
      and a Gāna (chant) tab — on `/samhitas/samaveda-samhitas/jaiminiya-samhita-2/`.
      They are invisible to scraping because the page's `<video>` element ships with
      `src=""` and is populated at runtime by JavaScript. I verified the files directly by
      HTTP rather than trusting the page: `Jaiminiya_Samhita/Gaan_mp4/1_Gramgeya_Gaan/
      Agneya/Samjssg_01_01.mp4` → 200, video/mp4, 118,565,670 bytes;
      `Jaiminiya_Samhita/Richa_mp4/1_Agneya/Samjsr_01_01.mp4` → 200, 19,548,603 bytes.
      I further probed the Aindra series and found `Samjsr_02_01` through `Samjsr_02_36`
      all 200 and `Samjsr_02_37` a 404 — i.e. the enumerated section boundaries are real.
      CONSEQUENCE FOR THE REST OF THIS FILE: a "no audio on the portal" finding for the
      other five śākhās rests on their navigation entries being dead `#` links, which is
      still true and still meaningful. But it can NO LONGER rest on "the portal only has
      two". Those records have been corrected. The Rāṇāyanīya negative in particular was
      established by reading three page levels and finding no player — exactly the method
      that failed here — and is now explicitly marked as lower-confidence.
      GENERAL RULE EARNED TWICE OVER: for this portal, and for any JS-driven site, probe
      the media paths by HTTP. Do not conclude absence from rendered HTML.
      LICENCE, quoted from https://vedicheritage.gov.in/copyright-policy/ : "The contents
      of this website can not be reproduced partially or fully, without written permission
      from Indira Gandhi National Center for the Arts or the contributor." Stream and cite;
      do not mirror.
    accent_marker_sets: >
      Per P1-a: where a source is in Baraha or a similar transliteration scheme, the accent
      marker set is SIX, not two — `q` and `#` map to U+0952 and U+0951, but `$`, `&`,
      `~M` and `(gg)` need Vedic Extensions (U+1CD0–1CFF), and a two-mark reading silently
      drops data. No Baraha-format source was encountered in this packet, so the note is
      carried rather than applied. The equivalent trap DID bite here in two other forms,
      both recorded at the node: the Kāṭhaka udātta-bar convention, which inverts the
      meaning of U+0951 relative to Taittirīya practice; and Rāṇāyanīya gāna notation,
      which uses superscript digits AND subscript akṣaras and is not expressible in the
      accent-mark model at all. The general rule: record the marker set you OBSERVED in
      each source, never the scheme you assumed.
    what_i_did_not_do: >
      No bulk content was fetched from TITUS. Its holdings are catalogued from the index
      page and each text's index header only, per the coordinator's hold-the-line
      instruction while a permission request is pending at the human level.
      No individual reciters, contacts, addresses or phone numbers were recorded, from any
      source — including the IGNCA pāṭhaśālā PDFs, several rows of which are individuals
      rather than institutions. Those rows were skipped, not anonymised.

  headline: >
    ALL SIX have real text, and that is not what I expected to be able to write. Four have
    free accented or notated editions today (Kāṭhaka, Maitrāyaṇī, Rāṇāyanīya gāna,
    Jaiminīya); Kapiṣṭhala is free but permanently incomplete and permanently unaccented;
    Bāṣkala's saṃhitā is genuinely lost while its other layers may survive under a
    contested attribution.
    On AUDIO: Jaiminīya is the best recorded (191 IGNCA files, 1933 Nambudiri wax
    cylinders at the British Library, Staal/Levy Kerala 1957–62, ~2 GB on archive.org),
    Rāṇāyanīya has ~2.7 GB free, and Maitrāyaṇī is recited on a published schedule to
    2034. The other three — Kaṭha, Kapiṣṭhala, Bāṣkala — are terminally silent: no
    community remains to record.
    READ THE NEGATIVES IN THIS FILE WITH CARE. I logged three `not-found` audio results
    that later proved false — Rāṇāyanīya, Jaiminīya, then Nambudiri Jaiminīya specifically
    — each time by inferring absence from a rendered page or a keyword query instead of
    probing the resource. All three are corrected in place with the error recorded rather
    than tidied away; see `the_search_lesson` and `ignca_portal_correction`. The remaining
    negatives are stronger than those were, but they are not all equally strong and each
    says so.
    THREE FINDINGS THAT OUTLIVE THIS PACKET: the Kaṭha pointer in `_status.yaml` is a
    misidentification, though the accented Kāṭhaka it reached for exists and is free;
    the Kāṭhaka accent convention INVERTS the meaning of U+0951 relative to Taittirīya;
    and the Jaiminīya gāna carries NO notation of any kind, so for that śākhā the
    recording is not a supplement to the text — it is the only carrier of the melody.

  per_shakha:

    jaiminiya:
      audio_correction: >
        WRONG TWICE, IN OPPOSITE DIRECTIONS. First I logged Jaiminīya audio `not-found`;
        an archive.org community-tier search overturned that with ~2 GB of TAMIL/ANDHRA
        material. Then I concluded the KERALA NAMBUDIRI tradition was unrecorded and built
        the packet's recommendation on it — and that was wrong too. Verified since:
        the IGNCA portal holds 191 Jaiminīya MP4 files behind JavaScript; the British
        Library holds Nambudiri Jaiminīya WAX CYLINDERS RECORDED AT KOTTAYAM IN NOVEMBER
        1933 (Bake's own slip notes read "[Samaveda, Nambudiri (Jaiminiya)]"); and
        Staal and Levy recorded Jaiminīya in Kerala in 1957 and 1962, commercially issued
        by Folkways in 1969. Jaiminīya is in fact the BEST-recorded śākhā in this packet.
      text: >
        STRONG — much better than the śākhā's endangered status suggests, and the best
        text position of the four Sāmaveda/Yajurveda endangered nodes. SAṂHITĀ: the
        coordinator's lead resolved and free — "Jaiminīyasāmavedasaṃhitā: Text of Kerala
        Tradition (Ārcika, Sāma and Candrasāma Portions)", ed. K. A. Ravindran, National
        Mission for Manuscripts Prakāśikā series with Nag Publishers, 2013, 2 vols, and it
        prints the text in DEVANĀGARĪ AND MALAYALAM, preserving the Kerala script
        transmission rather than normalising it. Caland 1907 and Raghu Vira 1938 also exist.
        BRĀHMAṆA: Raghu Vira & Lokesh Chandra (1954) and Caland's 1919 Auswahl free on
        archive.org, five scans in all, plus the Ārṣeya Brāhmaṇa in Burnell's and
        B. R. Sharma's editions; TITUS holds a JB e-text (members-only).
        ĀRAṆYAKA: the Jaiminīya Upaniṣad Brāhmaṇa — where the Kena lives — is on TITUS
        OPENLY, and Oertel's 1896 editio princeps is free.
      audio: >
        THE BEST-RECORDED ŚĀKHĀ HERE, across four bodies: IGNCA's 191 MP4s (Richā + Gāna,
        JS-hidden, restrictive licence); the British Library's 1933 Bake wax cylinders of
        NAMBUDIRI Jaiminīya from Kottayam, several "almost inaudible… heavy mould",
        listenable in person only; Staal/Levy's Kerala 1957 and 1962 recordings issued by
        Folkways in 1969; and ~2 GB of Tamil/Andhra material on archive.org. Exactly one
        item carries a clean open licence (an IGNCA Media Centre video, CC BY-NC 4.0).
        UNPUBLISHED AND OBTAINABLE: Sree Sankaracharya University of Sanskrit, Kalady
        recorded Kerala Jaiminīya chanting 1995–2015, available on request.
      genuinely_lost: >
        Nothing in the Jaiminīya text tradition is lost. And the gāna is no longer
        undocumented — it is documented in fragile, restricted, mostly ninety-year-old
        form. What is at risk is the LIVING transmission: Gerety (2016) finds Nambudiri
        Sāmaveda reduced to a single active line of normative transmission, with most
        modern lineages a blend of survival and REVIVAL rather than continuous descent.
        Howard (1977, 1988) established that Nambudiri and Tamil Jaiminīya chant differ
        from each other and both from Kauthuma, so none substitutes for another.
      capture_urgency: >
        STILL THE HIGHEST — but the task has changed shape. It is no longer "capture an
        unrecorded tradition"; it is "secure and consolidate a tradition recorded in four
        incompatible, fragile, mostly inaccessible places, while a single active line of
        transmission still exists to record against."

    ranayaniya:
      text: >
        MUCH BETTER THAN IT FIRST APPEARED — and the correction is instructive. The four
        curated corpora (GRETIL, TITUS, sanskritdocuments, sanskritweb) hold ZERO
        Rāṇāyanīya between them, and IGNCA's Rāṇāyanīya pages give structure but no text.
        On that evidence I logged the node dark. It is not: five free CC0 editions sit in
        archive.org community uploads — the Dvārakā Sāmagānam, the Tirupati Veyagānam in
        two volumes, the Phullapotam, and a Kāśī Agniṣṭoma prayoga. Stevenson (1842) and
        Benfey (1848), the two earliest printed Sāmavedas, were Rāṇāyanīya as well.
        What is still genuinely missing is the ĀRCIKA — the saṃhitā layer itself.
      audio: >
        ~2.7 GB, FREE, TODAY. Three archive.org items: 42 tracks marked "Courtesy IGNCA,
        Government of India"; 16 long-form tracks foldered saṃhitā/āraṇyaka/ūha at
        80–140 minutes each; and a gāna specimen. Licence unresolved on all three —
        none carries a rights field. Link, do not mirror.
      genuinely_lost: >
        Nothing is lost. Not the śākhā, not the gāna, not the audio. What was missing was
        our ability to find it: the material is in the community tier, indexed under
        transliterated Sanskrit, invisible to a search of the curated corpora.
      capture_urgency: >
        LOW-MODERATE, and downgraded from my first assessment. The recording that would
        have justified an expedition largely exists. The remaining gaps are an ĀRCIKA text
        and an encoding decision for two incompatible gāna notations — desk work, not
        fieldwork.

    katha:
      text: >
        Good, and better than expected. An ACCENTED Devanāgarī Kāṭhaka Saṃhitā exists and is
        free: Śrīpāda Śarmā's Svādhyāya Maṇḍala edition (1943), scanned from the Gurukul
        Kāṅgṛī collection and marked CC-0 on the page. von Schroeder's Kāṭhakam (1900–10)
        is also accented and free. TITUS holds a KS e-text openly, plus Books 19–22 in both
        saṃhitā- and pada-pāṭha (members-only). Brāhmaṇa and Āraṇyaka survive only in part.
      audio: >
        NOTHING FOUND, and there is good reason to believe nothing exists. Published report:
        Kashmir today has not one saṃhitā-pāṭhī of the Kaṭha śākhā; what survives is the
        ritual and the ritual manuals, not the recitation.
      genuinely_lost: >
        GENUINELY LOST: most of the Kaṭha Brāhmaṇa (remnants only — Witzel's Kaṭha
        material at Harvard is 45 chapters, largely gṛhya). PARTLY LOST: the Āraṇyaka,
        surviving in a single Kashmiri birch-bark manuscript. NOT LOST, merely
        under-served: the Saṃhitā, which is complete and accented and free right now.
      capture_urgency: >
        The recitation is already gone. This is an ARCHIVAL problem, not a recording one —
        nothing to send a recordist to. The urgent object here is the ritual tradition,
        which is a different project.

    maitrayani:
      text: >
        The strongest of the six. Satavalekar's Maitrāyaṇī Saṃhitā (1941) is fully accented
        Devanāgarī, complete, free, and visually verified page-by-page — anudātta underline
        and svarita vertical both present, with cross-references to Taittirīya, Kāṭhaka,
        Vājasaneyi and Kāṇva printed in the footers. von Schroeder (1881–86) and Vedkumari
        Vidyalankar (1986) also free. TITUS holds an MS e-text openly. GRETIL holds one too
        but has DROPPED THE ACCENTS and says so.
      audio: >
        THE ONE LIVE FIND IN THIS PACKET. Krishna Yajurveda Maitrāyaṇī Śākhā groups recite
        in the Śrī Viśvamaṅgala Lakṣmī Narasiṃha Nitya Mahāyajña at Śrī Lakṣmī Narasiṃha
        Kṣetram, Belagola (Karnataka) — a daily yajña running 13 May 2022 to 1 May 2034,
        streamed to YouTube with individually titled Maitrāyaṇī sessions. This is not an
        archive recording. It is a live, ongoing, dated, locatable stream.
      genuinely_lost: >
        GENUINELY LOST: the Maitrāyaṇī Brāhmaṇa as a separate work — the Maitrāyaṇīya
        Upaniṣad is described in the tradition as the closing portion of a Brāhmaṇa of that
        śākhā which no longer survives. The Saṃhitā carries brāhmaṇa-type prose internally,
        Taittirīya-fashion, which is why the separate work was dispensable.
      capture_urgency: >
        MODERATE — and it is the only one of the six where the window is currently OPEN
        rather than closing. Something is being recited on a known day at a known place.
        Fieldwork here is scheduling, not searching.

    bashkala:
      text: >
        The node needs restating. The Bāṣkala SAṂHITĀ does not survive — but the Bāṣkala
        śākhā's other layers arguably do, through the Kauṣītaki / Śāṅkhāyana line, and are
        all free and complete: Kauṣītaki (Śāṅkhāyana) Brāhmaṇa in Lindner's and Sreekrishna
        Sarma's editions, Śāṅkhāyana Āraṇyaka in Keith's, and the Kauṣītaki Upaniṣad inside
        it. The Bāṣkalamantra Upaniṣad is openly on TITUS. The Khilāni — the 98 hymns
        recorded in Bāṣkala and not in Śākala — are edited (Scheftelowitz 1906) and on
        GRETIL. This is a lot of surviving Bāṣkala for a śākhā logged as "fragmentary".
      audio: >
        NOTHING FOUND, and the question is close to meaningless — there is no reciting
        Bāṣkala community to record. The recordable object would be the Khilāni within
        a Śākala reciter's repertoire, which is a different ask.
      genuinely_lost: >
        GENUINELY LOST: the Bāṣkala Saṃhitā. No complete text; the Khilāni are its
        surviving trace and reach us via one Kashmiri manuscript. NOT LOST: brāhmaṇa,
        āraṇyaka, upaniṣad — IF the Kauṣītaki attribution holds, which is exactly the
        thing to be careful about (see the record's `notes`).
      capture_urgency: >
        NONE, for recording. The gap here is scholarly-attributional, not oral. Nobody
        should be sent anywhere; somebody should settle whether Kauṣītaki is Bāṣkala's
        brāhmaṇa or a sibling śākhā's.

    kapishthala:
      text: >
        Exists, is free, and is INCOMPLETE BY NATURE. Raghu Vira's 1932 edition
        (multiple free scans) rests on a single imperfect manuscript: aṣṭaka 1 complete,
        2 damaged, chapters 9–24 lost, 32 lost, 33 lost, 43 lost. TITUS holds a KapS e-text
        openly (Fushimi), and Fushimi's mantra index is free at EJVS. The text is
        UNACCENTED — verified visually, not inferred.
      audio: >
        NOTHING FOUND. No reciting community is recorded anywhere for this śākhā.
      genuinely_lost: >
        GENUINELY LOST: roughly a quarter of the Saṃhitā, chapter by chapter, listed above.
        This is real textual loss, not a digitisation gap, and no edition will fix it.
        The brāhmaṇa layer is attested by name only.
      capture_urgency: >
        NONE. Nothing to record. What this node needs is the manuscript question, which
        belongs to P2-c.

  cross_packet_notes:
    - "P2-c (manuscript catalogues): three leads, logged not chased —
       (1) the single Kashmiri Śāradā manuscript behind the Kāṭhaka Saṃhitā;
       (2) the Tübingen birch-bark Kaṭha Āraṇyaka manuscript, ~500 years old, sole witness;
       (3) the single imperfect Kapiṣṭhala manuscript, whose lacunae ARE the text's limits.
       Each is a one-manuscript text. That is a preservation fact, not a cataloguing detail."
    - "P2-b (apparatus): Kāṭhaka-Gṛhyasūtra (Laugākṣi) and Jaimini-Gṛhyasūtra are both
       openly on TITUS; Khila-Anukramaṇī is inside Scheftelowitz 1906. Not logged here."
    - "P2-b, HIGH VALUE AND EASY TO MISS: Asko Parpola's 2023 critical editions of the
       Jaiminīya apparatus WITH the Kerala commentaries of Bhavatrāta and Jayanta (c. 700
       CE) — Śrautasūtra, Gṛhyasūtra, Jaimini-Kalpa 1–5, Paryadhyāya — are ALL OPEN ACCESS
       in the Electronic Journal of Vedic Studies vol. 27, e.g.
       hasp.ub.uni-heidelberg.de/journals/ejvs/article/view/21907. Open-licensed critical
       editions of an endangered śākhā's apparatus, published recently, by the field's
       leading authority on it. Also Caland's Jaimini-Gṛhyasūtra (Lahore 1922) and
       Premnidhi Shastri's Jaiminīya Śrautasūtra Vṛtti of Bhavatrāta (IAIC 1966), both
       free on archive.org."
    - "P2-b / P2-c: the Jaiminīya ŪHA- and ŪHYA-GĀNA have NO edition in any script
       anywhere. Parpola published only INDEXES to both (EJVS 27.6). They are
       manuscript-only — e.g. Cambridge MS Or. 2365, which also carries the JAIMINĪYA
       DHĀRAṆALAKṢAṆA, the śākhā's own notation treatise, unedited. Given that the
       Jaiminīya gāna is printed without notation, an unedited notation treatise for that
       śākhā is a disproportionately important object. CUDL 403s to scripts; a human
       needs to open it."
    - "P1-a (accented-Devanāgarī publishers): the Svādhyāya Maṇḍala sweep is theirs, but
       two of its editions are the single best sources for two of MY śākhās — flagging so
       the Kāṭhaka 1943 and Maitrāyaṇī 1941 volumes are not treated as already-covered."
    - "P0-a: TITUS holdings for Maitrāyaṇī, Kāṭhaka and Kapiṣṭhala catalogued below at
       index level only. No bulk fetch. Access pending the permission decision."

  highest_priority_recording_target: >
    JAIMINĪYA SĀMAVEDA GĀNA OF THE KERALA NAMBUDIRI TRADITION — still the answer, but
    NOT AS A FIRST-CAPTURE EXPEDITION. Do the acquisitions first; they are cheaper, faster,
    and two of them are decaying.

    THE ORDER MATTERS, so stating it as a sequence rather than a target:
    (1) ASK KALADY. Sree Sankaracharya University of Sanskrit recorded Kerala Jaiminīya
        chanting 1995–2015 and the recordings are available on request and unpublished.
        This is an email. It is plausibly the largest single body of modern Nambudiri
        Jaiminīya audio in existence and nobody has to travel.
    (2) DIGITISE OR OBTAIN THE BAKE CYLINDERS. British Library C52, Kottayam, November
        1933, Nambudiri Jaiminīya Āraṇyakagāna and Grāmageyagāna. Several are catalogued
        "almost inaudible… heavy mould on cylinder". These are ninety-three years old and
        degrading; they are also the earliest known recording of this tradition and
        predate every published analysis of it. If nothing else in this packet is acted
        on, this should be.
    (3) EMAIL INDIANA. Whether Wayne Howard's field tapes were deposited at the Archives
        of Traditional Music is unresolved — their catalogue blocks automated clients.
        Howard's 1988 chant analyses are the most detailed published account of Nambudiri
        Jaiminīya; the tapes behind them, if they exist publicly, are the matching audio.
    (4) ONLY THEN RECORD. And record against a known baseline rather than blind.

    Why Jaiminīya and not one of the other five — the elimination is now clean, and three
    of the five fell away during the packet rather than before it.
    THREE ARE NOT RECORDABLE AT ALL. Kaṭha's saṃhitā recitation is extinct in Kashmir by
    published report and IGNCA lists zero Kaṭha institutions nationally; Bāṣkala and
    Kapiṣṭhala have no reciting community at all. For those three the loss has already
    happened and the remaining work is archival and manuscript work, not fieldwork.
    ONE IS ALREADY RECORDED. Rāṇāyanīya — which I first logged as silent — has ~2.7 GB
    freely downloadable, including a set marked courtesy of IGNCA.
    ONE IS OPEN RATHER THAN CLOSING. Maitrāyaṇī is recited at a known kṣetram on a daily
    yajña scheduled to 2034 and streamed. Scheduling problem, not a race.

    THAT LEAVES JAIMINĪYA, and what makes it urgent is no longer absence of recording but
    FRAGILITY AND DISPERSAL of what exists, against a living tradition that Gerety finds
    reduced to a single active line of normative transmission. The recordings are in four
    places under four incompatible rights regimes: IGNCA's 191 files behind a written-
    permission policy, the BL's mouldy cylinders behind an appointment desk, Folkways in
    copyright, and archive.org community uploads with no stated rights at all. Exactly one
    Jaiminīya item anywhere carries a clean open licence. A tradition can be well recorded
    and still effectively unavailable, and that is the actual situation here.

    And the asymmetry that produced this packet still holds. The Jaiminīya TEXT is SAFE —
    Ravindran's Kerala edition, Raghu Vira, Lokesh Chandra, Caland, Oertel, Burnell,
    B. R. Sharma, Parpola's open-access 2023 commentaries. Editing it again adds nothing.
    The gāna is the fragile object, and — the finding that surprised me most — it CANNOT
    be reconstructed from the printed page, because the Jaiminīya gāna is printed with no
    numeric notation at all. Kauthuma writes digits above syllables; the written Kerala
    Jaiminīya tradition never did. The melody lives in vowel prolongations, stobhas, and
    oral transmission. For this śākhā, more than any other in the corpus, the recording
    IS the text.

    Why this and not one of the other five — and the elimination is now clean, because
    two of the five fell away during the packet rather than before it.
    THREE ARE NOT RECORDABLE AT ALL. Kaṭha's saṃhitā recitation is extinct in Kashmir by
    published report and IGNCA lists zero Kaṭha institutions nationally; Bāṣkala and
    Kapiṣṭhala have no reciting community at all. For those three the loss has already
    happened and the remaining work is archival and manuscript work, not fieldwork.
    Sending a recordist would be sending them nowhere.
    ONE HAS ALREADY BEEN RECORDED. Rāṇāyanīya — which I initially logged as silent and
    which I would have ranked second — turns out to have ~2.7 GB of freely downloadable
    recitation, including a 16-track set foldered saṃhitā/āraṇyaka/ūha and a 42-track set
    marked courtesy of IGNCA. Its remaining gaps are an ārcika text and an encoding
    decision, both desk work.
    ONE IS OPEN RATHER THAN CLOSING. Maitrāyaṇī is recited at a known kṣetram on a daily
    yajña scheduled to 2034 and streamed. That is a scheduling problem, not a race.

    THAT LEAVES ONE. Nambudiri Jaiminīya is the only node in the packet where the thing at
    risk is BOTH irreplaceable AND actively disappearing AND still capturable.
    Irreplaceable, because Sāmavedic meaning lives in the melody, Jaiminīya melody is not
    Kauthuma melody, and — the point that survived every correction in this packet —
    Howard's fieldwork established that the NAMBUDIRI and TAMIL Jaiminīya traditions differ
    markedly from each other. The ~2 GB now available is entirely Tamil: choḷīya style and
    the Paravastu TN-AP lineage. It does not cover the śākhā, and treating it as though it
    does would be the single most expensive mistake available here — it would look like
    coverage while the uncovered half went silent.
    Actively disappearing, because IGNCA's own Schools of Vedic Learning list — the Indian
    state's best inventory of who still teaches what — names Jaiminīya at ONE institution
    nationally against twenty-plus for Kauthuma, and the Kerala entry is a single
    pāṭhaśālā at Kodunthirapully, Palakkad.
    Still capturable, unlike Kaṭha, Bāṣkala and Kapiṣṭhala, where there is nobody left.

    And the asymmetry that produced this packet holds hardest here. The Jaiminīya TEXT is
    SAFE — Raghu Vira, Lokesh Chandra, Caland, Oertel, TITUS, five free scans of the
    Brāhmaṇa alone. Editing it again adds nothing that is not already in a library. The
    Nambudiri gāna is safe nowhere. A recordist sent to Palakkad captures something no
    amount of later funding can reconstruct; a philologist sent to the Jaiminīya Brāhmaṇa
    captures something that will still be there in fifty years.

    ONE CAVEAT, STATED BECAUSE THIS PACKET WAS WRONG TWICE ALREADY IN EXACTLY THIS WAY:
    "no Nambudiri recording exists" is a claim about what is ONLINE. Staal's 1975 Panjal
    Atirātra recordings, Howard's fieldwork tapes, and the British Library, Smithsonian
    Folkways and Finnish Oriental Society collections were never queried — the search
    budget ran out first. Those are precisely the archives likely to hold 1960s–70s
    Nambudiri material. CHECK THEM BEFORE FUNDING A TRIP. If a Staal or Howard tape exists
    and is obtainable, acquisition is cheaper than fieldwork and fifty years older —
    and the trip should then be scoped as re-recording a documented tradition against a
    known baseline rather than as first capture.

