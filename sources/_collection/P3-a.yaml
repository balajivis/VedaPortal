      STRUCTURE of the passage, for anyone working it:
        (A) śruti > liṅga        — example: 'aindryā gārhapatyam upatiṣṭhate'
        (B) liṅga > vākya        — example: 'syonaṃ te sadanaṃ kṛṇomi'
        (C) vākya > prakaraṇa    — example: the sūktavāka nigada
        (D) prakaraṇa > krama    — example: the Śunaḥśepa narrative in the Rājasūya
        (E) krama > samākhyā     — example: 'pauroḍāśika' and 'śundhadhvam daivyāya karmaṇe'
        (F) the general theory of bādha (sublation) — DISPUTED, see summary.
      Each of (A)–(E) has the same shape: a pūrvapakṣa asserting `tulyabale ete kāraṇe`
      ("these two causes are of equal strength") and a siddhānta defeating it by
      arthaviprakarṣa. The repetition is the method; do not skim it.
      LICENSE: GRETIL asserts CC-BY-NC-SA 4.0. Recorded verbatim; rule 9 applies to the
      2nd–5th century bhāṣya text.
    date_logged: 2026-08-01

