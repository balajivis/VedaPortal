      A REAL AND CONSEQUENTIAL GAP, and the largest linguistic one in this packet. The
      project explicitly wants both sides of the Bhāṭṭa/Prābhākara disagreement, and one
      side's foundational text is Sanskrit-only.
      WHAT EXISTS INSTEAD, in descending order of usefulness:
        1. Ganganatha Jha, *The Prābhākara School of Pūrva Mīmāṃsā*, 1911 — a full English
           exposition of the school by the man who translated everything else. PUBLIC
           DOMAIN. https://archive.org/details/dli.csl.4672 . This is the practical route.
        2. Śālikanātha's Prakaraṇapañcikā — the school's own systematic manual, easier than
           the Bṛhatī, partly machine-readable on GRETIL (prakaraṇa 1 only).
        3. Elisa Freschi, *Duty, Language and Exegesis in Prābhākara Mīmāṃsā*, Brill 2012
           (DOI 10.1163/9789004230248) — modern, in copyright, link only.
      Note the asymmetry this creates and guard against it: the Bhāṭṭa side is fully
      available in English and the Prābhākara side is not. A project that reads only what
      is translated will silently become a Bhāṭṭa project. Given that the whole point of
      holding both is that their disagreement is data, this is a methodological hazard,
      not just an inconvenience.
