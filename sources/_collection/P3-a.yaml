# HANDOFF
# ===========================================================================

handoff:
  do_first: >
    Read Jha, Śābara-Bhāṣya Vol. I (GOS 66), pp. 449–464, with the GRETIL Sanskrit of
    MS 3.3.14 open alongside. Sixteen pages. That is the entire six-fold ordering, in the
    original and in English, argued pair by pair with its own objections. The project's
    note that this is "bounded and tractable" is now measured rather than hoped: this is
    the bound.

  do_second: >
    Read MS 1.2.1–18 with Jha GOS 66 pp. 51–64. Fourteen pages. That is vidhi/arthavāda,
    with the pūrvapakṣa that makes the distinction necessary and the ekavākyatā argument
    that makes it operational.

  do_not: >
    Do not start with the Ślokavārttika, however well digitised it is. It is behind the
    project's own firewall — it argues that the Veda is authorless, eternal and
    intrinsically valid, which the project explicitly does not adopt. Its excellent digital
    coverage is a trap for anyone browsing by availability rather than by need.

  open_questions_for_bv:
    - "DCS licence is undeclared (GitHub reports null). Hellwig's morphological annotation is original work and rule 9 does not cover it. Resolve before ingesting — ask him directly."
    - "Bṛhatī adhyāyas 6–7 were not located. Unlocated volume, or genuine textual lacuna? Check the Madras University Sanskrit Series list before recording either."
    - "Kunjunni Raja (1963) and D'Sa (1980) named in the brief but NOT verified here — search budget exhausted. Confirm by hand."
    - "Three GRETIL files 404. Email gretil@sub.uni-goettingen.de; the Kataoka Tantravārttika is worth chasing."
    - "Muktabodha's Turnstile gate is server-side across all paths, and their own advertised open-data GitHub repos (muktabodha-v2/muktalib-v2-data, -app) currently 404 mid-migration. Re-check in a few months, or email info@muktabodha.org. Low expected yield either way."
    - "SARIT's web app is down (502/400) but its GitHub corpus is live and was harvested. If the app comes back it adds nothing this packet does not already have from GitHub."
    - "SARIT's Tantravārttika stops at MS 2.4. Whether SARIT intends to extend it to adhyāya 3 (and therefore to 3.3.14) is unknown — worth asking Andrew Ollett, who encoded it."

  a_note_on_the_firewall: >
    Worth stating plainly for whoever picks this up. The method survives detachment from
    the metaphysics better than one might fear, and the reason is internal to the texts:
    Śabara never justifies the ordering by appeal to the Veda's authorlessness or
    eternality. He justifies it by arthaviprakarṣa — remoteness from the meaning — which
    is a claim about how EVIDENCE relates to CONCLUSIONS, not about the ontological status
    of the evidence. śruti beats liṅga because hearing a word is closer to its meaning than
    inferring from its denotative capacity. That argument runs on any corpus, sacred or
    not. The firewall the project drew is not a compromise imposed on the material; it
    falls along a seam the material already has.
