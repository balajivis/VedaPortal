  # THE ACCENTED-PROSE HOLE — a not-found that is the point
  # =========================================================================

  - node_path: sources/vedas/rigveda/shakala/brahmana
    text: aitareya-brahmana
    veda: rigveda
    organization: null
    shakha: shakala
    layer: brahmana
    edition: "— any ACCENTED edition of any Ṛgvedic Brāhmaṇa or Āraṇyaka prose —"
    url: null
    script: null
    svara_source?: "no — this record exists to say so"
    text_layer: null
    license: unknown
    status: not-found
    where_i_looked: >
      TITUS Aitareya Brāhmaṇa (Aufrecht 1879) — 0 marks in 702,836 chars;
      TITUS Aitareya Āraṇyaka (Keith 1909, Doyama) — marks present but ONLY in books
      4–5, i.e. only on mantra, 0 in the prose of books 1–3;
      Sanskrit Wikisource AB — 1 stray mark in 409,828 chars;
      Sanskrit Wikisource AiĀ — 0;
      GRETIL Kauṣītaki Brāhmaṇa — 0; GRETIL Śāṅkhāyana Āraṇyaka — 0;
      sanskritweb.net (Sarma/Stiehl) — full site index walked: it publishes accented
      Devanāgarī for the Ṛgveda Saṃhitā and for the Taittirīya Brāhmaṇa / Āraṇyaka /
      Saṃhitā, and holds NOTHING for any Ṛgvedic Brāhmaṇa or Āraṇyaka;
      sanskritdocuments.org/doc_veda — index walked; its accented Brāhmaṇa material is
      Taittirīya (taittirIyabrAhmaNam, and an explicitly niḥsvara variant) and Kauthuma;
      no Aitareya, no Kauṣītaki.
    notes: >
      **This is the P5 hole this packet exists to find, and the scholarship says it is
      not a digitisation gap — it is an extinction.**
      Keith, HOS 25 §43 p. 96, on the Aitareya Brāhmaṇa: "The text as preserved is
      unaccented. It is no doubt the case that it originally was duly accented, but the
      accents have not been preserved by the tradition." His index entry reads "Accents,
      absence of in Brāhmaṇas of the Ṛgveda, 96" — covering the Kauṣītaki too.
      Macdonell, *Vedic Grammar for Students* p. 448, lists the accented Brāhmaṇas
      exhaustively: the Taittirīya and the Śatapatha, and no others.
      The one printed exception is narrow and unreliable: Keith, *AiĀ* 1909 p. 10 —
      Rājendralāla Mitra's edition and MSS A and E accent the non-Ṛgvedic verses quoted
      in full in Āraṇyaka V, and those accents "are often obviously incorrect."
      Two rules follow. (1) Encode these four texts as unaccented; there is nothing to
      recover from print or from the web. (2) Do NOT generalise "Brāhmaṇa prose is
      unaccented" — the Śatapatha and Taittirīya Brāhmaṇa falsify it, and sanskritweb.net
      publishes a fully accented Taittirīya Brāhmaṇa in Devanāgarī today. The absence is
      specific to the Ṛgvedic schools, and Keith's Pañcaviṃśa parallel (accented at the
      Bhāṣikasūtra, gone by Kumārila) shows it is a datable loss.
      Hand P2-c one specific manuscript query: does any Aitareya or Kauṣītaki MS anywhere
      carry svara? Keith's answer for the MSS he saw is no.
    date_logged: 2026-08-01


