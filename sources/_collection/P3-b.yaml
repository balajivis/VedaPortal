    url: https://archive.org/details/kaushitakibrahma00linduoft
    script: devanagari-legacy-font
    svara_source?: "no — Keith p. 103, of both KB editions: 'Neither is punctuated.'"
    text_layer: mixed
    license: public-domain
    status: found-complete
    where_i_looked: n/a
    notes: >
      **The critical text of the KB in the vulgate recension — all 30 adhyāyas,
      276 khaṇḍas.** Carries the MS colophon that fixes the vulgate count, from Bodleian
      Sansc. 6: 'asmin brāhmaṇe sarvasaṅkhyā || adhyāya 30, khaṇḍikā 276,
      granthasaṅkhyā 2829'.
      **Volume II was never published.** The title page reads "HERAUSGEGEBEN UND
      UEBERSETZT von B. LINDNER … TEXT", and the Vorwort promises "der zweite Theil, der
      die Uebersetzung und Anmerkungen enthält, wird in kurzer Zeit nachfolgen." Keith,
      33 years later: "the second volume of the edition, which was to have contained a
      translation and notes, has never appeared." Rai's 1987 survey lists no second part.
      **The 'übersetzt' on the title page is a promise, not a description** — catalogue
      records that describe this book as a translation are wrong. Keith HOS 25 is what
      filled the gap, 33 years on.
      **Use the two scans together; they are complementary.** `kaushitakibrahma00linduoft`
      (184 leaves) has usable Devanāgarī OCR but German front matter as gibberish;
      `india.history.resource.89733` (178 leaves) has Latin-script OCR, so the Vorwort,
      Einleitung, MS list, the 276-khaṇḍikā colophon and the KB↔AB concordance are
      readable there and only there.
      Does NOT include Vināyaka's commentary — Keith p. 103: "the important work could
      not be edited from the available MSS."
      Lindner found both names used inside the same manuscript: in Bodleian O, one
      scribe's colophons read *Kauṣītakibr.* at the end of adhyāya 15 and
      *Śāṅkhāyanabr.* at the end of adhyāya 30.
