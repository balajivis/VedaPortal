    ALSO — W. Caland, "Die Jaiminīya-Saṃhitā mit einer Einleitung über die
    Sāmavedaliteratur", Breslau 1907 (Indische Forschungen 2); Raghu Vira,
    "Jaiminīya-saṃhitā Sāmavedīya", 1938. Both attested; neither opened here.
  url: https://archive.org/details/jaiminiya-samaveda-samhita
  script: devanagari-unicode
  svara_source?: >
    NO — AND THIS IS A RECENSION FACT, NOT A PRINTING SHORTCUT. THE MOST CONSEQUENTIAL
    NOTATIONAL FINDING IN THE PACKET.
    Ārcika portion: verified visually by me (page 40 of the scan, sections 32–33 rendered
    to image and read). Verse text printed plain — no accent marks, no superscript
    numerals, mantra numbers in the right margin only.
    Sāma and Candrasāma portions — i.e. THE GĀNA, the song-books, the Jaiminīya analogues
    of Grāmageya- and Āraṇyageyagāna: also printed with NO NUMERIC NOTATION AT ALL. Page
    528 is headed षोडशं गानम् with the gāna text written out in full, stobhas (हाबु,
    हौहोवा, ओयिळा…) and `×` parvan separators — and no svara-aṅka digits over syllables,
    no accent marks. Independently confirmed for the Paravastu Telugu-script books.
    WHY THIS MATTERS MORE THAN IT LOOKS: Kauthuma writes digits 1/2/3 above syllables and
    the written Kerala Jaiminīya tradition never did. The melody is carried entirely by
    WRITTEN-OUT VOWEL PROLONGATIONS PLUS STOBHA SYLLABLES, with the rest in oral
    transmission. So protocol §3's guidance for Sāmaveda — "digits high ⇒ numeric Sāma
    notation; zero accents does not mean unaccented, count digits" — gives the WRONG
    answer here: a Jaiminīya gāna file legitimately has zero accents AND zero notation
    digits. You cannot parse Jaiminīya melody from digits, because there are none.
    Contrast Rāṇāyanīya, which has two different notation systems, and Kauthuma, which has
    digits. Three Sāmaveda śākhās, three incompatible answers to "how is the melody
    written". §3 currently models one.
    Protocol §3 counts are useless on this particular file for a second reason — it is a
    clean scan with NO text layer at all (chars=567 over the sampled range, all Latin page
    furniture). Visual inspection is the only evidence available.
