# =============================================================================
# PACKET F2 (ACQUISITION) — the English translation layer
# Appended below F1's records. F1 owns Sayana + Wilson; nothing here overlaps it.
# =============================================================================

summary_F2:
  packet: F2-acquisition-english-translations
  date: 2026-08-01
  budget_bytes: 6000000000
  total_bytes_fetched: 649901650          # 10.8% of a 6 GB budget
  files: 64
  scans_and_pdfs_bytes: 632796202                 # 55 PDF/OCR-text files from Archive.org + sanskritweb
  clean_text_bytes: 17105448                  # 9 proofread electronic-text corpora (677 files)

  purpose: >
    The 19th- and early-20th-century English translations of the corpus outside the
    Rgveda. Their position in this project is specific and worth restating, because it
    determines how they should be used: they are philologically sound and unreadable —
    Victorian idiom, and in Griffith's case indelicate passages pushed out of English
    into a Latin appendix. They are NOT the goal. They are (a) the baseline the project
    intends to beat, which cannot be demonstrated without holding it, and (b) the
    human-divergence set against which machine-translation disagreement gets calibrated.
    Griffith vs Whitney vs Bloomfield on the same Saunaka hymn is the calibration; all
    three public-domain legs are now here.

  what_landed_by_priority:
    p1_eggeling_satapatha: >
      COMPLETE, AND TWICE OVER. All five SBE volumes (12/26/41/43/44, 2695 pages, 76 MB)
      as text-layer PDFs, AND the whole translation a second time as 420 pages of
      human-proofread HTML. The HTML is the deliverable; see clean_text_verdict. This
      was the packet's highest priority because the Satapatha is the largest unsourced
      text in the corpus and Eggeling is the only complete English rendering, unrevised
      in 120+ years.
    p2_griffith: >
      COMPLETE — Atharvaveda vols I-II, Samaveda, White Yajurveda. NOT his Rgveda (F1/repo
      owns it). The Atharvaveda is held in BOTH the 1895-96 first edition named in the
      brief and the 1916-17 second edition; the 2nd ed OCR is visibly cleaner. Clean text
      also held for all four.
    p3_keith: >
      COMPLETE, PLUS a better source than was asked for. Taittiriya Sanhita HOS 18-19 and
      Rigveda Brahmanas HOS 25 as scans; the cheap pick-ups (Aitareya Aranyaka 1909,
      Sankhayana Aranyaka 1908) taken as instructed. Beyond the brief: the complete TS
      translation as proofread HTML from sacred-texts, and as a DIGITALLY TYPESET PDF from
      sanskritweb carrying inline [[Book-Chapter-Paragraph]] reference markers.
    p4_whitney: >
      COMPLETE — HOS 7 and 8 as scans, AND page-for-page complete as Wikisource proofread
      text (648 + 606 pages, matching the PDFs exactly). The Wikisource text is the single
      best file in this packet; see clean_text_verdict.
    p5_bloomfield: "COMPLETE — SBE 42 scan + proofread HTML. NOTE: SBE 42 is a thematic SELECTION, not a complete Atharvaveda. Recorded on every record so it cannot be mistaken for one."
    p6_oldenberg: "COMPLETE — SBE 29 and 30, scans + proofread plain text. Apparatus tier (protocol packet P2-b), for which sources/vedas/ previously held nothing."
    p7_macdonell: "COMPLETE — Brhad-devata HOS 5 (Sanskrit text) and HOS 6 (translation), plus the 1886 Sarvanukramani re-measured as instructed. No clean text exists for any of the three."

  budget_cut_off: >
    Nothing was cut for bytes. Every priority level 1-7 was reached and completed at
    roughly 11% of the 6 GB budget. The binding constraint was never disk — it was
    REQUEST TIME against web.archive.org, which serves ~6.5 s per page and which every
    sacred-texts retrieval must go through (see the Cloudflare finding). One item was cut
    for that reason and one only: the per-hymn HTML tree of Griffith's Atharvaveda
    (967 pages, ~100 minutes), which was abandoned mid-mirror when the site's own bulk
    export turned out to carry the same text in one request. The partial 102-page mirror
    was DELETED rather than recorded, so no half-corpus is logged as whole.
    Deliberately not fetched, per brief: _jp2.zip derivatives.

  # ---------------------------------------------------------------------------
  # THE DELIVERABLE QUESTION: is this layer usable for automated comparison,
  # or does it need OCR first?
  # ---------------------------------------------------------------------------
  clean_text_verdict:
    headline: >
      USABLE NOW, WITHOUT OCR, FOR EVERYTHING EXCEPT MACDONELL. Nine of the twelve works
      in this packet exist as human-proofread electronic text, and for the three that do
      not, the page scans carry real (if degraded) OCR. No re-OCR is required to start.
      The one thing that WOULD have required it — Eggeling's Satapatha, the largest hole
      in the corpus — is the best-covered item here.

    why_it_matters_measured: >
      This is not a preference; it was measured on identical text. Eggeling SBE 12:
      the Archive.org OCR carries ZERO diacritically-marked Latin characters across the
      whole volume and 188 structurally impossible tokens. The proofread HTML of the same
      translation carries 32167 diacritics across all five volumes and 29 such tokens.
      Eggeling's transliteration IS the semantic content for every Sanskrit term he leaves
      untranslated — 'Agni-kayana', 'Agni-k ayana' and 'Ag<i-*aya<a' are the same word
      only while the diacritics survive, and under OCR they do not survive at all. Any
      term-level comparison run against the OCR would be comparing damage.

    ranked_by_usability:
      1_wikisource_whitney: >
        BEST IN PACKET. Whitney-Lanman HOS 7-8, page-for-page complete (648 + 606 pages,
        matching the PDFs exactly), 90.0%/96.5% proofread + 6.9%/0.5% validated, zero
        empty transclusions. The ONLY source here preserving full IAST *and* the Vedic
        accent: 90413 diacritics (31-34 per 1000 Latin chars, ~3x the sacred-texts HTML)
        including 13900 acute-marked vowels carrying Whitney's udatta. Also carries his
        critical apparatus inline — Paippalada variants, manuscript sigla, Anukramani
        metrics — so it doubles as an apparatus source for the Saunaka/Paippalada question.
        Cost: raw MediaWiki wikitext; templates and <section> markers must be parsed.
      2_sanskritweb_keith: >
        Complete Taittiriya Sanhita translation, digitally typeset (not scanned), 341 pp,
        with inline [[Book-Chapter-Paragraph]] markers — TS passages resolve to canonical
        references without parsing prose. Uses the older c-cedilla convention rather than
        IAST; systematic and reversible, but must be normalised before string-matching.
      3_sacred_texts_html: >
        Eggeling Satapatha (420 pp), Keith TS (8 pp), Griffith White Yajurveda (47 pp).
        Proofread, diacritics preserved as numeric entities, hymn/book-addressable by
        filename. The workhorse tier.
      4_sacred_texts_plain_text: >
        Griffith Atharvaveda, Oldenberg SBE 29/30. Same proofread transcription, but the
        .txt exports are ASCII-FOLDED (diacritic_latin=0) — 'Vachaspati' loses its macron.
        In exchange the Atharvaveda text gains inline VERSE references ([0100102] = book 1,
        hymn 1, verse 2), making it verse-addressable where the HTML is only hymn-addressable.
        Use for alignment; re-fetch the HTML if a task turns on Sanskrit term identity.
      5_sacred_texts_griffith_samaveda: >
        Clean and complete, but transcribed in flat ASCII by choice — zero numeric entities
        in the source HTML. For this ONE text the clean version's advantage over OCR is word
        accuracy only, not transliteration fidelity, because neither has diacritics.
      6_scans_only_no_clean_text_exists: >
        Macdonell Brhad-devata HOS 5-6, Macdonell's 1886 Sarvanukramani, and Keith's
        Rigveda Brahmanas HOS 25 / Aitareya Aranyaka / Sankhayana Aranyaka. Probed and
        absent from sacred-texts, Wikisource and sanskritweb. These are the only members
        of this layer that would need OCR work, and all carry real text layers already.

    coverage_hole_worth_naming: >
      Whitney stops at Book XIX; Griffith's Vol. II runs to Book XX plus the Kuntapa
      section. Atharvaveda Book XX and the Kuntapa hymns therefore have exactly ONE
      public-domain English witness, not two — the divergence set is structurally thinner
      there, and a harness that assumes uniform 2-way coverage will silently mis-weight it.

  # ---------------------------------------------------------------------------
  # RULE 11 IN ACTION — three recoveries, one avoided false negative
  # ---------------------------------------------------------------------------
  recovered_via_probing:
    - >
      CLOUDFLARE, NOT ABSENCE. sacred-texts.com returns HTTP 403 with a Cloudflare
      'Just a moment...' interstitial to every non-browser client, including with a
      spoofed browser User-Agent. A collector testing the site directly would record the
      entire Internet Sacred Text Archive as dark. It is not: every page in it is served
      by the Wayback Machine at web.archive.org/web/<timestamp>id_/<url>, and the CDX API
      (web.archive.org/cdx/search/cdx) enumerates the whole tree in one request. All 420
      Eggeling pages, all Keith, Griffith and Bloomfield HTML in this packet came that way.
    - >
      BULK PATHS THE SITE DOES NOT LINK. sacred-texts publishes per-text bulk archives at
      /hin/<dir>/<dir>.txt.gz or /hin/<dir>/<dir>txt.zip. They appear in no index page.
      Confirmed PRESENT for av, sbe29, sbe30 — each replacing 200-970 individual requests
      with one. Confirmed ABSENT for sbr, sbe42, wyv, yv (probed individually, not assumed).
      Found only because a CDX listing for an unrelated directory happened to include a
      .txt.gz. Probe for the bulk file BEFORE mirroring page-by-page.
    - >
      A NEAR-MISS ON THE SAKHA THIS PROJECT CARES MOST ABOUT. Keith's complete Taittiriya
      Samhita translation IS on sacred-texts — at /hin/yv/, an abbreviation matching no
      author, series or title in the search space. Queries for 'keith', 'hos', 'tsanhita',
      'tsan' all return zero, and the site's own Hinduism index does not surface it.
      It was found only by following a credit line ('text scanned by J. B. Hare') printed
      inside an unrelated sanskritweb PDF back to its source. Recording 'Keith is scan-only'
      would have been a false negative on sources/vedas/yajurveda/krishna/taittiriya —
      the protocol's named priority hole. This is rule 11's zero-result clause exactly:
      the query was wrong, not the collection.
    - >
      sanskritweb.net is named in COLLECTION-PROTOCOL section 4 as a source for accented
      DEVANAGARI. It also carries English TRANSLATIONS — keith.pdf, the typeset TS — which
      the seed table does not mention. Worth widening that row.

  # ---------------------------------------------------------------------------
  # TRAPS FOUND AND MEASURED
  # ---------------------------------------------------------------------------
  traps_found:
    google_scan_boilerplate_trap: >
      NEW, AND IT NEARLY PASSED. Three Google-digitised Archive.org PDFs
      (textswhiteyajur00grifgoog, vedablackyajuss01keitgoog, vedablackyajuss02keitgoog)
      return chars=2991 under the protocol's standard 'pdftotext -l 40' test — a
      non-trivial number that reads as a pass. All 2991 characters are the Google
      public-domain BOILERPLATE PAGE. Re-measured at pages 100-140 the same files return
      41 characters. They are image-only PDFs; their OCR exists only in the separate
      _djvu.txt. All three were replaced with text-layer PDFs from other items and the
      originals kept so the comparison stays reproducible.
      PROPOSED PROTOCOL AMENDMENT (section 3): the 40-page test is insufficient for
      Google-sourced scans. Measure a DEEP page range as well; a front-matter-only reading
      is a fail, not a pass.
    front_matter_misread_trap: >
      THE MIRROR IMAGE OF THE ABOVE, and it would have caused a false REJECTION. Keith's
      Aitareya Aranyaka (in.ernet.dli.2015.405755) returns garbage under 'pdftotext -l 40'
      — Latin front matter run through a Devanagari OCR model, producing nonsense
      Devanagari. Measured at pages 100-140 the same file gives chars=48873 devanagari=36843,
      clean. It is a mixed-script volume and the 40-page window lands entirely in the wrong
      script. Same amendment applies in both directions: measure deep, not just early.
    dli_empty_text_layer_trap: >
      Checked on every in.ernet.dli.* item taken. None was the ~139-byte case; all carried
      real _djvu.txt (0.6-1.65 MB). Recorded as CHECKED, not as absent.

  negatives_recorded:
    - "Macdonell's Brhad-devata (HOS 5-6) and Sarvanukramani (1886): NO clean electronic text. Probed sacred-texts (/hin/bd, /hin/* index), Wikisource (search 'Brihad Devata Macdonell' — hits are unrelated), sanskritweb. Scans only. Confidence: high, probed not inferred."
    - "Keith's Rigveda Brahmanas (HOS 25), Aitareya Aranyaka, Sankhayana Aranyaka: no clean electronic text found; scans with real OCR only. Confidence: medium-high — sacred-texts and Wikisource probed, but the /hin/yv/ near-miss above shows this site's paths are not guessable from titles, so treat as a lower-confidence negative."
    - "sacred-texts bulk archives ABSENT (probed individually) for: /hin/sbr (Eggeling), /hin/sbe42 (Bloomfield), /hin/wyv (Griffith WYV), /hin/yv (Keith). Those four were mirrored page-by-page instead."
    - "Griffith's Samaveda on sacred-texts is a SINGLE page (/hin/sv.htm), not a directory tree. /hin/sama returns nothing. Not a partial holding — the whole translation is in that one file."

