- node_path: sources/vedas/rigveda/shakala/apparatus/anukramani
  veda: rigveda
  organization: null
  shakha: shakala
  layer: apparatus
  edition: >
    V.S.D.S. Mahesh Akavarapu & Arnab Bhattacharya, "Creation of a Digital Rig Vedic Index
    (Anukramaṇī) for Computational Linguistic Tasks", Computational Sanskrit & Digital
    Humanities, 18th World Sanskrit Conference, 2023, pp. 89–96 (ACL Anthology 2023.wsc-csdh.6).
    Hand-annotated from Kātyāyana's Sarvānukramaṇī, cross-checked against Maharishi
    International University "Vedic Reserve" materials. IIT Kanpur.
  url: https://github.com/mahesh-ak/WSC2023/tree/main/Anukramani
  script: transliteration
  svara_source?: "no — verified: IAST with diacritics, zero Devanāgarī, zero U+0951/U+0952. Accent is not applicable to an index."
  svara_verified?: pending — BV
  text_layer: unicode
  license: Apache-2.0
  status: found-complete
  where_i_looked: n/a
  notes: >
    Ten files Anukramani/Mandala_1.txt … Mandala_10.txt, raw at
    https://raw.githubusercontent.com/mahesh-ak/WSC2023/main/Anukramani/Mandala_1.txt (HTTP 200).
    Header row in every file: `hymn.verses.seer.divinity.meter`. Fields period-delimited;
    multiple entries within a field comma-delimited; verse ranges in parentheses,
    e.g. `3.12.vaiśvāmitro madhucchandāḥ.(1-3)aśvinau,(4-6)indraḥ,(7-9)viśvedevāḥ,(10-12)sarasvatī.gāyatrī`.
    The `.` separator is safe because the IAST uses real precomposed Unicode (madhucchandāḥ,
    not madhucchanda.h).
    MEASURED COVERAGE: 1028 rows total; per maṇḍala 191/43/62/58/87/75/104/103/114/191 —
    exact match to the canonical hymn counts. 0 rows with an empty ṛṣi, devatā or chandas.
    336 distinct ṛṣi strings (top: maitrāvaruṇirvasiṣṭhaḥ 103, bārhaspatyo bharadvājaḥ 59).
    212 distinct devatā labels (indraḥ 275, agniḥ 223, pavamānaḥ somaḥ 113).
    38 distinct chandas labels (triṣṭup 579, gāyatrī 253, jagatī 195, anuṣṭup 178).
    KNOWN DEFECTS — fix in the harness, do not silently normalise:
      (a) RV 8.31 has 4 fields, not 5 — the ṛṣi field is missing. Parser must tolerate.
      (b) The `verses` column sums to 10534; the canonical RV stanza count is 10552
          (VedaWeb's stanza-indexed CSVs all have exactly 10552 rows). 18-stanza gap, unlocated.
      (c) Chandas label typo `jagatiī` occurs 9 times alongside `jagatī` 195 times.
      (d) Devatā/ṛṣi labels are deliberately NOT decomposed: `mitrāvaruṇau` is one label,
          not Mitra + Varuṇa. The paper states this explicitly. Any clustering that treats
          dual/group deities as atomic labels inherits that choice.
    The repo also ships `dcs_w2v.vec` (23.7 MB word2vec over DCS lemmas) and points to
    HuggingFace models mahesh27/vedicberta-base and mahesh27/div-class-roberta — not needed
    for the harness, but they are the published baseline (RoBERTa, 77.3% devatā accuracy)
    against which any embedding/clustering result should be compared.
  date_logged: 2026-08-01

- node_path: sources/vedas/rigveda/shakala/apparatus/anukramani
  veda: rigveda
  organization: null
  shakha: shakala
  layer: apparatus
  edition: >
    Not applicable — this record covers the SEARCH for hymn-level ṛṣi/devatā/chandas in the
    four large machine-readable Sanskrit corpora, i.e. the sources the build plan assumed
    would carry it.
  url: null
  script: null
  svara_source?: n/a
  svara_verified?: pending — BV
  text_layer: n/a
  license: n/a
  status: not-found
  where_i_looked: >
    (1) GRETIL full index gretil.html (1.03 MB, fetched): case-insensitive search for
    "anukram" returns ZERO hits. GRETIL holds no Anukramaṇī of any Veda. Its section heading
    "Pratisakhyas" is also mislabelled — it contains only the Nirukta and the Ṛgvidhāna, no
    prātiśākhya.
    (2) VedaWeb vedaweb-data: full file tree enumerated. rigveda/info/ holds addressees.json,
    strata.json, stanza_properties.json, rv_locations, grassmann_enum, matched_lemmata —
    no ṛṣi and no Anukramaṇī chandas. addressees.json (1028 entries) is Geldner's German/English
    hymn headings ("An Agni" / "Agni") — a devatā PROXY only, editorially Geldner's, not the
    tradition's, and it carries no ṛṣi and no metre. The TEI body confirms this: each hymn div
    has <div type="dedication"><div type="addressee"> and stanza-level <lg type="strata">, and
    nothing else at hymn level. stanza_properties.json is Grassmann/Oldenberg/Arnold/Wüst/Witzel
    stratification flags, not metre names.
    (3) DCS (github.com/OliverHellwig/sanskrit): CoNLL-U token annotation only; chapter headers
    carry text_id/chapter_id/citation, no ṛṣi/devatā/chandas.
    (4) arXiv 2503.18226 "Mapping Hymns and Organizing Concepts in the Rigveda" — releases no
    metadata dataset; works from the Jamison–Brereton translation.
    (5) detlef108.de (Eichler) — text and padapāṭha only, no index.
  notes: >
    This is the finding that matters: the ṛṣi and the Anukramaṇī chandas exist in exactly ONE
    open machine-readable place (WSC2023, record above). The śākhā-blind corpora do not carry
    the tradition's own labels. Treat WSC2023 as a single point of failure and mirror it.
  date_logged: 2026-08-01

