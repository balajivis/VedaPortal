  - holding_id: british-library/endangered-archives-programme
    institution: British Library — Endangered Archives Programme
    collection: EAP digitised manuscript projects, South Asia
    country: United Kingdom (hosting), material from India / Nepal / Bangladesh
    catalogue_url: https://eap.bl.uk/
    machine_queryable: api  # discovery via searcharchives JSON; images via open IIIF
    query_endpoint: https://searcharchives.bl.uk/?q=veda&f[language][]=Sanskrit&format=json
    query_verified: >
      Verified twice, by two independent checks that found two different routes in. Both hold.
      THE WALL: eap.bl.uk sits behind AWS WAF. Every HTML page returns HTTP 202 with
      `x-amzn-waf-action: challenge` and a zero-byte body; /search returns 405. A headless
      browser gets an interactive AWS CAPTCHA, not an auto-solving JS challenge. HTML search
      is effectively closed to scripted access.
      ROUTE 1 — discovery via the main BL archives JSON API (bypasses the EAP front end):
        https://searcharchives.bl.uk/?q=veda&f[language][]=Sanskrit&format=json
        language=Sanskrit → 8,361 records; Sanskrit + "veda" → 108.
        Named: EAP729/1/2/75 Ṛgsaṃhitā · EAP584/5/79 Veda (16th c.).
      ROUTE 2 — IIIF, which bypasses the WAF entirely and needs no auth:
        https://eap.bl.uk/archive-file/{EAPnnn}-{coll}-{item}/manifest → IIIF Presentation 3.0
        https://images.eap.bl.uk/{PROJ}/{ITEM}/{n}.jp2/info.json → IIIF Image API 2, level1/2
        Sample (EAP1023-1-1, 5,480 bytes, 157 canvases): label "चरित्र शुक सप्तती",
        metadata Identifier EAP1023/1/1, Extent "157 TIFF images", Place "Nepal, Asia",
        "Digitised by: Tribhuvan University", Scripts Devanagari.
        Image body verified: images.eap.bl.uk/EAP1023/EAP1023_1_1/1.jp2/full/full/0/default.jpg
        → 3961×2641, 200 image/jpeg.
      NO BULK ROUTE: there is no OAI-PMH, no IIIF Collection endpoint, and no catalogue dump.
      /project/{id}/manifest, /collection/{id}/manifest, /iiif/collection/top,
      /archive-file/{id}/collection and /api were all tried — 404 or WAF. The only
      programmatic harvest is ID ENUMERATION over EAPnnn-C-I until 404 (verified:
      EAP1023-1-50 → 200 with 118 canvases; EAP1023-1-200 → 404).
      POST-CYBERATTACK STATUS, verified: https://www.bl.uk/cyber-incident/ is live as of
      August 2026 and still says the Library is "working to restore full functionality". The
      BL blog platform is frozen at blogs-archive.bl.uk and the EAP blog path 404s. But EAP
      itself runs on separate AWS infrastructure and survived intact — EAP1550-1-1, a
      post-attack project, has a working manifest, so new material is still being published.
    record_count: 8,361 Sanskrit-language records
    vedic_material: >
      108 records matching Sanskrit + "veda" by keyword — certainly an undercount.
      The project-level picture is more useful. Verified projects with images confirmed
      online (manifest → 200):
      NEPAL
        EAP1023  Rare medieval Sanskrit MSS, Newār settlements, rural Kathmandu + hills — 504 items
        EAP790   Melvin Seiden Award — medieval MSS, Kathmandu Valley
                 (21 collections, 687 MSS, 28,050 folios) — 714 items
        EAP676   Buddhist Sanskrit MSS survey, Vajrayana vihāras, Lalitpur — 251 items
        EAP945   Pre-modern HINDU RITUAL MSS, Kathmandu Valley
                 (Rajopadhyaya priestly lineage; Sanskrit/Newari/Nepali) — 155 items
      INDIA
        EAP1304  Palm-leaf MSS of the four Śaṅkaran maṭhams, Thrissur, Kerala (~800 MSS;
                 host EFEO). HIGHEST VEDIC RELEVANCE — the project description explicitly
                 names "Advaita Vedānta, VEDIC EXEGESIS". First item is Śābarabhāṣya
                 (the Mīmāṃsā commentary), 369 canvases.
        EAP584 / EAP208  Palm-leaf MSS, northern Kerala — 748 bundles, 2,533 Sanskrit/
                 Malayalam texts
        EAP886   Sanskrit MSS + books, Jammu & Kashmir (Raghunath Temple Library, Ranbir
                 Sanskrit Library) — 48 items; Śaiva/Tantra-leaning, item 1 is Patañjali's
                 Mahābhāṣya, 389 canvases
        EAP1294  Two palm-leaf collections, Tamil country (~183 bundles, Grantha script)
        EAP1217  Palm-leaf MSS, Tamil University
      NO IMAGES ONLINE (manifest 404): EAP781, EAP921 (Bengal).
      BANGLADESH: no Vedic/Sanskrit manuscript project surfaced. Reported as none found.
    shakha_stated: not established
    images_digitised: full — EAP exists to digitise
    images_public: yes, via images.eap.bl.uk
    image_access_path: "https://images.eap.bl.uk/<project>/<item>/<n>.jp2/info.json (IIIF Image API 2.0)"
    access_requirements: >
      Records carry restrictions_on_use_ssi "Access is for research purposes only".
      The eap.bl.uk web front-end additionally interposes an AWS WAF human-verification
      challenge.
    license: copyright-link-only
    image_license: >
      Manifests carry NO `rights` field. The `requiredStatement` is restrictive, verbatim:
      "Except as otherwise permitted under your national copyright law this material may not
      be copied or distributed further". Plus the BL site ToU §3 database clause — see the
      IOL record. This is NOT open data. Link and cite.
    status: found-partial
    notes: >
      EAP is the only programme in this packet whose entire purpose is to photograph
      manuscripts that are at risk, which makes it structurally the best match for this
      project's concern with material that may not survive. The 108-record Vedic figure is a
      keyword count and is almost certainly an undercount.
      CAUTION ON PROVENANCE: many EAP projects digitise material held by families, temples
      and small local institutions. Records may therefore identify private individuals and
      private locations. Per this packet's hard constraint, harvest at the PROJECT and
      INSTITUTION level only and do not compile custodian identities or locations out of EAP
      metadata — that aggregation is precisely the artefact the constraint exists to prevent.
    date_logged: 2026-08-01

