# P1-a — accented-Devanāgarī publisher ecosystem sweep
# Schema: COLLECTION-PROTOCOL.md §1. Staging only — do not merge by hand from here.
# Collector: agent, 2026-08-01. svara_verified? is BV's field and is never set here.

summary:
  packet: P1-a
  date: 2026-08-01
  scope: >-
    sanskritweb.net (Ulrich Stiehl / Subramania Sarma), stotrasamhita (GitHub + .net),
    sanskritdocuments.org/doc_veda, VedaVMS (vedavms.in / Vedamahasabha),
    VedicReserve (vedicreserve.miu.edu, Maharishi International University),
    Svādhyāya Maṇḍalaṁ / Aundh (Satavlekar) print lineage, Muktabodha.
    Explicitly NOT touched (other packets): GRETIL, DCS, VedaWeb, TITUS/SARIT,
    the Anukramaṇī hunt (P0-a); the legacy-font remap of `Entire Rig Veda Samhita.pdf` (P0-b).

  hypothesis_verdict: >-
    CONFIRMED, but not by the publisher the lead named. sanskritweb/Sarma is a
    Taittirīya-only house (plus two Sāmaveda gāna books) and does NOT span thirteen
    śākhās. The genuine one-sweep-many-nodes publishers turned out to be
    (a) sanskritdocuments.org — the deepest ACCENTED UNICODE holdings, Taittirīya only,
    and (b) VedicReserve/MIU — the broadest ŚĀKHĀ SPREAD (11 of 13 represented), but
    legacy-encoded and accented only at the Saṃhitā layer.
    Together with VedaVMS/KYVeda they fill or partly fill 30 of the 50 nodes.
    LATE ADDITION on P0-a's tip: github.com/KYVeda/texts is the upstream of VedaVMS and is the
    single best artefact located in this packet — the Taittirīya corpus as Baraha PLAIN TEXT
    including pada-, krama-, jaṭā- and ghana-pāṭha. It removes the legacy-font remap for that
    entire śākhā.

