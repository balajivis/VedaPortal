findings:
  - "THE LARGEST REMAINING HOLE IN THE CORPUS, AND THE BLOCKER IS LICENCE, NOT AVAILABILITY. The Satapatha Brahmana is absent in ANY form, either recension, from the entire accented-Devanagari publisher ecosystem. TITUS has the Madhyandina Satapatha COMPLETE and PUBLIC. A permission request to TITUS is the single highest-leverage action available for this sakha, and it also reaches the aranyaka and Brhadaranyaka nodes, which are unsourced for the same reason."
  - "Adyar Library's Vedic catalogue names 5 Madhyandina manuscripts. Sakha is absent from the modern databases but stated routinely in printed catalogues — see the manuscripts register."
