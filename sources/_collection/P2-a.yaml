  notes: >
    I LOGGED THIS NODE `not-found` AND I WAS WRONG. Recording the error rather than
    quietly overwriting it, because the correction is worth more than the record.
    The first pass searched vedicheritage, sanskritweb, GRETIL, TITUS and a title-keyed
    archive.org query and concluded there was no Jaiminīya audio. There are thirteen items.
