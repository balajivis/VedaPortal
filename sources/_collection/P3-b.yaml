  vedic_heritage_portal_error:
    verdict: "CONFIRMED. The error exists and is live as of 2026-08-01."
    url: https://vedicheritage.gov.in/brahmanas/aitareya-brahmana/
    quoted_verbatim: >
      "This work is ascribed to Mahidasa Aitareya and dated variously from 1000 BCE to
      500 BCE. It is divided into eight Panchikas and each of the Panchika is divided
      into eight adhyayas. Totally, it consist forty adhyayas."
    why_it_is_wrong: >
      8 × 8 = 64, not 40. The correct figure is five adhyāyas per pañcikā — which is
      what the word pañcikā *means* ('a group of five'), what every edition prints, and
      what the text's own colophons say ('इत्यष्टमपञ्चिकायां पञ्चमोऽध्यायः'). The
      arithmetic is not merely inconsistent; the wrong number contradicts the name of
      the unit it is counting.
    also_noted: >
      The same page states "The first six panchikas of Aitareya Brahmana dealing with
      Soma Sacrifice ... and in the last two panchikas describe about Rajyabhisheka."
      Loosely defensible but imprecise: pañcikā 7 is the paśu-vibhakti, the expiations,
      Śunaḥśepa and the preparations for the royal consecration — the rājasūya material
      proper begins inside pañcikā 7, and Śunaḥśepa is not rājyābhiṣeka.
      The page has no khaṇḍa count and no mention of Sāyaṇa.
    a_second_error_on_the_same_portal: >
      /brahmanas/kausitaki-shankhyayana-brahmana/, verbatim: "associated with **Baskala
      Shakha** of Rigveda and also called Sankhyayana Brahmana. It is divided into thirty
      chapters and **226 Khanda**." The 226 figure matches no witness — not the vulgate's
      276, not Sarma's 272, not Burnell's 260. Wikipedia carries the same number and
      cites this page.
    BUT_THE_OTHER_THREE_PAGES_ARE_GOOD_AND_THAT_MATTERS: >
      **Do not generalise from the two errors. I checked all four pages and the other
      two are accurate, in one case more accurate than most secondary sources.**
      /aranyakas/aitareyaranyaka/ states correctly that the AiĀ "belongs to the Shakala
      recension", has five āraṇyakas, that "third Aranyaka [is] about spiritual meaning
      of various interpretation of the Samhitas including padapatha, kramapatha etc. for
      recitation of the Vedamantras along with the Svaras", that "The fourth, fifth and
      sixth chapter of the Second Aranyaka is known as Aitareya Upanishad", and — the
      point where most sources get it backwards — that **"fourth Aranyaka to Ashvalayana
      and fifth Aranyaka to sage Shaunaka."** That is Keith's conclusion exactly, arrived
      at independently by an Indian institutional source.
      /aranyakas/sankhyayana-aranyaka/ states correctly: fifteen chapters, "third, fourth,
      fifth and sixth are considered as Kaushtaki Upanishad and chapters seventh and
      eights as Samhitopanishad." Matches Keith exactly.
    bearing_on_trust: >
      The honest reading is narrower and more useful than "don't trust it". The portal's
      **prose descriptions of content and structure are largely sound** — two of four
      pages are accurate and one is unusually good. What fails is **numbers**: 8×8=40 on
      the Aitareya, 226 khaṇḍas on the Kauṣītaki. Both are the kind of figure a
      copy-editor would not catch and a specialist would.
      Operational rule: **cite the portal for what it holds and for its content
      descriptions; never take a count from it without a second witness.**
      Note also that its own menu links resolve to /brahmanas/kausitaki-shankhyayana-brahmana/,
      /aranyakas/aitareyaranyaka/ and /aranyakas/sankhyayana-aranyaka/ — spellings no
      naive URL guess will hit, and the plausible guesses all 404.
    AND_IT_HOLDS_MORE_THAN_IT_ADVERTISES: >
      **The portal hosts complete free page-image scans of all four texts, and they are
      not linked from anywhere a search engine will surface.** See the five flipbook
      records below. This is the only place I found a Devanāgarī Śāṅkhāyana/Kauṣītaki
      Brāhmaṇa in any digital form, and the only free scan of a Sāyaṇa-plus-Hindi
      Aitareya Brāhmaṇa. It also hosts a paper, "Contribution of Aitareya Aranyaka to
      Phonetics" (https://vedicheritage.gov.in/Vijnana_Bharati/15.pdf, 5 pp) — directly
      on the AiĀ 3 material this project has flagged as a sleeper node.
      **So the correct posture is: a portal whose holdings are better than its prose and
      whose prose is better than its arithmetic.**

