      claim. The Paippalāda Atharvaveda — the recension believed lost — is held in TEN
      manuscripts at a state museum that has no website, catalogued in a 1973 printed volume
      that is freely readable with OCR on archive.org, and represented in India's national
      manuscript database by exactly ONE record.
