audio:
  status: sourced
  note: "268 khanda-aligned Kausitaki recitation MP4s at vedicheritage.gov.in/Kaushitaki_Brahmana/RVKB-{aa}.{kk}.mp4 — full grid HEAD-probed; aligns to GRETIL in 27 of 30 adhyayas, diverges at 3, 6, 29."
findings:
  - "THE RGVEDIC BRAHMANA SVARA IS EXTINCT, NOT UNDIGITISED. Zero accent marks across ~940,000 chars. Keith p.96: it 'originally was duly accented, but the accents have not been preserved by the tradition.' Haug 1863 heard the Aitareya chanted 'quite monotonously, whilst the Brahmanas of the Yajurveda are recited with the proper accents.' The one accented prose survivor is the Aitareya UPANISAD — the section that kept being recited. The boundary falls inside one text and tracks liturgical use. No accent-aware OCR is needed for RV prose; there are no accents left to recover."
  - "CITATION CONVENTION (AB): store pancika.adhyaya.khanda (native to the colophons, unambiguous); display pancika.khanda (what Haug, Keith and all secondary lit use). Aufrecht prints both numerals at every khanda, so the mapping is read, not reconstructed. VIII.21 / 8.23 / 8.4.7-9 are not conflicting citations — all three point at TITUS units 278-280, the aindra mahabhiseka king-list: opening khanda, closing khanda, whole span."
  - "285 khandas, four independent witnesses. The '235' in one source is a PAGE NUMBER — the running head of Aufrecht's last text page reads 'Adhyaya 40, 5. 235'."
  - "vedicheritage.gov.in states each pancika has eight adhyayas totalling forty (8x8=64). Confirmed verbatim. Second error on the same site: KB '226 khandas' against its own nav table summing to 271. Its other pages check out and it hosts free complete scans of all four texts — calibrate, do not dismiss."
