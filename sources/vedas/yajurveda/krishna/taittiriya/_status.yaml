layers:
  samhita:   { status: sourced, note: "COMPLETE at last: KYVeda/texts TS-Padam holds all 44 prasnas across all 7 kandas (1.1-1.8, 2.1-2.6, 3.1-3.5, 4.1-4.7, 5.1-5.7, 6.1-6.6, 7.1-7.5) in Baraha plain text with accent preserved. Also sanskritdocuments accented Unicode. Held PDF is kanda 1 only and is a textless scan. TITUS serves accented Unicode Devanagari (ts001 measured: 706 U+0951 + 841 U+0952) but is all-rights-reserved." }
