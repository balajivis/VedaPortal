# Fetched-scan manifest — packet F1 (ACQUISITION)
#
# Files listed here are gitignored (see README.md). This manifest is the tracked artefact.
# Every record was measured after fetch, never inferred. Reproduce with the archive_id +
# the sha256; nothing here needs the payload shipped.

summary:
  packet: F1-acquisition
  date: 2026-08-01
  budget_bytes: 8000000000
  total_bytes_fetched: 1525804559        # 1.53 GB of an 8 GB budget — budget was never the binding constraint
  files: 70
  disk_free_after: "~33 GB"

  purpose: >
    Raw material for a verse-by-verse alignment of Sayana's bhasya to the Rgveda.
    No machine-readable Sayana exists anywhere and the bhasya has never been segmented
    verse-by-verse. Wilson's English is included because it follows Sayana throughout,
    making it the validation set that lets the English end of an alignment be checked
    without a Sanskritist in the loop.

  what_landed_by_priority:
    p1_rv_sayana_poona: "COMPLETE — all 4 parts (mandala 1 / 2-5 / 6-8 / 9-10+khilas), 4377 pages, 304 MB. Fetched from the duplicate item rgveda-with-sayanabhasya, NOT from RgVedaWithSayanasCommentaryPart1-4. See the trap note below; this choice is the single most consequential decision in the packet."
    p2_rv_wilson_english: "COMPLETE — all 6 vols, 2708 pages, 136 MB. Fallback set VERIFIED PRESENT by direct metadata probe, not assumed: rigvedasanhitc01wils..c06wils, all six live, Trubner London 1854-1888, credited to Wilson with Cowell and Webster, PDFs 16-31 MB and _djvu.txt 0.54-1.04 MB each. Recorded as fallback; not fetched, since the set in hand is complete."
    p3_rv_sayana_maxmuller: "COMPLETE for what exists — syaauoft vols 1-4 (only 01-04 exist on Archive.org; 05/06 probed, absent), plus DLI single in.ernet.dli.2015.487366. The other DLI single, .272521, was probed and REJECTED — see negatives."
    p4_aitareya_brahmana: "COMPLETE — vols 1 and 2 (Samasrami, Bibliotheca Indica 1895-96)."
    p5_aitareya_aranyaka: "COMPLETE — Mitra ed. (Archive.org date field '1627' is junk; edition is 1876)."
    p6_taittiriya_samhita: "COMPLETE — all 9 parts of Anandasrama Sanskrit Series 42 (Agase). Recovered only via COLLECTION-PROTOCOL rule 11 — see recovered_via_probing."
    bonus: "Taittiriya Brahmana with Sayana (ASS 37, 3 parts) and Taittiriya Aranyaka with Sayana (ASS 36, 2 parts), from the same bulk item. Beyond the packet's list; both serve the Taittiriya sakha, which sources/vedas/ lists as a priority hole."

  budget_cut_off: "Nothing. Every priority level 1-6 was reached and completed, at 19% of budget. The limiting factor was what exists on Archive.org, not bytes. Deliberately NOT fetched: _jp2.zip derivatives (hundreds of MB/vol, raw page images, not needed); the in.ernet.dli.2015.272521 PDF pair (~870 MB) after its text layer measured as garbage."

  recovered_via_probing:
    - "RULE 11 / bulk-path. Taittiriya Samhita ASS 42 is a 9-part edition. The standalone Archive.org items hold only parts 1,2,3,4,5,7,8 — in BOTH the in.gov.ignca.1893-1900 run and the in.ernet.dli.2015.326097-326104 run. Parts 6 and 9 are absent from both, and the gap identifiers in.gov.ignca.1898 / .1901 return empty. All nine parts exist as individually-named files inside the bulk item Anandashram_Samskrita_Granthavali_Anandashram_Sanskrit_Series (2082 files), which the search interface does not surface. Recording 'parts 6 and 9 not online' would have been a false negative."
    - "Archive.org's metadata API returns filenames in NFC while the files are stored on disk in NFD. Every download of the rgveda-with-sayanabhasya item 404s unless the filename is re-normalised to NFD. An item that appears dark under the documented API is not dark."

  negatives_recorded:
    - "in.ernet.dli.2015.272521 (Max Muller, DLI): _djvu.txt is 335153 chars with devanagari=0, latin=161188 — Latin-alphabet OCR run over Devanagari type. Non-empty and worthless. Its 544 MB PDF was not fetched. Confidence: high (measured, not inferred)."
    - "rigvedasanhitasa05/06syaauoft: probed, do not exist. Only vols 01-04 of that scan run are on Archive.org."
    - "in.gov.ignca.1898 and .1901 (would be TS parts 6 and 9): probed, empty. Superseded by the bulk-item recovery above."

  # ---------------------------------------------------------------------------
  # THE TRAP, RESTATED — this one is not the usual DLI trap and it matters more
  # ---------------------------------------------------------------------------
  text_layer_trap_found: >
    The packet brief states that RgVedaWithSayanasCommentaryPart1-4 have "substantial
    non-empty text layers". They are non-empty and they are worthless. Part 1's _djvu.txt
    is 1.58 MB / 1542569 chars with devanagari=0 and latin=747081 — Latin-alphabet OCR run
    over Devanagari type. The duplicate item rgveda-with-sayanabhasya carries byte-identical
    PDFs (md5 confirmed, e.g. 0abea810d5873ddc3b008820749db968 for part 1) but a re-derived
    text layer of 7.54 MB / 2933532 chars with devanagari=2255652. Same book, same scan,
    5x the usable text. Everything in this packet's p1 was taken from the re-derive.
    part1.olddjvu.txt is kept on disk purely so the comparison stays reproducible.
    Generalisation: "non-empty _djvu.txt" is not the test. Devanagari character count is.

  # ---------------------------------------------------------------------------
  # OCR VERDICT — is this good enough to attempt verse-alignment on?
  # ---------------------------------------------------------------------------
  ocr_assessment:
    method: >
      Two measurements per source. (1) The COLLECTION-PROTOCOL section 3 test on every file.
      (2) A malformation rate: the share of Devanagari tokens containing a structurally
      impossible sequence (doubled dependent vowel sign, vowel sign or virama with no
      preceding consonant, doubled virama). That rate is a LOWER BOUND on character error —
      it catches only impossible output, never wrong-but-plausible output — so true CER is
      several times higher. Spot-reading against known text put real CER roughly 3-5x the
      malformation figure.

    malformation_rate_by_source:
      rv-sayana-poona (IA re-derive):    "0.86%  over 1131517 tokens   — best by a wide margin"
      rv-sayana-maxmuller (Toronto):     "3.08%  over  819628 tokens"
      rv-sayana-maxmuller (DLI 487366):  "3.77%  over  301020 tokens"
      tb-sayana-anandashrama:            "3.90%  over  191788 tokens"
      ta-sayana-anandashrama:            "4.78%  over  223271 tokens"
      aitareya-brahmana:                 "4.90%  over  132861 tokens"
      aitareya-aranyaka:                 "5.21%  over   65729 tokens"
      ts-sayana-anandashrama:            "6.13%  over  422401 tokens   — worst"

    verdict_alignment: >
      YES for the Rgveda, on structure — but only for the Poona re-derive, and only for
      LOCATING commentary spans, not for publishing text.
      The decisive evidence is structural, not lexical. Across the four Poona parts there
      are 22152 verse-terminal marks of the form "|| <devanagari digit> ||" against an
      expected 21104 (10552 mantras, each appearing twice — once in the samhita line, once
      in the pada-patha line immediately below). That is 105% of expectation, the excess
      explained by the khilas in part 4 and by sukta-total markers. Verse boundaries are
      therefore essentially all present. The printed layout is highly regular and survives
      OCR: samhita line with verse number, pada-patha line with the same verse number,
      then Sayana's prose. Running heads carry mandala/adhyaya/sukta plus the printed page
      number and give ~1000 independent anchors across the four parts.
      Wilson is the matching half: its running heads carry "[mandala. sukta. verse"
      citations (681 recovered across 2708 pages) and its verses are numbered in-line,
      so the English end segments directly and independently.
      So a pipeline can be built now: segment on the OCR's structural markers, key each
      commentary span to a mantra, and validate against Wilson. What the pipeline must NOT
      do is treat the OCR string as the text.

    verdict_text_quality: >
      NO — do not publish, index, or search this OCR as text without correction, and treat
      re-OCR as scheduled work rather than a contingency.
      Poona at 0.86% malformed is usable-with-cleanup; spot-reading shows the errors are the
      predictable ones (v/b, e/ai matra confusion, conjunct breakup) and are largely
      correctable against a clean accented samhita.
      Everything at or above ~4% is materially degraded. Taittiriya Samhita (6.13%) is the
      worst: spot-reading the opening of part 1 shows "ise la" for "ise tva" and the running
      title rendered as "krsnayajurvedi yatainiri yasam hita" — that is not a correctable
      error rate, that is a re-OCR job. The Aitareya volumes are a specific case worth
      flagging: they are NOT the DLI empty-text-layer trap (1.4-1.6 MB of genuine
      Devanagari), but they are printed in a Calcutta Bengali-influenced Devanagari face
      that the OCR engine handles badly, and the output is heavily corrupted. Non-empty was
      never the same as usable.

    verdict_svara: >
      SVARA IS NOT RECOVERABLE FROM ANY OF THIS. This is the sharpest finding in the packet
      and it is uniform across all eight Devanagari sources: the svara-to-devanagari ratio
      sits between 0.08% and 0.44% everywhere. For editions that print the mantra portions
      fully accented — the Poona Rgveda and the Taittiriya Samhita both do — the expected
      overall ratio is several percent. Observed is roughly an order of magnitude short, and
      it does not vary with the OCR quality of the surrounding text, which means the accent
      marks are being dropped systematically rather than misread. Consequence for the build:
      accents must come from an accented digital samhita (GRETIL / VedaWeb / sanskritweb),
      never from these scans, and any svara claim sourced to this OCR is unsafe. This is
      consistent with the existing sources/ position that the accented-text problem is a
      separate acquisition track (packets P0-b, P1-a).

    pdf_vs_text_layer: >
      Worth knowing before anyone opens a file expecting text. The Poona PDFs are
      IMAGE-ONLY — pdftotext returns 97 characters over 40 pages; they were produced by
      Adobe Acrobat's Image Conversion plug-in and carry no text layer at all. For those
      four parts every usable character is in the sibling _djvu.txt, and the per-page
      hocr_searchtext.txt.gz files were fetched alongside because the _djvu.txt carries no
      form feeds and therefore no page boundaries — without the hOCR there is no way to map
      a text offset back to a page image. By contrast the Max Muller, Taittiriya, and
      Aitareya PDFs all carry real embedded Devanagari, and Wilson's _text.pdf carries real
      embedded English, so for those the PDF is self-sufficient.

  recommended_next_step: >
    Build the alignment pipeline against rv-sayana-poona + rv-wilson only. Those two are
    the pair the whole plan rests on and they are both good enough. Budget a re-OCR pass
    (Sanskrit-trained model, e.g. a Devanagari-specific engine over the page images) before
    the Taittiriya and Aitareya material can carry weight, and source every accent from an
    accented digital edition rather than from anything in this directory.

  license_note: >
    All records classified public-domain per COLLECTION-PROTOCOL rule 9: the mula text and
    Sayana's bhasya are public domain irrespective of a modern reset. The Poona upload
    carries a CC BY-NC-ND 3.0 notice, recorded here verbatim rather than acted on. One
    genuine edge case is FLAGGED not adjudicated: the Poona VSM edition is a real critical
    edition (manuscript collation, apparatus criticus), and Sontakke's and Kashikar's
    apparatus is original scholarly work distinct from the text it serves.

