  objective_2_cleaner_wilson:
    answer: >
      YES, and the win is structural rather than merely cleaner OCR. The set already held
      (RigVedaSanhitaByHHWilsonVol1-6) turns out NOT to be the Trubner original but
      H. R. Bhagavat's Poona 1925 rearrangement, reissued as the 2nd edition by the Bangalore
      Printing & Publishing Co. in 1946. Its own Prefatory Note states the changes:
      it re-ordered the text into Mandala/Anuvaka/Sukta, MOVED ALL OF WILSON'S NOTES TO THE END
      OF EACH VOLUME ("I have given the translation first and the notes at the end instead of
      giving both together"), and dropped diacritics ("The diacritical marks I could not make
      use of"). Wilson's notes are where his Sayana citations live, so the held set is the wrong
      copy for a Sayana alignment. rigvedasanhitc01wils..c06wils is the ORIGINAL Trubner
      printing with the notes in place on the page.
    correction_to_f1: >
      F1 recorded the fallback set as 'University of Toronto'. The Archive.org contributor
      field on all six items is 'Princeton Theological Seminary Library'. Local directory named
      rv-wilson-english-princeton accordingly.
    wilson_ocr_comparison: >
      Same probe, both sets, all 6 volumes, targets Agni / Indra / sacrifice / Soma / Varuna.
      'damaged' = a near-miss token (difflib ratio >= 0.72 against the target, length within 2,
      not in /usr/share/dict/words, not a legitimate morphological variant).
      HELD (Bhagavat/Bangalore reprint): Agni 2544 clean / 234 damaged (8.42%);
      Indra 3362/690 (17.03%); sacrifice 1747/59 (3.27%); Soma 2391/55 (2.25%);
      Varuna 610/201 (24.78%). TOTAL 10,654 clean / 1,239 damaged = 10.42%.
      NEW (Trubner original, Princeton): Agni 2881/137 (4.54%); Indra 3762/489 (11.50%);
      sacrifice 1648/56 (3.29%); Soma 2413/47 (1.91%); Varuna 608/220 (26.57%).
      TOTAL 11,312 clean / 949 damaged = 7.74%.
      So: 26% fewer damaged proper-noun tokens overall and 6% more correctly-read ones, and
      that understates it, because the Trubner text ALSO contains ~500 KB of extra footnote
      material dense in diacritics, which is the hardest thing on the page for OCR. Agni
      improves 46% and Indra 32%. 'sacrifice' is flat and 'Varuna' is slightly worse, the
      latter because Trubner prints Varuna with diacritics that OCR mangles (Vartjna, Vaeuna)
      while the reprint prints it plain.
    structural_gain: >
      416 marginal 'Varga n.' labels OCR'd in Trubner vols 1-3, against 2 in the whole held
      set. 141 'ASHTAKA' running heads in Trubner vol 1 against 14. All 8 astakas confirmed
      present across the 6 volumes by running-head extraction.
    hocr_gain: >
      The re-derive trick paid off. All six Trubner items carry _hocr.html, _chocr.html.gz,
      _abbyy.gz and _djvu.xml derivatives; the held items were taken as _djvu.txt + _text.pdf
      only. vol01.hocr.html = 422 ocr_page, 1,051 ocr_carea, 4,917 ocr_par, 14,042 ocr_line,
      108,303 ocrx_word, every one with a bbox and per-word confidence. That is the fix for the
      header-detection failure: the marginal varga labels can be picked out by x-coordinate
      instead of by text order, which is exactly why only 503 of 1,028 headers were detected
      from flat _djvu.txt.
    other_scans_probed:
      - "rigvedasanhita01wils (vol 1 only, 1866 2nd ed., Trubner, Univ. of California / MSN) — FETCHED FOR PROBE, NOT KEPT. Damage rate 15.30% on the same probe, worse than both the held copy (7.30% on vol 1) and the Princeton Trubner (9.68% on vol 1). Recorded so nobody re-probes it. NOTE: on vol 1 alone the held reprint scores BETTER than the Trubner; the Trubner's advantage is cumulative across volumes and structural, not uniform per volume."
