    von Schroeder — page 212 (KS XV.4–5) likewise shows systematic superscript strokes.
    THE ENCODING TRAP, flagged for whoever builds on this: the Kāṭhaka convention marks
    UDĀTTA with a superscript bar. That is the opposite convention from Ṛgveda/Taittirīya
    practice, where the marked syllables are anudātta (underline) and svarita (vertical).
    A U+0951 count will happily return a healthy number from a Kāṭhaka text — and it will
    MEAN something different. Any pipeline that maps "U+0951 present ⇒ svarita" will
    silently invert the accentuation of this entire śākhā.
    Also relevant to the partiality: the reported Kashmiri Śāradā manuscript behind the KS
    is imperfect and does not show accents throughout — so "partial" is a property of the
    TRANSMISSION, not a defect of the edition.
