- node_path: vedas/rigveda/bashkala/samhita
  veda: rigveda
  organization: null
  shakha: bashkala
  layer: samhita
  edition: >
    NO EDITION OF A BĀṢKALA ṚGVEDA SAṂHITĀ EXISTS — the saṃhitā does not survive.
    WHAT DOES EXIST, as its surviving trace: the Khilāni, 98 supplementary hymns recorded
    in Bāṣkala and absent from Śākala. Edited by J. Scheftelowitz, "Die Apokryphen des
    Ṛgveda (Khilāni)", Breslau 1906, from a Kashmiri manuscript. E-text on GRETIL
    (Ṛgveda-Khilāni) and TITUS (data entry Carlos Jordán Cólera and F.J. Martínez García).
  url: https://archive.org/details/apokryphen-des-rgveda
  script: transliteration
  svara_source?: >
    NO, for the GRETIL e-text — measured directly, NFC-normalised: 0 U+0951, 0 U+0952,
    0 Vedic Extensions across 130,272 characters of the analytic file. Roman
    transliteration; the 11,184 combining marks an NFD count returns are decomposed
    ṛ/ṣ/ā etc., not accents. GRETIL's own header states accents have been dropped.
    Scheftelowitz's 1906 printed edition was NOT opened and is untested — a printed
    Devanāgarī or transliterated edition of this period may well carry accents.
    That is the obvious next check for anyone who needs an accented Khila text.
  svara_verified?: pending — BV
  text_layer: unicode
  license: public-domain
  status: not-found
  where_i_looked: >
    archive.org (Scheftelowitz 1906 at /details/apokryphen-des-rgveda and at
    in.ernet.dli.2015.134238, both free); GRETIL (Ṛgveda-Khilāni, TEI XML plus HTML and
    plaintext transformations — measured); TITUS Vedic index (Ṛgveda-Khilāni, preliminary
    HTML, open); vedicheritage.gov.in; Exotic India.
  notes: >
    `status: not-found` refers to the BĀṢKALA SAṂHITĀ ITSELF, which is GENUINELY LOST —
    no complete text survives, and no amount of searching will change that. The Khilāni are
    logged here as its surviving trace, not as the saṃhitā. Do not let the Khila material
    make this node look sourced; it is a fragment of a lost recension, and it reaches us
    through a single Kashmiri manuscript now in Pune.
    ATTRIBUTION DOUBT, into `notes` per binding rule 7, NOT into `shakha`: a printed volume
    is currently in the trade titled "ऋग्वेदसंहिता: Rigveda Samhita (Bāṣkala-Āśvalāyana —
    With Śāṅkhāyana)", Amaldhari Singh, Bharatiya Books, Varanasi 2024, ISBN 9789392974311,
    1030 pp, Sanskrit only. I did NOT open it and cannot say what it actually contains.
    Given that the Bāṣkala saṃhitā is not extant, a 2024 volume bearing that title is far
    more likely a modern compilation or reconstruction than a recension text. TREAT AS
    UNVERIFIED AND DO NOT CITE AS A BĀṢKALA SAṂHITĀ without inspection. Recorded because a
    later collector will certainly find it and needs the warning attached, not because it
    is a source.
    OWNERSHIP: P0-a owns the GRETIL sweep. The Khila measurement above is recorded because
    the node is mine; it is not a claim on GRETIL coverage.
    CREDIT: J. Scheftelowitz (1875–1934); Jordán Cólera and Martínez García for the e-text.
  date_logged: 2026-08-01

- node_path: vedas/rigveda/bashkala/brahmana
  veda: rigveda
  organization: null
  shakha: bashkala
  layer: brahmana
  proposes_new_node: true
  edition: >
    Kauṣītaki Brāhmaṇa (= Śāṅkhāyana Brāhmaṇa).
    (a) Bruno Lindner, "Das Kauṣītaki Brāhmaṇa", ed. and German trans., I: Text, 1887.
    (b) E.R. Sreekrishna Sarma (ed.), "Kauṣītaki (Śāṅkhāyana) Brāhmaṇam with the commentary
        'Vyākhyā' of Udaya", 1968.
    (c) A.B. Keith, "Rigveda Brahmanas: the Aitareya and Kauṣītaki Brāhmaṇas", trans., 1920.
    (d) GRETIL and TITUS both hold a Kauṣītaki-Brāhmaṇa e-text.
  url: https://archive.org/details/shankhayana-kaushitaki-brahmanam
  script: devanagari-unicode
  svara_source?: >
    unknown — not opened. No accent claim is made for any of these editions.
    GRETIL's Kauṣītaki e-text should be assumed unaccented until measured, given GRETIL's
    blanket header policy of dropping accents, verified twice in this packet.
  svara_verified?: pending — BV
  text_layer: scanned-no-text
  license: public-domain
  status: found-complete
  where_i_looked: >
    archive.org (/details/shankhayana-kaushitaki-brahmanam for Sreekrishna Sarma;
    kaushitakibrahma00linduoft for Lindner 1887; in.gov.ignca.23771 for Keith;
    /details/shAkhAyana-kauShitaki-brAhmaNa); GRETIL (sa_kauSItakibrAhmaNa TEI XML plus
    HTML and plaintext); TITUS; vedicheritage.gov.in/brahmanas/kausitaki-shankhyayana-brahmana/
    (a real page).
  notes: >
    THE ATTRIBUTION QUESTION IS THE WHOLE POINT OF THIS RECORD, and it is stated here
    rather than resolved, per binding rule 7.
    The claim, widely repeated: the Kauṣītaki (Śāṅkhāyana) Brāhmaṇa belongs to the Bāṣkala
    śākhā, giving Bāṣkala a complete surviving brāhmaṇa even though its saṃhitā is lost.
    The complication: Śaunaka's Caraṇavyūha lists Śākala, Bāṣkala, Āśvalāyana, Śāṅkhāyana
    and Māṇḍūkāyana as five separate Ṛgvedic śākhās — on which reading Śāṅkhāyana is a
    SIBLING of Bāṣkala, not its brāhmaṇa. Other sources treat Kauṣītaki/Śāṅkhāyana as a
    sub-śākhā or caraṇa OF Bāṣkala. Both readings are in circulation and I am not
    adjudicating between them.
    CONSEQUENCE FOR THE MERGE PASS, stated plainly: if the attribution holds, Bāṣkala's
    survival is materially better than "fragmentary" — brāhmaṇa, āraṇyaka and upaniṣad all
    extant and free, with only the saṃhitā lost. If it does not hold, Bāṣkala has a lost
    saṃhitā and nothing else, and these records belong under a Kauṣītaki/Śāṅkhāyana node
    that does not currently exist in the tree. That is a real structural decision about the
    corpus, not a labelling detail, and it needs a human.
    PROPOSES A NEW NODE, conditional on the above. Do not create it silently.
    This is a candidate for `tier: multi_traditional` with both lineages named — precisely
    the pattern the project reserves for exactly this kind of disagreement.
  date_logged: 2026-08-01

