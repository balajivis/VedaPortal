  khanda_count:
    verdict: "285. RESOLVED."
    evidence: >
      Two independent complete witnesses, counted mechanically, agree:
      (1) TITUS's Aufrecht-based text has exactly 285 addressable units — ab001 through
      ab285, with ab286 returning the TITUS 'not available' stub (1330 bytes, identical
      to the stub returned for texts TITUS does not hold). The unit count is not a
      claim about khaṇḍas; it is a file count that happens to equal one.
      (2) Sanskrit Wikisource's eight pañcikā pages carry per-pañcikā khaṇḍa numerals
      running 1–30, 1–41, 1–50, 1–32, 1–34, 1–36, 1–34, 1–28. Sum = 285. Two numerals
      (3.21, 6.24) are absent from the markup as printed numerals while their text is
      present and the sequence continues past them — wiki typos, not textual gaps.
      (3) The two distributions are identical, and both reconcile to Aufrecht's
      adhyāya labels, which sum to 285 independently.
    corroborating_witnesses:
      - "Haug 1863 vol. I — the pañcikā-closing colophons carry the running totals:
         I.5 ॥३०॥, II.5 ॥४१॥, III.5 ॥५०॥, V.5 ॥३४॥, VI.5 ॥३६॥, VIII.5 ॥२८॥. Same eight numbers."
      - "Aufrecht 1879 — per-adhyāya colophons ('Iti prathamādhyāye ṣaṣṭhaḥ khaṇḍaḥ' = 6,
         'dvitīyādhyāye pañcamaḥ' = 5, 'tṛtīyādhyāye ṣaṣṭhaḥ' = 6, 'caturthādhyāye navamaḥ'
         = 9, 'pañcamādhyāye caturthaḥ' = 4 → 30 for pañcikā I), and each khaṇḍa closes
         with TWO numerals — Latin for khaṇḍa-within-pañcikā, Devanāgarī for
         khaṇḍa-within-adhyāya ('|| 11 || ५ ||'). The edition prints the concordance."
      - "Keith HOS 25 §1, the khaṇḍa-by-khaṇḍa AB↔KB comparison table, pp. 1–21 —
         the last entry of each pañcikā gives the same eight numbers."
    a_caution: >
      **Neither Haug nor Keith ever states the total.** Haug says only that the work is
      "in its eight books, or forty chapters, each of which is subdivided into a certain
      number of kandikas"; Keith does not use the word *khaṇḍa* at all. 285 is a figure
      that has to be summed, which is part of why it drifts.
    on_the_235_claim:
      verdict: "SOLVED. It is a page number that someone read as a section count."
      evidence: >
        Aufrecht's romanised Sanskrit text of the Aitareya Brāhmaṇa runs pp. 1–236, and
        the recto running head of its final text page reads **"Adhyāya 40, 5.   235"**.
        A reader looking for "how big is the Aitareya Brāhmaṇa" at the end of the text
        finds 235 sitting next to "Adhyāya 40" and carries it off as a count of sections.
        Independently: 235 appears in no edition, no catalogue and no scholarly source
        as a division of the AB; the English Wikipedia article gives no khaṇḍa figure at
        all, so it is not the vector; and a Wikipedia-wide search for the literal strings
        "235 khandas" and "285 khandas" returns nothing.
      use: "**285.** Do not carry 235 forward, and record why it existed."

