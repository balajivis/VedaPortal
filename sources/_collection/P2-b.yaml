  ================================================================================
  HEADLINE
  ================================================================================
  Of the 15 apparatus cells declared `enumerated` across the five śākhās that carry an
  `apparatus:` block (Śākala, Taittirīya, Mādhyandina, Kauthuma, Śaunaka × pratishakhya /
  anukramani / kalpa), the Ṛgveda anukramaṇī is P0-a's. Of the remaining 14, **13 are now
  fillable to `sourced`** with a verified, open URL. The one that is not is the Taittirīya
  Anukramaṇī (see NOT-FOUND below). Two further nodes not currently in any _status.yaml are
  also filled here: Nirukta and Nighaṇṭu (proposed `_reference/`), plus a Jaiminīya anukramaṇī
  found opportunistically.

