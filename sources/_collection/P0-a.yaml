# P0-a — Machine-readable sweep: GRETIL · DCS · VedaWeb · TITUS. Anukramaṇī first.
# Schema: COLLECTION-PROTOCOL.md §1. Staging only — do not merge by hand; see _collection/README.md.
# Collector: agent. All accent claims below were measured on files actually downloaded,
# not read off a description page. Method is recorded per record in `svara_source?`.

summary:
  packet: P0-a
  date: 2026-08-01
  anukramani_harness: UNBLOCKED
  anukramani_verdict: >
    A complete, parseable Ṛgveda Anukramaṇī exists: Akavarapu & Bhattacharya (IIT Kanpur),
    WSC 2023, github.com/mahesh-ak/WSC2023, Apache-2.0. Ten plain-text files, one per maṇḍala,
    period-delimited: hymn.verses.ṛṣi.devatā.chandas, with per-verse ranges in parentheses where
    a hymn's devatā/chandas changes mid-hymn. I counted it: 1028/1028 hymns, exactly matching the
    canonical per-maṇḍala hymn counts (191/43/62/58/87/75/104/103/114/191); zero empty ṛṣi,
    devatā or chandas fields; 336 distinct ṛṣi strings, 212 devatā labels, 38 chandas labels.
    One malformed row (RV 8.31, ṛṣi field missing → 4 fields not 5) and the verse-count column
    sums to 10534 against the canonical 10552. Both are logged below as known defects, not
    blockers. This is the held-out validation set the build plan asked for, and nothing else
    found in this sweep supplies ṛṣi or Anukramaṇī-chandas at all.
  best_source_per_priority:
    1_anukramani: "mahesh-ak/WSC2023 — the only machine-readable Anukramaṇī found. No substitute exists."
    2_rv_samhita_accented: >
      VedaWeb vedaweb-data rigveda/versions/eichler.csv — accented Devanāgarī Unicode,
      10552/10552 stanzas, 175,308 svara marks (U+0951/U+0952). CC-BY-NC-SA-4.0.
      Same text upstream at detlef108.de as HTML. For accented transliteration instead:
      aufrecht.csv (126,122 vowel-acutes) or vnh.csv (128,554).
    3_dcs: >
      github.com/OliverHellwig/sanskrit, dcs/data/conllu/files/<Text>/ — CoNLL-U, CC-BY-4.0,
      ~1.1 GB, 270 texts, no API. Broad Vedic coverage but ZERO accent anywhere (7.16M chars
      scanned, no combining marks at all). Morphology/sandhi-split layer only.
    4_vedaweb: >
      Data on GitHub (VedaWebProject/vedaweb-data) — TEI-P5 + CSV + JSON, fully fetchable.
      The web platform and REST API at vedaweb.uni-koeln.de return HTTP 418 to every
      non-browser client, so the API is NOT scriptable. Use the GitHub mirror.
    5_titus_sarit: >
      TITUS holds the deepest Vedic collection of anything found — including ACCENTED
      DEVANĀGARĪ UNICODE for the Taittirīya Saṃhitā, Vājasaneyi Saṃhitā, Ṛgveda and
      Atharvaveda, which exists nowhere else openly. Working index:
      titus.uni-frankfurt.de/texte/texte2.htm#ved. But it is ALL-RIGHTS-RESERVED: "No parts of
      this document may be republished in any form without prior permission by the copyright
      holder." GRETIL's "restricted download / proprietary format" label is misleading — the
      format is fine, the LICENCE is the blocker.
      SARIT holds ZERO Vedic material (confirmed by enumerating all 88 XML files in
      sarit/SARIT-corpus). Drop it from the Vedic packets.
    6_padapatha: >
      RV: accented padapāṭha exists at detlef108.de (RV-with-Padapatha-D-UTF8.html, Devanāgarī,
      406,301 svara marks; and RV-Padapatha-TA3-paada-UTF8.html, transliteration, 131,823
      vowel-acutes). GRETIL's and VedaWeb's RV padapāṭha are UNACCENTED — verified, 0 marks.
      Taittirīya: KYVeda/texts TS-Padam covers all 7 kāṇḍas in Baraha .BRH (accent preserved as
      ASCII q/# markers) + .docx. TITUS also holds an RV padapāṭha (all-rights-reserved).
      No machine-readable padapāṭha found for any other śākhā.
  still_unavailable:
    - >
      Kātyāyana's SARVĀNUKRAMAṆĪ itself as typed text — CONFIRMED NOT-FOUND across GRETIL,
      sanskritdocuments, TITUS, Wikisource, Muktabodha and vedicreserve. The only
      machine-readable form in existence is the OCR layer of Macdonell's 1886 Anecdota
      Oxoniensia scan on archive.org, and it is dirty. Śaunaka's Anuvākānukramaṇī: same, worse.
      The WSC2023 dataset is therefore a hand-annotation of a text that itself has no clean
      digital edition — which is worth knowing before treating it as ground truth.
    - "Sāmaveda in DCS — absent entirely. Kauthuma SV exists at GRETIL but unaccented and word-boundary-mangled."
    - "Vājasaneyi Kāṇva Saṃhitā — no machine-readable text found anywhere in this sweep."
    - >
      Accented machine-readable text for any Yajurveda śākhā under an OPEN licence. It exists
      at TITUS in accented Devanāgarī Unicode (TS, VS) — but all-rights-reserved. The only
      openly-obtainable route is the KYVeda Baraha files, Taittirīya only, licence unstated.
    - >
      A prātiśākhya in machine-readable form under an open licence. GRETIL's section headed
      "Pratisakhyas" contains only the Nirukta and the Ṛgvidhāna — no prātiśākhya at all.
      TITUS has the Taittirīya-Prātiśākhya, all-rights-reserved. Packet P2-b starts from there.
    - >
      Śatapatha Brāhmaṇa kāṇḍa 12 — absent from GRETIL (its index says so) and absent from DCS.
      Neither source is complete and combining them does not close it.
    - "No open machine-readable Taittirīya Saṃhitā / Brāhmaṇa / Āraṇyaka, Vājasaneyi Saṃhitā, or Kāṭhaka Saṃhitā at GRETIL — all marked 'restricted / proprietary format from TITUS'."
  license_flag_for_BV: >
    The accented Ṛgveda (eichler / aufrecht / vnh / padapatha via VedaWeb, and GRETIL's Vedic
    corpus generally) is CC-BY-NC-SA-4.0. That is NonCommercial and is NOT compatible with this
    repo's CC-BY-SA-4.0 for redistribution. DCS is CC-BY-4.0 and is clean. WSC2023 is Apache-2.0
    and is clean. Decide whether accented RV text is redistributed or link-only.

