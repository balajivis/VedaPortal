    Nambudiri gāna WAS captured; it does not mean the tradition is documented.
    ALSO WORTH NOTING about the Tamil material: the Paravastu items are largely
    RITUAL-OCCASION sāmāni (prokṣaṇa, udaka-śānti, vivāha, upanayana) plus teaching
