  url: http://gretil.sub.uni-goettingen.de/gretil/1_sanskr/1_veda/1_sam/avs_acu.htm
  script: transliteration
  svara_source?: >-
    yes, and measured carefully because of the known GRETIL false-positive trap. Under NFD:
    85,649 combining acute total, of which 6,684 belong to ś — leaving 78,965 genuine udātta —
    plus 1,248 combining grave (svarita). The file's own header legend documents the scheme
    (`e udatta é`, `e svarita è`, `long u udatta ū́`, `voc. r udatta ŕ̥`). NOT Devanāgarī:
    zero characters in U+0900–U+097F, ~490k Latin.
  svara_verified?: pending — BV
  text_layer: unicode
  license: copyright-link-only
  status: found-complete
  where_i_looked: ""
  notes: >-
    SECOND WITNESS for the Śaunaka Saṃhitā, and a genuinely complementary one: the VedicReserve
    record above is accented legacy-font DEVANĀGARĪ, this is accented Unicode ROMAN. Two
    independent encodings of the same accented text can validate each other mark-for-mark —
    which is worth more than either alone for a project whose whole point is svara fidelity.
    THE TRAP, STATED FOR THE RECORD: a naive U+0301 count on GRETIL's Ṛgveda returns thousands
    of hits that are all decomposed ś, and P0-a measured that text at zero real accents. Here
    the U+0301s ARE accents. The same codepoint, opposite verdicts. Normalise, then check what
    the mark sits on — do not count blind, and do not generalise either result to the other.
    LICENCE — quoted verbatim from the file: "COPYRIGHT AND TERMS OF USAGE AS FOR SOURCE FILE."
    It grants nothing and defers to TITUS, which is all-rights-reserved. license recorded as
    copyright-link-only, NOT public-domain: unlike a typeset PD text, this is a transliteration
    with editorial collation across two printed editions and four named revisers, which is the
    "value is genuinely editorial" case the correction told me to flag rather than adjudicate.
    LINK ONLY. Do not ingest pending the human-level permission question.
