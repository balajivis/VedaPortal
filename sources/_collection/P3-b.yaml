      running heads all legible). Also `rigvedabrahmana00keitgoog` (586, good);
      `flln_harvard-oriental-series-vol.-25-ed-by-c.-r.-lanman-rig-ved-aitareya-kaushitaki-b`
      (589, good but a non-English OCR engine yields 'Adhyàyas', 'Paficika');
      `ryfa-rigveda-brahmanas-the-aitareya-and-kausitaki-trans` (Motilal 1971 reprint,
      page-for-page identical pagination — safe to cite from);
      `in.gov.ignca.23771` (fair to poor, heavy speckle).
      Citation form: pañcikā.khaṇḍa primary with continuous adhyāya in parentheses
      ('i. 12 (iii. 1).', 'viii. 1 (xxxvi. 1).'); for the KB, flat adhyāya.khaṇḍa in
      lowercase roman ('KB. xxix. 4').
