apparatus:
  pratishakhya: { status: sourced, note: "FULLY SOURCED. sanskritweb tp-comb.pdf = Whitney's complete text + translation, all 24 adhyayas. Tests as chars=44731 devanagari=0 svara=0 — the LEGACY-FONT case, not a scan: remap, do not OCR. See findings for what it settles." }
