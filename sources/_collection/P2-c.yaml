  - holding_id: ngmcp-hamburg/indic-title-index
    institution: Universität Hamburg, Asien-Afrika-Institut (Nepalese-German Manuscript Cataloguing Project)
    collection: NGMCP Indic manuscript index (`ngmcpdocument`) — catalogue of the NGMPP microfilms
    country: Germany (describing manuscripts physically in Nepal)
    catalogue_url: https://catalogue.ngmcp.uni-hamburg.de/
    machine_queryable: solr
    query_endpoint: https://catalogue.ngmcp.uni-hamburg.de/servlets/solr/find?q=*:*&defType=lucene&wt=json&rows=100
    query_verified: >
      Verified 2026-08-01 by direct HTTP. The MyCoRe Solr proxy is open and unauthenticated
      and returns raw Solr JSON (`wt=json`) or XML (`XSL.Style=xml`). CRITICAL PARAMETER:
      `defType=lucene` must be passed — without it the default edismax handler silently
      returns numFound=0 for `*:*` and for all fielded queries, which looks like an empty
      index and is not. With it: numFound=117406. Faceting works
      (`facet=true&facet.field=subject_Label`). Field-scoped and wildcard queries work
      (`title:vajasaneyi*` → 585). The Solr admin handlers ARE restricted — /admin/luke
      returns HTTP 403 MCRSolrQueryHandler restricted — so field discovery must be done by
      sampling documents, not by introspection.
      SECOND ACCESS PATH, also verified: MyCoRe REST API.
        https://catalogue.ngmcp.uni-hamburg.de/api/v1/objects?format=json
          → {"numFound": 175818, "mycoreobjects":[{"ID":...,"href":...}, ...]}
        https://catalogue.ngmcp.uni-hamburg.de/api/v1/objects/aaingmcp_ngmcpdocument_00029627
          → full MyCoRe object XML (all metadata fields, not just the indexed subset)
        https://catalogue.ngmcp.uni-hamburg.de/api/v1/classifications?format=json
          → the controlled vocabularies (subject, script, language, material)
      This is a complete bulk-harvest path: enumerate IDs from /api/v1/objects, fetch each.
      THIRD AND EASIEST PATH — CSV EXPORT, verified end to end 2026-08-01. The Solr proxy
      honours `wt=csv` and `cursorMark` deep paging. I downloaded the ENTIRE Vedic subset in
      ONE request — 2,349 rows, 273,145 bytes, HTTP 200:
        https://catalogue.ngmcp.uni-hamburg.de/servlets/solr/find?q=subject_Label:%22Veda%22&defType=lucene&wt=csv&rows=3000&sort=id+asc&fl=id,title,subject_Label,script_Label,language_Label,material_Label,folio_count,microfilm_series,microfilm_reel,microfilm_entry,remarks,link
      Sample rows:
        aaingmcp_ngmcpdocument_00000171,Acchāvākaśāstra,Veda,Devanagari,Sanskrit,not specified,8.0,B,492.0,3.0,,
        aaingmcp_ngmcpdocument_00000629,Adhyāyaśatapāṭha,Veda,Devanagari,Sanskrit,not specified,11.0,A,588.0,19.0,,aaingmcp_ktmscan_00003859
      `cursorMark=*` with `sort=id asc` returns a nextCursorMark, so the full 117,406-record
      index is harvestable the same way without deep-paging limits. This is the answer to
      "is there bulk-downloadable catalogue metadata anywhere": yes, here, today, one request.
      A copy of the 2,349-row CSV was pulled to the scratchpad as verification evidence and
      deliberately NOT written into the repo. Analysed locally, that CSV yields, for the
      subject=Veda subset:
        total folios ............ 150,298  ← the size of the Vedic manuscript pool in Nepal,
                                             counted rather than estimated
        scripts ................. Devanagari 1,963 · Newari 294 · not specified 52 ·
                                  Maithili 23 · Devanagari+Newari 12 · Maithili+Newari 3 ·
                                  Bengali+Devanagari 2
        microfilm series ........ E 895 · A 780 · B 299 · H 122 · G 97 · M 45 · I 30 ·
                                  D 27 · F 24 · T 16 · C 9 · R 2 · S 1 · X 1 · P 1
        scan-record links ....... none 2,159 · ktmscan 185 · hhscan 5
      The series breakdown matters for the images question: the ONE series that has been
      fully digitised (X, handed to the National Archives in March 2024) contains exactly
      ONE record in this Vedic subset. The 2024 digitisation, welcome as it is, moved the
      needle on Vedic material by a single manuscript.
      ACCESS GOTCHA: the host serves an "abuse-deny" interstitial to default curl. A normal
      browser User-Agent is required. It also presents an incomplete TLS chain, so some
      clients need the intermediate supplied (or `-k`). Neither is an auth wall; both will
      silently break a naive harvester.
    record_count: >
      117,406 Indic manuscript records (`objectType:ngmcpdocument`).
      175,818 objects total across all types, including `hhscan` / `ktmscan` scan-location
