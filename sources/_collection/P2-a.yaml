  script: null
  svara_source?: n/a — audio
  svara_verified?: pending — BV
  text_layer: null
  license: copyright-link-only
  status: found-complete
  where_i_looked: >
    vedicheritage.gov.in — the `-2` page, with media paths probed by direct HTTP rather
    than read off the rendered HTML. See `summary.ignca_portal_correction`. The non-`-2`
    page `/jaiminiya-samhita/` is a navigation stub with no media, which is what misled
