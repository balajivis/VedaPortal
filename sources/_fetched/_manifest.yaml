    coverage: "ashtaka 1"
    bytes: 721869
    pages: 0
    text_layer: unicode
    measured: "whole file: chars=720288 latin=457524 devanagari=0"
    sha256: "998b0279d7c8782a302d2343f8b126f2849e9947fb7f3747cfd9c72d849e800e"
    license: public-domain
    notes: "ORIGINAL Trubner edition, NOT the reprint already held. Three differences that matter, all measured: (1) Wilson's own footnotes are on the page with the verses, and they carry his verbatim citations of Sayana (405 'Sayana' occurrences in vols 1-3 vs 369 in the held reprint) - the held Bhagavat/Bangalore reprint moved all notes to the end of each volume ('I have given the translation first and the notes at the end', Prefatory Note, Poona, 4 August 1925) and dropped diacritics ('The diacritical marks I could not make use of'). (2) It is printed in ASHTAKA order with running heads 'FIRST ASHTAKA - FIRST ADHYAYA' and marginal 'Varga v.' labels: 416 varga labels OCR'd in vols 1-3 against 2 in the held set, and 141 ashtaka running heads in vol 1 against 14. (3) OCR is measurably cleaner on proper nouns - see f3_findings.wilson_ocr_comparison. All 8 ashtakas covered across the 6 volumes; verified by running-head extraction."
