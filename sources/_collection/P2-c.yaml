  - holding_id: ignca-vedicheritage/manuscript-union-catalogue
    institution: Indira Gandhi National Centre for the Arts (IGNCA), Vedic Heritage Portal
    collection: Vedic manuscripts union catalogue — pan-Indian, aggregating many institutions
    country: India
    catalogue_url: https://vedicheritage.gov.in/
    machine_queryable: api  # undocumented POST endpoint, verified working
    query_endpoint: https://vedicheritage.gov.in/wp-content/themes/vedic/fetch.php
    query_verified: >
      Verified independently by me on 2026-08-01, not taken on report. This is an
      undocumented WordPress theme file, not a published API, and it is wide open.
        POST https://vedicheritage.gov.in/wp-content/themes/vedic/fetch.php
        body: page={1..657}&query={free text}
        → HTTP 200, 34,256 bytes for page 1, "<label>Total Records - 65672</label>" plus a
          100-row HTML table.
      COLUMNS: Title · Author(s) · Language · Script · Folios · Account No. · Material ·
      Publisher (= holding institution) · Place · Title in Hindi · Status (Complete/Incomplete).
      First two rows, verbatim:
        Agniṣṭomasāmaṛcā | Sanskrit | Devanāgarī | 5 folios | Ac. No. 7148 / R(II) 1212 |
          Paper | Vaidika Samshodhana Mandala | Pune | अग्निष्टोमसामऋचा | Complete
        Agniṣṭomasāma | Sanskrit | Devanāgarī | Folio 8 ; l 9, w 36 | Paper |
          Saraswati Bhawan Library | Varanasi | अग्निष्टोमसाम | Incomplete
      CRITICAL GOTCHA, verified by me: **it must be POST**. A GET with page=200 silently
      ignores the page parameter and returns page 1 with the same total. A harvester written
      with GET will loop 657 times over the same 100 rows and look like it worked.
      Offset = (page-1)*100; 657 pages covers the whole catalogue.
      Free-text filtering works: query=rigveda → "Total Records - 146".
      NEGATIVE: no manuscript images (/manuscripts/ → 404). wp-json exposes 161 routes but no
      custom manuscript route — only Contact Form 7, events-manager, post-smtp and wp/v2 core.
    record_count: 65,672
    vedic_material: >
      ALL OF IT. This is the only catalogue found in this packet that is Vedic-specific by
      construction rather than by filtering a general Indic catalogue — 65,672 records, every
      one of them a Vedic manuscript, drawn from institutions across India.
      Query counts I ran myself:
        saṃhitā 7,038 · brāhmaṇa 3,098 · yajurveda 1,655 · taittirīya 1,405 · āraṇyaka 869 ·
        samaveda 715 · "prat" (prātiśākhya etc.) 596 · atharvaveda 221 · rigveda 146
      For comparison: NGMCP's entire Vedic subset is 2,349 and Qalamos's "Veda" class is
      1,151. This single endpoint is roughly 28× the former.
      Scripts are genuinely pan-Indian — Devanāgarī, Telugu, Grantha, Nandinagari, Oriya,
      Bengali — which matters, because a Telugu-script Vedic manuscript is a different
      transmission line from a Devanāgarī one.
    shakha_stated: >
      YES, AT SCALE, IN THE TITLE FIELD — and this is the single most important qualification
      to FINDING-1 in this packet. Counts from my own queries:
        taittirīya 1,405 · kāṇva 888 (⚠ over-counts: "Kāṇva" is also a ṛṣi name, so this
        figure certainly includes non-śākhā matches) · sakala 62 · madhyandina 58 ·
        jaiminiya 25 · kauthuma 6 · "shakha" 1 · **paippalada 0**
      ⚠️ CORRECTION — MY OWN THIRD FALSE NEGATIVE, CAUGHT ON RE-PROBE. I first ran
      query=paippalada and query=Paippalāda, got EMPTY responses, and was about to record
      "the Paippalāda is absent from India's Vedic union catalogue" as a finding. It is not
      absent. The search does not match those strings; query=**Paippal** returns 3, and
      query=**sakha** returns 157 (the endpoint normalises sakha → śākhā but does not
      stem "paippalada"). Truncating the query stem was the whole fix.
      What is actually there, verified:
        "Atharvaveda ( Paippalad śākhā)" — ORIYA script, PALM LEAF, Odisha.
          ⚠️ The Publisher field for this row is a PRIVATE INDIVIDUAL with a district-level
          location. Per this packet's hard constraint the holder and the location are NOT
          recorded here or anywhere downstream. What is recorded: ONE Paippalāda Saṃhitā
          manuscript, privately held, in Odisha, in Oriya script on palm leaf.
        "Paippalādopaniṣad ; Bṛhajjābālopani…" — Devanagari, paper, Sanskrit College, Kolkata
        "Paippalādopaniṣad" — Devanagari, paper, The Asiatic Society, Kolkata
      This matches Kritisampada exactly, including the same single privately-held Odisha
      record — the two catalogues agree, which raises confidence in both.
      THE REAL FINDING IS STILL STARK, just differently: India's Vedic union catalogue of
      65,672 records contains exactly ONE Paippalāda Saṃhitā manuscript, and it is in a
      private collection. Meanwhile the Odisha State Museum's own 1973 printed catalogue
      states it holds TEN. The gap between what is catalogued nationally and what is
      catalogued locally in print is, for this recension, a factor of ten.
      METHOD NOTE for anyone querying this endpoint: use SHORT STEMS. Full diacritic forms
      return nothing, and an empty response looks identical to a zero result.
    images_digitised: none — this is a metadata catalogue only
    images_public: no
    image_access_path: none; records give holding institution and accession number for physical follow-up
    access_requirements: none for the catalogue
    license: copyright-link-only
    image_license: not-applicable — no images
    license_notice_verbatim: >
      From https://vedicheritage.gov.in/copyright-policy/ : "The contents of this website can
      not be reproduced partially or fully, without written permission from Indira Gandhi
      National Center for the Arts or the contributor."
      No GODL, no Creative Commons. This is the most restrictive notice attached to the most
      valuable dataset in the packet. Bare catalogue facts (title, folio count, accession
      number, holding institution) are not copyrightable subject matter, but the compilation
      claim is asserted and IGNCA is the natural body to ASK — they are a public institution
      whose mission is exactly this, and a permission request is far cheaper than a lawsuit.
      **Recommendation: write to IGNCA before harvesting, not after.**
    status: found-complete
    notes: >
      ⚠️ PRIVACY CONSTRAINT — READ BEFORE INGESTING. I sampled the "Publisher" column across
      9 pages spread through the catalogue (900 rows). It is overwhelmingly INSTITUTIONAL:
      S.B.L. Varanasi 100 · Government Oriental Manuscripts Library Chennai 81 · Saraswati
      Bhawan Library Varanasi 60 · Bharathpura Library Patna 56 · SRSRI Jammu 40 · Shri Ranbir
      Sanskrit Research Institute 28 · BORI Pune 24 · Deccan College Pune 18 · Vaidika
      Samshodhana Mandala Pune 14 · Patna University 14 · Scindia Oriental Institute Ujjain 11
      · Tilak Maharashtra Vidyapeeth 10 · T.M.S.S.M. Library Thanjavur 10 · Anandashram
      Sanstha Pune 13 · RORI Alwar · GOML Chennai.
      BUT a minority of rows carry what appear to be PERSONAL NAMES paired with a
      city-or-district location, rather than an institution. I have deliberately NOT recorded
      any of those values here, and neither should any downstream file. Harvesting this
      catalogue and retaining that column would assemble exactly the person-level
      "who holds what manuscript, and where" resource this packet is forbidden to create —
      and the compilation is the harm even though each row is individually public.
      **If this is ingested, the Publisher/Place columns must be institution-filtered on the
      way in, and unmatched rows kept without custodian or location.** Named donor collections
      held INSIDE an institution (e.g. "Deccan College (Dixit Collection)",
      "V.S.M. (Janorkar coll.)") are institutional and are fine.
      COVERAGE NOTE: this one endpoint is effectively a union catalogue over most of the
      Indian institutional targets in this packet's brief — BORI Pune, GOML Chennai,
      T.M.S.S.M. (Sarasvati Mahal) Thanjavur, RORI Alwar, Ranbir/SRSRI Jammu, Scindia Ujjain,
      Saraswati Bhawan Varanasi. Querying it is cheaper and more complete than approaching
      those institutions one at a time.
      Attribution owed: IGNCA Vedic Heritage Portal, and the contributing institutions named
      per record.
    date_logged: 2026-08-01

