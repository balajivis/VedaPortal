        2. LICENCE IS KNOWN NOW: the E-Text Library is CC BY-NC 4.0, requiring credit to
           Muktabodha Indological Research Institute. Texts with catalogue numbers I000##
           were produced under an IFP agreement and require credit to both. The Gokarna
           Vedic Collection is far more restrictive — "©2014, All Rights Reserved", view
           online or download for private study only, no redistribution. CC BY-NC is
           NOT compatible with unrestricted reuse; treat as link-only for anything the
           project would publish.
        3. THE DATA IS MEANT TO BE OPEN AND CURRENTLY IS NOT. Their About page advertises
           a public data repository with a snapshot date of 2026-07-22 and web app
           v0.10.1, and links it. Both links 404. This looks like a migration in progress
           ("the legacy Digital Library site will remain online while we gradually migrate
           the library's other collections to this new infrastructure"), not a policy of
           closure. WORTH RE-CHECKING IN A FEW MONTHS — if muktalib-v2-data goes public,
           the whole catalogue becomes bulk-queryable at once.
        4. CROSS-PACKET: the DL holds a GOKARNA VEDIC COLLECTION of manuscript PDFs and an
           IFP Paper Transcripts collection. Neither is Mīmāṃsā, both are squarely P2-c's
           business. Flagging rather than pursuing.
      I did NOT attempt to pass the Turnstile. Rule 11 asks for probing behind a JS front
      end for APIs, endpoints and predictable URL patterns; it does not ask for defeating
      an access control the operator has deliberately placed. The 302s establish that this
      gate is a real access control, not a rendering artefact.
      PRIOR PROBABILITY REMAINS LOW that Muktabodha holds Pūrva-Mīmāṃsā at all — the
      collection is Śaiva and Tantric by design and its recent work is Śaiva (75 Śaiva
      texts with IFP; a new Vīraśaiva collection).
      RECOMMENDATION UNCHANGED: ten minutes in a browser, or one email to
      info@muktabodha.org. Do not build automation against this.
