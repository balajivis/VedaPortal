  # -------------------------------------------------------------------------
  # THE CITATION CONVENTION — the finding this packet was mainly for
  # -------------------------------------------------------------------------
  citation_convention:
    the_problem_as_posed: >
      The project's notes record the same Aitareya Brāhmaṇa passage cited as VIII.21,
      as 8.23, and as 8.4.7–9, and infer three incompatible conventions.

    what_is_actually_true: >
      The three citations are not in conflict and they are not three conventions.
      They are TWO conventions, and the first two citations are the first and last
      khaṇḍa of the span the third names in full. Verified mechanically:
      TITUS units 278, 279, 280 — which are pañcikā 8, khaṇḍas 21, 22, 23, and
      simultaneously adhyāya 39 (= 4th adhyāya of pañcikā 8), khaṇḍas 7, 8, 9 —
      carry the aindra mahābhiṣeka king-list: 'etena ha vā aindreṇa mahābhiṣekeṇa
      Turaḥ Kāvaṣeyo Janamejayam Pārikṣitam abhiṣiṣeca' (278), Udamaya Ātreya and
      Aṅga (279), 'Dīrghatamā Māmateyo Bharataṃ Dauḥṣantim abhiṣiṣeca' (280).
      So VIII.21 = the first of them, 8.23 = the last of them, 8.4.7–9 = all three.

    the_conventions_actually_in_use:
      A_pancika_khanda:
        form: "pañcikā . khaṇḍa-counted-continuously-within-the-pañcikā (1–30, 1–41, …)"
        example: "AB 8.21 · AB VIII.21 · AB 7.13–18 (Śunaḥśepa)"
        used_by: >
          Haug 1863 and Aufrecht 1879, hence TITUS's 'Paragraph' numbers, hence
          Sanskrit Wikisource (which prints ॥8.21॥-style markers), hence most
          19th–20th c. Indological citation and most secondary literature.
      B_pancika_adhyaya_khanda:
        form: "pañcikā . adhyāya-within-pañcikā (1–5) . khaṇḍa-within-adhyāya"
        example: "AB 8.4.7–9 · AB 7.3.1–6 (Śunaḥśepa)"
        used_by: >
          The Sanskrit colophons themselves — Wikisource's pañcikā 8 closes with
          'इत्यष्टमपञ्चिकायां पञ्चमोऽध्यायः', 'thus the fifth adhyāya in the eighth
          pañcikā' — and the Indian editions that follow them (Sāyaṇa-bhāṣya editions,
          Ānandāśrama). This is the convention native to the text.
      C_continuous_adhyaya:
        form: "adhyāya numbered continuously 1–40 . khaṇḍa-within-adhyāya"
        example: "AB 39.7–9 · AB 33.1–6 (Śunaḥśepa)"
        used_by: >
          Aufrecht's editorial adhyāya labels (TITUS reproduces them verbatim:
          'adʰyāya 39, kʰaṇḍaḥ 1-9'), Keith HOS 25's chapter numbering, and the
          Wikisource editorial notes ('अध्याय ३५ खण्डः १-८'). Note this is NOT a
          separate numbering of khaṇḍas — only of adhyāyas. B and C differ solely in
          whether the adhyāya is numbered 1–5 within its pañcikā or 1–40 across the text.
      D_continuous_khanda:
        form: "khaṇḍa numbered continuously 1–285 across the whole text"
        example: "AB 278–280"
        used_by: >
          TITUS's 'Part No.' only. Not a traditional convention. It is an artefact of
          the file numbering — but it is exact, and it is the only 1-level address that
          is unambiguous, so it is useful as an internal join key.

    what_each_edition_actually_uses:
      note: "Read off title pages, running heads, colophons and cross-references in the scans themselves."
      rows:
        - "Haug 1863 vol. I (Sanskrit) — A in the running heads ('ऐतरेयब्राह्मणे चतुर्थपंचिका १४, १५, १६'); adhyāya only in colophons"
        - "Haug 1863 vol. II (translation) — **A, and only A**. Every cross-reference is 2-level: '(see 2,31)', '(see 3,33-38)', 'See 1,1-5.', '(This paragraph is identical with 5, 27.)'. No 3-number AB citation occurs anywhere in the volume"
        - "Aufrecht 1879 — **A and B printed side by side at every khaṇḍa**: Latin numeral = khaṇḍa-within-pañcikā, Devanāgarī numeral = khaṇḍa-within-adhyāya. Running heads carry both (verso 'Pancika 2, 17. 18.' / recto 'Adhyaya 7, 8. 8, 1.'). Sentences numbered within khaṇḍa, so Aufrecht's own reference form is pañcikā.khaṇḍa.sentence, and his Wortverzeichniss uses it ('atirātra 3, 41, 2')"
        - "Keith HOS 25 1920 — **A primary, C in parentheses**: 'i. 12 (iii. 1).' · 'ii. 1 (vi. 1).' · 'viii. 1 (xxxvi. 1).' · 'vii. 34 (xxxv. 8).' Running heads carry only A"
        - "Keith on the Kauṣītaki — flat adhyāya.khaṇḍa, lowercase roman ('KB. xxix. 4'). No pañcikā tier exists in the KB"
        - "Keith, Aitareya Āraṇyaka 1909 — 3-level āraṇyaka, adhyāya, khaṇḍa, arabic. Running heads 'AITAREYA ARANYAKA I, 1, 1-' … '-III, 2, 4'"
        - "Keith, Śāṅkhāyana Āraṇyaka 1908 — 2-level, adhyāya in lowercase roman ('i, 1', 'ii, 1-17', 'xii, 20')"
        - "Ānandāśrama AiĀ (ASS 38) — 3-level, '[ऐ॰ आ॰ २ अ॰ ४ ख॰ २]'"
        - "Rājendralāla Mitra, AiĀ, Bibl. Ind. 1876 — **4-level**: āraṇyaka·adhyāya·khaṇḍa·ṛc ('१आ० । ४अ० । २क० । ६-८ऋ०')"
        - "Sāmaśramī, AB with Sāyaṇa, Bibl. Ind. — pañcikā + continuous adhyāya 1–40"
        - "TITUS — A as 'Paragraph', plus C in the adhyāya labels, plus D as the file/Part number"
        - "GRETIL Kauṣītaki — adhyāya,khaṇḍa.sentence. GRETIL Śāṅkhāyana Āraṇyaka — adhyāya,khaṇḍa"
    keiths_own_view: >
      Worth recording because it licenses a decision. Keith, HOS 25, Introd. §3, p. 36:
      "Nor have we any idea when the division of the text into Pañcikās was made; it is
      clearly not a natural division in any way, as the text does not fall into sets of
      five Adhyāyas, and **it is unfortunate that the Pañcikā division should have become
      usual in citations.**" Footnote: "As, however, it is now established, the citation
      by Adhyāya in Lévi's *Doctrine du sacrifice dans les Brāhmaṇas* is to be regretted."
      Keith disliked the pañcikā scheme, used it anyway because it was standard, and
      regretted that Lévi had done otherwise. Note also his point that a pañcikā does
      NOT contain five adhyāyas in any meaningful sense — the name is a misnomer he
      distrusts, even though the count happens to be five.
    RECOMMENDATION:
      store: >
        **Store the full three-level B address — pañcikā.adhyāya.khaṇḍa — as the
        canonical key.** It is native to the colophons, it is total, and it is the only
        form that is unambiguous at every depth. A is ambiguous against B truncated to
        two levels ('AB 8.4' = khaṇḍa 4 of pañcikā 8 under A, but the whole of adhyāya
        39 under B), and that collision is the actual origin of the confusion in the
        project's notes. Choosing A does not remove it; choosing B does.
      display_and_accept: >
        **Display and accept A — pañcikā.khaṇḍa — as the primary human citation form,
        and accept C and D as aliases.** This is not a compromise, it is what the
        evidence requires: Haug's translation uses A exclusively, Keith's translation
        leads with A, and essentially all secondary literature cites A. A reader who
        cannot look up 'AB 7.13–18' in Keith will not trust the node.
      why_this_is_safe: >
        The mapping is not reconstructed, it is **printed**. Aufrecht sets both numerals
        at the end of every khaṇḍa, and Keith prints C in parentheses after A on every
        section head. Cumulative khaṇḍa offsets per pañcikā are 0, 30, 71, 121, 153,
        187, 223, 257; continuous adhyāya = 5·(pañcikā−1) + adhyāya-within-pañcikā.
        Everything converts arithmetically from the concordance table below, which this
        packet verified against four independent witnesses. Generate A, C and D; never
        store them as independent truth.
      for_the_aranyakas: >
        Aitareya Āraṇyaka: **āraṇyaka.adhyāya.khaṇḍa**, which is Keith's form and
        matches both our witnesses — but see the Aitareya Upaniṣad entry: AiĀ II.5 and
        II.6 have NO khaṇḍas, so the schema must permit a two-level address at those
        loci rather than inventing a '.1'. Mitra 1876 adds a fourth level (ṛc) for
        verse-bearing sections; accept it as an extension, do not require it.
        Śāṅkhāyana Āraṇyaka: **adhyāya.khaṇḍa**, Keith's form, matching GRETIL.
        Kauṣītaki Brāhmaṇa: **adhyāya.khaṇḍa** — but read the khaṇḍa warning under
        structures_verified before joining anything to it.

