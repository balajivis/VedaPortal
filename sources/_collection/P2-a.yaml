    GRETIL (no Jaiminīya Saṃhitā); TITUS Vedic index (JB and JUB present, Saṃhitā ABSENT);
    sanskritweb (Kauthuma gānas only); vedicheritage.gov.in Jaiminīya Saṃhitā page
    (navigation only, no text or media);
    Google Books API, Exotic India, Bing and DuckDuckGo — all returned nothing useful for
    this title, which is why the archive.org identifier search was the one that worked.
  notes: >
    THE COORDINATOR'S UNRESOLVED LEAD IS CLOSED, and it closed better than asked: the
    2-volume Kerala-tradition critical edition not only exists with full bibliographic
    detail, it is FREE. I had logged it as un-run-down after Google Books, Open Library,
    DuckDuckGo, Bing, academia.edu and Exotic India all failed; the archive.org
    advancedsearch API found it in one query. Same lesson as `the_search_lesson`.
    THE FINDING THAT MATTERS MOST, and I did not expect it: THE EDITION PRINTS THE TEXT IN
    TWO SCRIPTS. Page 40 sets section 32 in DEVANĀGARĪ and section 33 in MALAYALAM, running
    consecutively. That is not decoration — the Nambudiri transmission of the Jaiminīya
    Sāmaveda is carried in Malayalam script, and this edition preserves that transmission
    rather than silently normalising it into Devanāgarī. For a project organised around
    śākhā fidelity this is exactly the kind of thing that must not be flattened on ingest:
    `script: devanagari-unicode` above is INCOMPLETE and is flagged here rather than
    quietly recorded. The schema's `script` field has no way to say "Devanāgarī AND
    Malayalam, both load-bearing". The merge pass should decide whether `script` becomes
    a list.
    THIS IS ALSO THE TEXT THAT PAIRS WITH THE RECORDING TARGET. It is the Kerala tradition,
    it covers the Candrasāma portion, and it is the printed counterpart to precisely the
    Nambudiri gāna that this packet identifies as unrecorded.
    LICENCE, per binding rule 9: the copyright page carries "© National Mission for
    Manuscripts, New Delhi" and "All rights reserved, No part of this publication may be
    reproduced or transmitted in any form or by any means…" — recorded verbatim as the
    rule requires. That notice does not attach to the mūla text, which is ancient and
    public domain; typesetting it creates no new copyright. What IS Ravindran's and NMM's
    is the introduction, editorial matter and any apparatus. Two objects, one file.
    FLAG, NOT ADJUDICATED: if the volumes turn out to involve manuscript collation and
    conjectural emendation — plausible for an NMM Prakāśikā edition drawn from Kerala
    manuscripts — this moves toward rule 9's genuine critical-edition edge case. I did not
    read the introduction and cannot say. Someone should, before this is treated as
    straightforwardly reusable.
