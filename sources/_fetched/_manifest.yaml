    text: "OCR text layer, Wilson (Trubner original) volume 1"
    edition: "trans. H. H. Wilson, Rig-Veda Sanhita: a collection of ancient Hindu hymns, 6 vols, London: Trubner and Co., 1850-1888 (vols 5-6 ed. E. B. Cowell and W. F. Webster). ORIGINAL Trubner printing, scanned by Princeton Theological Seminary Library."
