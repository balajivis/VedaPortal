  aitareya_aranyaka_book_3_the_sleeper_node:
    verdict: "Confirmed, and sharper than the project's note assumed."
    what_is_there: >
      AiĀ 3.1.1 opens 'athātaḥ saṃhitāyā upaniṣat' — 'now, then, the upaniṣad of the
      saṃhitā [-pāṭha]'. Book 3 is the Saṃhitopaniṣad: the tradition theorising its own
      recitation. The technical triad is present and is stated as a *choice with
      consequences* at 3.1.3 and 3.1.5:
        nirbhuja        — the continuous/saṃhitā recitation
        pratṛṇṇa        — the broken/pada recitation
        ubhayam antareṇa — 'with both in between', the krama
      and 3.1.3 assigns each an aim: 'annādyakāmo nirbhujaṃ brūyāt, svargakāmaḥ
      pratṛṇṇam, ubhayakāma ubhayam antareṇa.'
    the_precision_that_matters: >
      **The text does not use the words pada or krama.** Zero occurrences of either in
      book 3. It uses the older nirbhuja / pratṛṇṇa / ubhayam-antareṇa terminology.
      Any search of this corpus for 'krama' will return nothing and will look like the
      doctrine is absent. It is not absent; it is under different names. This is the
      single most useful thing in the packet for the svara apparatus, and it is exactly
      the kind of vocabulary shear that silently breaks a lexical index.
    the_accent_definition: >
      3.1.5 defines saṃhitā as the interval between the two forms — 'yo 'vakāśaḥ
      pūrvarūpottararūpe antareṇa, yena saṃdhiṃ vivartayati, **yena svarāsvaraṃ
      vijānāti**, yena mātrāmātrāṃ vibhajate, sā saṃhitā' — 'by which one turns the
      juncture, by which one distinguishes accented from unaccented, by which one
      divides mora from mora.' That clause is a direct tradition-internal statement
      that the saṃhitā-pāṭha is where accent is discriminated.
    named_authorities_in_book_3: >
      Māṇḍūkeya (and Hrasva Māṇḍūkeya, Śūravīra Māṇḍūkeya and his son), Mākṣavya,
      Āgastya, Śākalya (and Sthavira Śākalya), Pañcālacaṇḍa, Kauṇṭharavya, Tārkṣya.
      Book 3 is a doxography — it reports named positions and disagreements rather than
      asserting one. That is unusually good for this project's purposes.
    structure: >
      Book 3 = 2 adhyāyas, 6 khaṇḍas each, 12 total. 3.1.1–3.1.6 is the Saṃhitopaniṣad
      proper; 3.2 is the phonetic-class material (sparśa / ūṣman / svara / antaḥsthā)
      and the daivī-vīṇā ~ mānuṣī-vīṇā analogy.
    THE_DOCTRINE_HAS_TWO_INDEPENDENT_WITNESSES: >
      **Śāṅkhāyana Āraṇyaka 7–8 is a second, parallel recension of the same
      Saṃhitopaniṣad**, and it is available complete and machine-readable in the same
      GRETIL file as the rest of the ŚĀ. Verified by counting in the ŚĀ 7–8 span
      (18,916 chars): nirbhuja ×9, pratṛṇṇa ×5, 'ubhayam antareṇa' ×2, 'saṃhitāyā
      upaniṣat' ×1, Māṇḍūkeya ×8, Śākalya ×5, vīṇā ×9. Same doctrine, same technical
      vocabulary, same named authorities — with real divergences worth collating:
      AiĀ has Śūravīra Māṇḍūkeya and his son **Hrasva** Māṇḍūkeya, ŚĀ has Śauravīra
      Māṇḍūkeya and his son **Dīrgha**; AiĀ 3.1.5 carries the svarāsvara clause and the
      ŚĀ parallel does not ('svarāsvar' ×0 in ŚĀ 7–8).
      For the svara apparatus this is the best possible situation: the tradition's own
      theory of its own recitation survives in two recensions that can be set side by
      side, and the difference between them is itself evidence. Neither is accented.
      ŚĀ 7 opens with the same 'ṛtaṃ vadiṣyāmi' śānti as the Aitareya frame; ŚĀ 8 is
      Sthavira Śākalya's prāṇa-vaṃśa, matching AiĀ 3.2.

