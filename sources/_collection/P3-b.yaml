      manifestly late (13 quotes the Bṛhadāraṇyaka 'ātmā vā are draṣṭavyaḥ' formula
      and attributes it to Māṇḍūkeya) · 15 the vaṃśa.
      **The vaṃśa in ŚĀ 15 is primary evidence for the Kauṣītaki/Śāṅkhāyana relation:**
      'guṇākhyāc chāṅkhāyanād asmābhir adhītam | guṇākhyaś śāṅkhāyanaḥ kahoḷāt
      kauṣītakeḥ | kahoḷaḥ kauṣītakir uddālakād āruṇeḥ …' — Śāṅkhāyana is the pupil of
      Kahoḷa Kauṣītaki. The two names are teacher and pupil in one lineage, which is why
      the same texts carry both names. Record that; it does not by itself settle the
      śākhā question.
      Kümmel marks conjectural restorations with a leading '+' (+anujapet, +pratipat) —
      an apparatus, strip or preserve deliberately.
      SINGLE WITNESS. Not on TITUS, not on Wikisource, no Devanāgarī anywhere.
    date_logged: 2026-08-01

