# P3-b — The Ṛgveda's prose layers: Brāhmaṇas and Āraṇyakas
#
# Packet scope: the FOUR surviving prose texts of the Ṛgveda as TEXTS —
#   Aitareya Brāhmaṇa · Kauṣītaki (Śāṅkhāyana) Brāhmaṇa ·
#   Aitareya Āraṇyaka  · Śāṅkhāyana (Kauṣītaki) Āraṇyaka
# plus the exact embedding loci of the two Upaniṣads that live inside the Āraṇyakas.
#
# NOT in scope (owned elsewhere, do not merge from here):
#   P2-b — apparatus tier (Prātiśākhya, Kalpa/Śrauta-sūtra, Nirukta) AND the Sāyaṇa
#          coverage map across the corpus. Where P2-b maps *whether* a Sāyaṇa bhāṣya
#          exists, this packet sources the base texts and records Sāyaṇa editions only
#          as carriers of the mūla text.
#   P2-c — manuscript catalogues.   P3-a — Mīmāṃsā.
#
# ---------------------------------------------------------------------------
# SCHEMA EXTENSION — documented once, per COLLECTION-PROTOCOL.md §1
# ---------------------------------------------------------------------------
# The protocol keys a record on `node_path` (śākhā → layer). That key is not unique
# here, because the Ṛgveda's brāhmaṇa layer holds TWO independent texts and its
# āraṇyaka layer holds two more. Records in this packet are therefore keyed on the
# composite
#         node_path + text
# where `text` is one of: aitareya-brahmana | kaushitaki-brahmana |
# aitareya-aranyaka | shankhayana-aranyaka.
#
# A directory decision is implied and is NOT taken here (rule 8):
# whether `brahmana/` should gain `aitareya/` and `kaushitaki/` subdirectories, and
# `aranyaka/` gain `aitareya/` and `shankhayana/`. Because the filesystem path is the
# Prisma join key, that is a merge-pass decision by one hand. See
# open_questions_for_merge below. All `node_path` values written here are the
# CURRENT paths, which exist on disk today.
#
# Every other protocol field is carried through unchanged. `svara_verified?` is BV's
# field and is absent from this file entirely, per the hand-off seam.
# ===========================================================================

summary:
  date: 2026-08-01
  packet: P3-b
  collector: agent

  headline: >
    All four texts are obtainable, and three of the four are obtainable COMPLETE and
    machine-readable today. The Aitareya Brāhmaṇa exists twice over — complete
    transliterated (TITUS, from Aufrecht 1879, 285 addressable units) and complete
    Devanāgarī (Sanskrit Wikisource, 8 pañcikās) — and the two witnesses agree on
    structure to the khaṇḍa. The Aitareya Āraṇyaka exists complete twice over as well
    (TITUS/Doyama from Keith 1909, carrying Keith's page and line numbers; and
    Sanskrit Wikisource Devanāgarī). The Kauṣītaki Brāhmaṇa exists complete once
    (GRETIL/Tokunaga, 30 adhyāyas, 271 khaṇḍas) and the Śāṅkhāyana Āraṇyaka complete
    once (GRETIL/Kümmel, 15 adhyāyas, 146 khaṇḍas) — both transliterated, both
    single-witness, both resting on modern editions with real editorial judgement in
    them. **The prose is not accented anywhere.** The only svara marks that exist in
    this entire body of material are in the *mantra* material embedded in Aitareya
    Āraṇyaka books 4 and 5 — 92 udātta and 1 svarita mark, all of them in the last
    four files of the TITUS text, none anywhere else in ~940,000 characters sampled.
    Keith says why: the Aitareya Brāhmaṇa "originally was duly accented, but the
    accents have not been preserved by the tradition." Haug, in 1863, reports hearing
    it — the Aitareya recited "quite monotonously, whilst the Brahmanas of the Yajurveda
    are recited with the proper accents." **The Ṛgvedic Brāhmaṇa svara is not
    undigitised. It is extinct.** Two things survive it and both are recorded below: an
    accented Aitareya *Upaniṣad* — prose, 329 svara marks, at exactly the section that
    went on being recited — and 268 khaṇḍa-by-khaṇḍa recitation files of the Kauṣītaki
    Brāhmaṇa on a government server, embedded in modals where no search engine will
    find them.

  the_five_open_questions_this_packet_was_given:
    1_citation_convention: "RESOLVED. Two systems, not three; the three example citations all point at the same passage. Recommendation: store pañcikā.adhyāya.khaṇḍa, display pañcikā.khaṇḍa. Full concordance table below."
    2_khanda_count_285_or_235: "RESOLVED, and the error is explained. 285, on four independent witnesses. 235 is a PAGE NUMBER — the running head of Aufrecht's last text page reads 'Adhyāya 40, 5.   235'."
    3_vedic_heritage_arithmetic: "CONFIRMED, verbatim, and it is not the only error on that portal — its Kauṣītaki khaṇḍa figure (226) matches no witness either. Two independent structural errors."
    4_kaushitaki_shakha: "NOT RESOLVED, correctly. Reported: the Indian print tradition puts it in Bāṣkala on a title page; the critical literature (Keith, Witzel) does not, and treats Kauṣītaka as a sub-school paired with Paiṅgya. Recommended wording supplied. Tier: multi_traditional."
    5_aranyaka_partition: "VERIFIED against Keith 1909. Books I–III core, IV and V appendices. **Book IV = Āśvalāyana, Book V = Śaunaka — not the reverse**, which is the common error (Oldenberg's, which Keith argues down). Keith also denies Mahidāsa's authorship of I–III."

  the_three_things_that_will_bite_downstream:
    - "**The Kauṣītaki khaṇḍa numbers do not align between our Sanskrit and our English.** GRETIL follows Sarma's Kerala recension (272 khaṇḍas); Keith translates Lindner's vulgate (276). Only five khaṇḍas are genuinely absent; the rest is re-bracketing, and it starts at adhyāya 3. Ganga Sagar Rai 1987 prints the concordance table that fixes this. Until it is transcribed, the KB node cannot honestly reach `structured`."
    - "**Aitareya Āraṇyaka II.5 and II.6 have no khaṇḍas.** Keith says so explicitly. A schema that requires uniform three-level depth will invent a '.1' at exactly the locus of the Aitareya Upaniṣad — the most-cited passage in the whole packet. Sanskrit Wikisource already does this."
    - "**AiĀ book 3 never uses the words *pada* or *krama*.** It uses nirbhuja / pratṛṇṇa / ubhayam-antareṇa. Any lexical search for the recitation doctrine will return nothing and look like absence. It is the earliest surviving statement of that doctrine — Keith dates it c. 6th c. BCE, earlier than Yāska and the Prātiśākhyas."

