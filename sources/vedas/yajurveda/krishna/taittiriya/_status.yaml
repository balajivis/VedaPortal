  aranyaka:  { status: sourced, note: "Taittiriya-Aranyaka-Sanskrit.pdf — accented Unicode, 4,090 svara marks per 40pp. NOTE: carries the IDENTICAL stotrasamhita personal-use colophon as the Brahmana and is AES-encrypted; same rule-9 reasoning applies. Embedded texts live HERE: Taittiriya Upanisad = TA 7-9; Mahanarayana Upanisad = TA 10." }
