# P3-a — Mīmāṃsā corpus
#
# Packet scope: Pūrva-Mīmāṃsā as APPARATUS OF METHOD — the sūtra, its bhāṣya, the two
# rival vārttika traditions (Bhāṭṭa / Prābhākara), the technical manuals, and the
# secondary literature that makes the method learnable.
#
# NOT in scope (owned elsewhere): Prātiśākhyas / Kalpa / Nirukta and the Sāyaṇa coverage
# map (P2-b); manuscript catalogues (P2-c); Ṛgvedic Brāhmaṇas and Āraṇyakas (P3-b).
#
# THE FIREWALL, stated once because it governs what was prioritised:
#   The project adopts Mīmāṃsā's METHOD, not its METAPHYSICS. Mīmāṃsā's own theological
#   commitments — apauruṣeyatva (the Veda is authorless), nityatva (eternal), svataḥ-
#   prāmāṇya (intrinsically valid) — are NOT adopted. They are the subject matter of
#   MS 1.1.1–5 and of most of the Ślokavārttika, and that is precisely the part of the
#   literature this packet ranks LOWEST. What is ranked highest is MS 3.3 (viniyoga —
#   how a subsidiary is attached to its principal, i.e. how a reading is fixed) and
#   MS 1.2 (vidhi vs arthavāda). Those are procedure, and procedure is what was sought.
#   Note the irony worth recording: the digitally best-served part of this corpus is the
#   part the project does not want. See summary.the_availability_inversion.
#
# ---------------------------------------------------------------------------
# SCHEMA EXTENSION — documented once, per COLLECTION-PROTOCOL.md §1
# ---------------------------------------------------------------------------
# The protocol record is keyed on `node_path` = śākhā → layer. Mīmāṃsā texts are not
# śākhā-bound: the Mīmāṃsāsūtra is a śāstra ABOUT the whole Veda and belongs to no
# recension. Per the packet brief, `node_path` here is `sources/darshana/mimamsa/<text>`.
#
# Fields DROPPED as inapplicable, with reasons:
#   veda, organization, shakha  — a darśana text has no recension. Forcing one would
#                                 violate rule 7 (attribution doubt never goes silently
#                                 into `shakha`).
#   layer                       — replaced by `tier` below; saṃhitā/brāhmaṇa/āraṇyaka/
#                                 upaniṣad does not apply to śāstra.
#   svara_source?               — these are unaccented prose/verse śāstra. No svara marks
#                                 exist to source. Recording "no" 30 times would be noise;
#                                 recording it once, here, is the honest form.
#   svara_verified?             — BV's field. Per the hand-off seam it is not present in
#                                 this file at all.
#
# Fields ADDED, because partial coverage is the NORM in this literature and the protocol
# has no way to say WHICH PART:
#   tier          mula / bhashya / varttika / subcommentary / manual / lexicon / secondary
#   author        the author of the work, distinct from `edition` (the modern editor)
#   language      sanskrit / english — a translation is a different node from its original
#   coverage      the EXACT sūtra range held. Mandatory. `found-partial` without this is
#                 a useless record: "partial" spans 3% and 97% in this corpus.
#   verified_how  what I actually did to check. Evidence, not claim.
#
# Fields CARRIED THROUGH unchanged: edition, url, script, text_layer, license, status,
# where_i_looked, notes, date_logged.
#
# ---------------------------------------------------------------------------

summary:
  date: 2026-08-01
  packet: P3-a
  collector: agent

  headline: >
    The six-fold ordering is Jaimini, Mīmāṃsāsūtra 3.3.14 — VERIFIED, not taken on trust.
    Every layer of it is obtainable today, free, and in a form you can cite: the sūtra in
    machine-readable IAST, Śabara's bhāṣya on it in machine-readable IAST with page
    concordance to three printed editions, a public-domain English translation of that
    exact passage (Ganganatha Jha, GOS 66, pp. 449–464), Kumārila's Bhāṭṭa expansion of it
    in English (Jha, Bibliotheca Indica, pp. ~1186–1222), and — the surprise of this packet —
    Prabhākara's rival Prābhākara comment on the SAME sūtra, in Sanskrit, downloadable.
    Both sides of the school split are in hand on the one sūtra the project needs most.

  # =========================================================================
  # 1. THE SIX-FOLD ORDERING — the packet's primary deliverable
  # =========================================================================
  six_fold_ordering:

    primary_locus: "Jaimini, Mīmāṃsāsūtra 3.3.14"

    verification_of_the_locus: >
      The brief said "commonly cited around Jaimini 3.3.14 — verify this, do not take it
      on trust." Verified three independent ways, all agreeing:
        (a) GRETIL's Mīmāṃsāsūtra e-text (ed. B.D. Basu, Allahabad 1923–25) carries the
            sūtra under the reference `Jaim_3,3.14`.
        (b) GRETIL's Śābarabhāṣya e-text (ed. Andreas Pohlus, collated against six printed
            editions) carries it under `MS_3,3.14`.
        (c) Ganganatha Jha's English translation places it at Discourse III, Pāda III,
            Adhikaraṇa (7), Sūtra (14) — an entirely separate transmission line (Baroda
            1933, from the Gaekwad Sanskrit text) reaching the same address.
      The citation 3.3.14 is correct. Use it.

    sanskrit_sutra_text: >
      śrutiliṅgavākyaprakaraṇasthānasamākhyānāṃ samavāye pāradaurbalyam arthaviprakarṣāt
    sanskrit_source: "GRETIL sa_jaimini-mImAMsAsUtra.xml, ref Jaim_3,3.14 (IAST, Unicode)"
    sanskrit_note: >
      GRETIL prints it hyphenated (śruti-liṅga-vākya-prakaraṇa-sthāna-samākhyānāṃ) as a
      reading aid. The compound is unhyphenated in the manuscripts and printed editions.
      Both GRETIL's Mīmāṃsāsūtra file and its Śābarabhāṣya file give the same text; the
      Śābarabhāṣya file gives it unhyphenated, and is the better one to quote from.

    literal_gloss: >
      "When śruti, liṅga, vākya, prakaraṇa, sthāna and samākhyā COME TOGETHER [samavāye —
      i.e. bear on one and the same question, and conflict], the LATER IS WEAKER THAN THE
      EARLIER [pāradaurbalyam], BECAUSE OF INCREASING REMOTENESS FROM THE MEANING
      [arthaviprakarṣāt]."

    the_ratio_in_one_line: >
      arthaviprakarṣāt — "because of remoteness from the objective." This is the WHOLE
      justification, and it is a single reason applied six times, not six ad-hoc rankings.
      Śabara derives every step of the ladder from it, one pair at a time. That is what
      makes it a procedure rather than a list, and it is why it can be applied to cases
      Jaimini never saw.

    published_english_translation_of_this_exact_passage:
      obtainable: yes
      translator: "Mahāmahopādhyāya Ganganatha Jha"
      where: "Śābara-Bhāṣya, Vol. I (Adhyāyas I–III), Gaekwad's Oriental Series No. LXVI, Oriental Institute, Baroda, 1933"
      pages: "449–464 (Adhikaraṇa 7 opens on p. 449; Sūtra 15 / Adhikaraṇa 8 opens on p. 464)"
      url: "https://archive.org/details/shabarabhasyavol032868mbp"
      license: public-domain
      verified_how: >
        Downloaded the OCR text layer, located the running headers
        "DISCOURSE III, PĀDA III, ADHIKARAṆA (7)" on pp. 451–463, read the adhikaraṇa
        heading, the sūtra, and the closing paragraph. Quoted below verbatim.

      jha_translation_of_the_sutra: >
        "AMONG 'DIRECT ASSERTION', 'INDICATIVE POWER', 'SYNTACTICAL CONNECTION',
        'CONTEXT', 'PLACE' AND 'NAME', — THAT WHICH FOLLOWS IS WEAKER THAN THAT WHICH
        PRECEDES; — BECAUSE IT IS MORE REMOTE FROM THE FINAL OBJECTIVE."

      jha_adhikarana_heading: >
        "ADHIKARAṆA (7): Among the six means of determining the connection of subsidiaries
        — 'Direct Assertion', 'Indicative Power' and the rest, — that which precedes is
        more authoritative than that which follows."

      jha_closing_statement: >
        "...among the several means of knowledge in the case in question — viz. (1) 'Direct
        Assertion', (2) 'Indicative Power', (3) 'Syntactical Connection', (4) 'Context',
        (5) 'Order' and (6) 'Name', — the one that precedes is more authoritative than what
        follows, because in the case of the cognition obtained through it, even pondering
        over it, it is found that there is no contrary cognition sublating it."

    TERMINOLOGY_WARNING_read_before_using_jha: >
      Jha renders `sthāna` as "PLACE" in the sūtra but as "Order" throughout the discussion.
      This is NOT sloppiness — he is following Śabara, who himself substitutes `krama`
      (sequence) for `sthāna` when he works the examples ("atha kramasamākhyayoḥ virodhe...",
      "prakaraṇaṃ kramād balīyaḥ"). The two words name one thing: WHERE IN THE TEXTUAL
      SEQUENCE the item stands. If the project builds a term table, `sthāna` and `krama`
      must map to one concept or a downstream reader will invent a seventh criterion that
      does not exist. Kumārila's Tantravārttika uses "Position" for the same slot.

    the_six_with_sabara_own_definitions:
      # These are Śabara's, from the bhāṣya on this sūtra, not modern glosses.
      # Sanskrit quoted from GRETIL sa_jaimini-mImAMsAsUtra-1-7-comm.xml ad MS_3,3.14.
      - rank: 1
        term: śruti
        sanskrit_definition: "yad arthasyābhidhānaṃ śabdasya śravaṇamātrād evāvagamyate, sa śrutyāvagamyate, śravaṇaṃ śrutiḥ"
        gloss: "direct statement — meaning got from merely HEARING the word. Jha: 'Direct Assertion'."
      - rank: 2
        term: liṅga
        sanskrit_definition: "yat tāvac chabdasyārtham abhidhātuṃ sāmarthyam, tal liṅgam"
        gloss: "the capacity of a word to denote — inferential/indicative force. Jha: 'Indicative Power'."
      - rank: 3
        term: vākya
        sanskrit_definition: "ekārtham anekaṃ padaṃ vākyam"
        gloss: "several words expressing one idea — syntactic unity (ekavākyatā). Jha: 'Syntactical Connection'."
      - rank: 4
        term: prakaraṇa
        sanskrit_definition: "kartavyasyetikartavyatākāṅkṣasya vacanaṃ prakaraṇam"
        gloss: "the statement of a thing-to-be-done that still needs its how-to-do-it — i.e. mutual expectancy establishing a topic. Jha: 'Context'."
      - rank: 5
        term: sthāna
        sanskrit_definition: "anekasyāmnāyamānasya saṃnidhiviśeṣāmnānamātraṃ hi kramaḥ"
        gloss: "position in the recited sequence, nothing more. Śabara calls it krama throughout. Jha: 'Place' / 'Order'."
      - rank: 6
        term: samākhyā
        sanskrit_definition: "laukikaś ca śabdaḥ samākhyā"
        gloss: >
          a name, and a WORLDLY (non-Vedic) one at that — e.g. calling a section
          'pauroḍāśika'. Śabara: "na ca loka evaṃvidheṣv artheṣu pramāṇam" — ordinary
          usage is not authoritative in matters of this kind. This is why it is last.
          Jha: 'Name'.

    why_this_ranking_is_usable_as_an_adjudication_rule: >
      Two structural properties, both verified in the bhāṣya itself:
      (1) It is PAIRWISE and TRANSITIVE-BY-ARGUMENT, not merely asserted. Śabara argues
          six separate cases — (A) śruti > liṅga, (B) liṅga > vākya, (C) vākya > prakaraṇa,
          (D) prakaraṇa > krama, (E) krama > samākhyā, (F) the general theory of sublation
          — each with a pūrvapakṣa that says "these two are of EQUAL strength" (tulyabale
          ete kāraṇe) and a siddhānta that defeats it by arthaviprakarṣa. The rule therefore
          comes with its own worked objections. A project applying it inherits the
          objections too, which is exactly what makes it checkable rather than dogmatic.
      (2) It triggers ONLY ON CONFLICT. Śabara is explicit: "balīyān api hetur virudhyamānam
          abalīyāṃsaṃ bādhitum arhati nāviruddham" — a stronger reason sets aside a weaker
          one only when they CONFLICT, never when they agree. So the rule is silent in the
          ordinary case and speaks only where evidence contradicts itself. That is precisely
          the gap the project said distributional evidence leaves open.
      One caveat the project must carry: section (F) is disputed WITHIN the tradition.
      Jha's note records that Maṇḍana Miśra, in his Anukramaṇikā, treats (F) as a SEVENTH,
      distinct adhikaraṇa under the same sūtra, where Śabara treats it as the closing move
      of the sixth. The disagreement is about whether the sublation theory is general or
      local. Log it; do not resolve it.

