    JAIMINĪYA IS THE BEST-RECORDED ŚĀKHĀ IN THIS PACKET, INCLUDING THE NAMBUDIRI
    TRADITION. Four independent bodies of recording, in descending order of size:

    (A) IGNCA VEDIC HERITAGE PORTAL — **191 MP4 files**, a Richā (recitation) tab and a
        Gāna (chant) tab, at /samhitas/samaveda-samhitas/jaiminiya-samhita-2/. Media is
        JS-injected and invisible to scrapers; I verified files by direct HTTP.
        Richā: Āgneya, Aindra (36, boundary confirmed — 36 → 200, 37 → 404), Pāvamāna,
        Dvādaśāha, Uttara. Grāmageyagāna and Āraṇyageyagāna (Vrata, Arka, Dvandva).
        Files are large: a single Grāmageya track measured 118,565,670 bytes.
        DOCUMENTED GAP: four Āraṇyageyagāna sections — Mahāsāmamani, Ādityasāma,
        Mahānāmnyam, Jyeṣṭhasāma — have live endpoints and ZERO files.
        Licence RESTRICTIVE — see notes.
    (B) BRITISH LIBRARY, ARNOLD BAKE COLLECTION C52 — **wax cylinders of NAMBUDIRI
        JAIMINĪYA, recorded at Kottayam, 6–7 November 1933.** Verified by me in the BL's
        own catalogue; Bake's slip notes read verbatim: "[Samaveda, Nambudiri (Jaiminiya)]
        [Kottayam 6/11/'33 Aranyakagana]", "unaccompanied male vocal solo", catalogued as
        Bake India II Nos. 333, 333bis, 334, 334bis, 335, 335bis. Āraṇyakagāna
        (C52/1992–1997) and Grāmageyagāna (C52/1987–1991). Also film C52/FO/32,
        "Samaveda hand gestures" (1925) — recitation with mudrās.
        CONDITION WARNINGS ARE REAL: several catalogued as "almost inaudible… heavy mould
        on cylinder". Nothing streams; in-person listening by appointment.
    (C) SMITHSONIAN FOLKWAYS / ASCH — "The Four Vedas", Asch AHM 4126, 1969, recorded by
        John Levy and J.F. Staal. Staal's liner notes identify Record I/Side II bands 4–5
        (Tanjore, 1962) and Record II/Side II bands 1–3 (KERALA, 1957 and 1962) as
        JAIMINĪYA. In-copyright; on archive.org via Unlocked Recordings, no CC licence.
    (D) ARCHIVE.ORG COMMUNITY, TAMIL/ANDHRA — ~2 GB, verified by me via the metadata API:
