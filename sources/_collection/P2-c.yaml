      Verbatim from the preface of Alphabetical Catalogue Part I (1973):
        "Late Pandit Durgamohana Bhattacharya… was fortunate to get a complete manuscript of
         the Paippala Sakha of the Atharva Veda from Jagannathpur in P.S of Pipili, Dist. Puri
         which was not available in any other part of India inspite of thorough search of the
         last few decades. The first Kanda of this unique vedic work has been published as
         Calcutta Sanskrit College Research series No. 26 in 1964. THERE ARE TEN MANUSCRIPTS
